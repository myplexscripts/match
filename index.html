<script>
'use strict';

/* Targets are tuned against a bot playing random valid moves on this 6x8 board:
   that baseline is roughly 1.4k / 2.2k / 1.8k / 2.1k per level, so a target of
   ~0.8x baseline reads as a warm-up and ~1.4x demands deliberate play. */
const LEVELS = [
    { id: 1, moves: 18, target: 1200, colors: 5, desc: "MATCH 3 OR MORE TO FILL THE METER!" },
    { id: 2, moves: 22, target: 2000, colors: 5, desc: "BIGGER TARGET. KEEP THE CASCADES GOING!" },
    { id: 3, moves: 26, target: 2400, colors: 6, desc: "MORE COLORS. BUILD SPECIAL TILES!" },
    { id: 4, moves: 30, target: 3000, colors: 6, desc: "EXPERT MODE. COMBINE THE SPECIALS!" }
];

const SPECIALS = { NONE: 0, H_STRIPE: 1, V_STRIPE: 2, WRAP: 3, BOMB: 4 };

const POWER_UPS = {
    hammer: { icon: 'construction', name: 'Hammer', desc: 'Tap any tile to smash it instantly.' },
    shuffle: { icon: 'shuffle', name: 'Shuffle', desc: 'Reshuffle the whole board.' },
    extraMoves: { icon: 'add_circle', name: '+5 Moves', desc: 'Adds 5 extra moves to spend.' },
    colorBomb: { icon: 'auto_awesome', name: 'Color Bomb', desc: 'Drops a color bomb onto the board.' }
};

const PREMIUM_POWER_UPS = {
    megaHammer: { icon: 'bolt', name: 'Mega Hammer', desc: 'Tap a tile to smash its whole row.', cost: 40 },
    doubleBomb: { icon: 'stars', name: 'Double Bomb', desc: 'Drops two color bombs at once.', cost: 60 }
};

const ACTION_WORDS = ["BAM!", "RAD!", "BOOM!", "SICK!", "WILD!", "POP!", "SWEET!", "TASTY!"];

const SHAPES = { 1: 'piece-burst', 2: 'piece-sparkle', 3: 'piece-circle', 4: 'piece-diamond', 5: 'piece-x', 6: 'piece-8tip-star' };
const SPECIAL_SHAPES = { [SPECIALS.H_STRIPE]: 'piece-arrow-h', [SPECIALS.V_STRIPE]: 'piece-arrow-v', [SPECIALS.WRAP]: 'piece-corners', [SPECIALS.BOMB]: 'piece-bomb' };

const COLORS = {
    1: '#FFC567', 2: '#FB7DA8', 3: '#058CD7', 4: '#0D9488', 5: '#552C87', 6: '#FD5A46'
};
const COLORS_LIGHT = {
    1: '#FFDFAB', 2: '#FDB5CD', 3: '#63C5FB', 4: '#4FF0E1', 5: '#9F76D2', 6: '#FEA499'
};
const BG_TINTS = {
    1: 'rgba(255,197,103,.22)', 2: 'rgba(251,125,168,.20)', 3: 'rgba(5,140,215,.18)',
    4: 'rgba(13,148,136,.18)', 5: 'rgba(85,44,135,.16)', 6: 'rgba(253,90,70,.18)'
};

const THEMES = [
    { colorId: 3, accent: 'var(--color-blue-light)' },
    { colorId: 5, accent: 'var(--color-purple-light)' },
    { colorId: 2, accent: 'var(--color-pink-light)' },
    { colorId: 6, accent: 'var(--color-red-orange-light)' }
];

const TIER_COLORS = ['var(--color-true-yellow-base)', 'var(--color-yellow-orange-base)', 'var(--color-red-orange-base)'];
/* target/starMax is always 1/1.35 regardless of level, since starMax = target*1.35 */
const MILESTONE_PCTS = [100 / 1.35, 115 / 1.35, 100];

const COLS = 6;
const ROWS = 8;
const GAP = 7;
const MAX_CELL = 110;
const wait = ms => new Promise(res => setTimeout(res, ms));

/* ---------- Lottie confetti ---------- */

const CONFETTI_PALETTE = ['#FFC567', '#FB7DA8', '#058CD7', '#0D9488', '#552C87', '#FD5A46', '#EAB308', '#63C5FB'];

function hexToLottieColor(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];
}

/* Every keyframe but the last needs both its start ("s") AND end ("e") value
   plus bezier ease handles ("i"/"o") - without them lottie-web's SVG renderer
   computes nothing for that property and silently drops the whole layer. */
function lottieKeyframes(points) {
    const EASE = { i: { x: [0.42], y: [1] }, o: { x: [0.58], y: [0] } };
    return points.map((p, i) => i === points.length - 1
        ? { t: p.t, s: p.v }
        : { t: p.t, s: p.v, e: points[i + 1].v, ...EASE });
}

function buildConfettiLottieData(w, h) {
    const fr = 30, op = 80, count = 70;
    const layers = [];
    for (let i = 0; i < count; i++) {
        const startFrame = Math.random() * 15;
        const fadeInEnd = startFrame + 6;
        const fadeOutStart = op - 16;
        const startX = Math.random() * w;
        const endX = startX + (Math.random() * 2 - 1) * 90;
        const startY = -40 - Math.random() * h * 0.3;
        const endY = h + 60;
        const rotStart = Math.random() * 360;
        const rotEnd = rotStart + (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540);
        const color = hexToLottieColor(CONFETTI_PALETTE[Math.floor(Math.random() * CONFETTI_PALETTE.length)]);
        const isCircle = Math.random() < 0.4;
        const sizeW = isCircle ? 10 + Math.random() * 8 : 7 + Math.random() * 6;
        const sizeH = isCircle ? sizeW : 12 + Math.random() * 10;

        const shape = { nm: 'shape', p: { a: 0, k: [0, 0] }, s: { a: 0, k: [sizeW, sizeH] } };
        if (isCircle) { shape.ty = 'el'; } else { shape.ty = 'rc'; shape.r = { a: 0, k: 2 }; shape.d = 1; }

        layers.push({
            ddd: 0, ind: i + 1, ty: 4, nm: `c${i}`, sr: 1, ao: 0, ip: 0, op, st: 0,
            ks: {
                o: { a: 1, k: lottieKeyframes([
                    { t: startFrame, v: [0] }, { t: fadeInEnd, v: [100] },
                    { t: fadeOutStart, v: [100] }, { t: op, v: [0] }
                ]) },
                r: { a: 1, k: lottieKeyframes([{ t: startFrame, v: [rotStart] }, { t: op, v: [rotEnd] }]) },
                p: { a: 1, k: lottieKeyframes([{ t: startFrame, v: [startX, startY, 0] }, { t: op, v: [endX, endY, 0] }]) },
                a: { a: 0, k: [0, 0, 0] },
                s: { a: 0, k: [100, 100, 100] }
            },
            shapes: [{
                ty: 'gr', nm: 'piece',
                it: [
                    shape,
                    { ty: 'fl', nm: 'fill', c: { a: 0, k: color }, o: { a: 0, k: 100 } },
                    { ty: 'tr', p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }
                ]
            }]
        });
    }
    return { v: '5.9.6', fr, ip: 0, op, w, h, nm: 'confetti', ddd: 0, assets: [], layers };
}

class SFX {
    constructor() { this.ctx = null; this.muted = false; }
    ensure() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
    }
    tone(freq, dur = 0.12, type = 'sine', vol = 0.18, delay = 0) {
        if (this.muted) return;
        try {
            const ctx = this.ensure();
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(t0); osc.stop(t0 + dur + 0.03);
        } catch (e) { /* audio unavailable */ }
    }
    swap() { this.tone(320, 0.08, 'sine', 0.1); }
    invalid() { this.tone(150, 0.16, 'sawtooth', 0.1); }
    pop(streak = 1) { this.tone(420 + Math.min(streak, 6) * 55, 0.14, 'triangle', 0.16); }
    special() { this.tone(220, 0.3, 'sine', 0.14); this.tone(560, 0.28, 'sine', 0.1, 0.05); }
    shuffle() { this.tone(260, 0.2, 'square', 0.09); this.tone(330, 0.2, 'square', 0.07, 0.1); }
    win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.18, i * 0.12)); }
    lose() { [400, 340, 280].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.13, i * 0.15)); }
}

class Game {
    constructor() {
        this.grid = document.getElementById('grid');
        this.shell = document.getElementById('shell');
        this.boardEl = document.getElementById('board');
        this.stageEl = document.querySelector('.stage');
        this.scoreEl = document.getElementById('score-txt');
        this.movesEl = document.getElementById('moves-txt');
this.levelEl = document.getElementById('level-txt');
this.progressFill = document.getElementById('progressFill');
this.progressHead = document.getElementById('progressHead');
this.progressTrack = document.getElementById('progressTrack');
        this.bgWash = document.getElementById('bgWash');
        this.mileEls = [document.getElementById('mile1'), document.getElementById('mile2'), document.getElementById('mile3')];
        this.textLayer = document.getElementById('textLayer');
        this.flashEl = document.getElementById('screenFlash');
        this.canvas = document.getElementById('fxCanvas');
        this.ctx = this.canvas.getContext('2d', { alpha: true, desynchronized: true });

        this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        this.score = 0;
        this.moves = 0;
        this.currentLevelIdx = 0;
        this.isProcessing = true;
        this.selected = null;
        this.drag = null;
        this.lastSwap = null;
        this.lastActionAt = Date.now();
        this.hintActive = false;
        this.reachedMilestones = new Set();
        this.lastProgress = 0;

        this.inventory = { hammer: 0, shuffle: 0, extraMoves: 0, colorBomb: 0, megaHammer: 0, doubleBomb: 0 };
        this.pendingPowerUp = null;
        this.coins = 0;

        this.geom = { cell: 0, step: 0 };
        this.particles = [];
        this.rings = [];
        this.beams = [];
        this.perf = { last: performance.now(), frame: 0 };
        this.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

        this.sfx = new SFX();

        this.bindEvents();
        this.startIdleWatcher();
        this.startWatchdog();
        this.updatePowerUpTray();
        this.updateCoinDisplay();
        this.applyTheme(0);

        requestAnimationFrame(() => { this.refreshGeometry(); });
        window.addEventListener('load', () => this.refreshGeometry());

        this.showScreen(`LEVEL ${LEVELS[0].id}`, LEVELS[0].desc, 'PLAY', null, 'play');

        requestAnimationFrame(now => this.fxLoop(now));
    }

    /* ---------- Geometry & background ---------- */

    refreshGeometry() {
        const pad = 4;
        const stageRect = this.stageEl.getBoundingClientRect();
        const availW = stageRect.width - pad * 2;
        const availH = stageRect.height - 40 - pad * 2;
        const cellW = (availW - GAP * (COLS - 1)) / COLS;
        const cellH = (availH - GAP * (ROWS - 1)) / ROWS;
        const cell = Math.max(24, Math.min(MAX_CELL, Math.floor(Math.min(cellW, cellH))));
        this.geom.cell = cell;
        this.geom.step = cell + GAP;

        const boardW = cell * COLS + GAP * (COLS - 1) + pad * 2;
        const boardH = cell * ROWS + GAP * (ROWS - 1) + pad * 2;
        this.shell.style.width = `${boardW}px`;
        this.shell.style.height = `${boardH}px`;
        this.boardEl.style.width = `${boardW}px`;
        this.boardEl.style.height = `${boardH}px`;
        document.documentElement.style.setProperty('--board-pad', `${pad}px`);

        this.allTiles().forEach(t => {
            t.el.style.width = `${cell}px`;
            t.el.style.height = `${cell}px`;
            t.el.style.transform = this.tileTransform(t.r, t.c);
        });

        this.resizeCanvas();
    }

    resizeCanvas() {
        const rect = this.canvas.getBoundingClientRect();
        this.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        this.canvas.width = Math.round(rect.width * this.dpr);
        this.canvas.height = Math.round(rect.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    }

    pos(row, col) { return { x: col * this.geom.step, y: row * this.geom.step }; }

    tileTransform(row, col, scaleX = 1, scaleY = 1) {
        const p = this.pos(row, col);
        return `translate3d(${p.x}px,${p.y}px,0) scale(${scaleX},${scaleY})`;
    }

    canvasOffset() {
        const c = this.canvas.getBoundingClientRect();
        const s = this.shell.getBoundingClientRect();
        return { x: s.left - c.left, y: s.top - c.top };
    }

    shellPointForCell(row, col) {
        return { x: 4 + col * this.geom.step + this.geom.cell / 2, y: 4 + row * this.geom.step + this.geom.cell / 2 };
    }

    allTiles() {
        const out = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) out.push(this.board[r][c]);
        return out;
    }

    applyTheme(levelIdx) {
        const t = THEMES[levelIdx % THEMES.length];
        this.theme = t;
        document.documentElement.style.setProperty('--accent', t.accent);
        this.applyMatchColor(t.colorId);
    }

    applyMatchColor(colorId) {
        this.bgWash.style.backgroundColor = BG_TINTS[colorId] || 'rgba(255,255,255,0)';
    }

    /* ---------- Setup ---------- */

    bindEvents() {
        window.addEventListener('resize', () => this.refreshGeometry());
        window.addEventListener('orientationchange', () => setTimeout(() => this.refreshGeometry(), 120));
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('dblclick', e => e.preventDefault());
document.getElementById('mute-btn').addEventListener('click', () => this.toggleMute());
document.getElementById('shop-close-btn').addEventListener('click', () => this.closeShop());
document.getElementById('screen-btn').addEventListener('click', () => this.onScreenButton());
document.getElementById('screen-shop-btn').addEventListener('click', () => this.openShop());
    }

    toggleMute() {
        this.sfx.muted = !this.sfx.muted;
        this.sfx.ensure();
        document.getElementById('mute-icon').innerText = this.sfx.muted ? 'volume_off' : 'volume_up';
    }

    showScreen(title, desc, btnText, stars, action, showShop = false) {
    document.getElementById('screen-title').innerText = title;
    document.getElementById('screen-desc').innerText = desc;
    document.getElementById('screen-btn').innerText = btnText;
    document.getElementById('screen-shop-btn').hidden = !showShop;
    this.screenAction = action;
    const starsRow = document.getElementById('screen-stars');
    starsRow.innerHTML = '';
    if (stars !== null && stars !== undefined) {
        for (let i = 0; i < 3; i++) {
            const s = document.createElement('span');
            s.className = 'material-symbols-outlined star' + (i < stars ? ' filled' : '');
            s.innerText = 'star';
            starsRow.appendChild(s);
        }
    }
    document.getElementById('screen-overlay').classList.add('active');
}

    hideScreen() { document.getElementById('screen-overlay').classList.remove('active'); }

    onScreenButton() {
        if (this.screenAction === 'reward') {
            this.hideScreen();
            this.showRewardPicker();
            return;
        }
        this.startLevel();
    }

    async startLevel() {
        this.isProcessing = true;
        this.hideScreen();
        const config = LEVELS[this.currentLevelIdx] || LEVELS[LEVELS.length - 1];
        this.moves = config.moves;
        this.score = 0;
        this.targetScore = config.target;
        this.starMax = config.target * 1.35;
        this.numColors = config.colors;
        this.lastProgress = 0;
        this.reachedMilestones.clear();

        this.applyTheme(this.currentLevelIdx);
        this.progressTrack.classList.remove('tier-2', 'tier-3', 'full');
        this.pendingPowerUp = null;
        this.updatePowerUpTray();
        this.updateHUD(false);

        this.grid.innerHTML = '';
        this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        this.refreshGeometry();
        this.fillBoardInitial();

        await this.ensureSolvable();
        this.isProcessing = false;
    }

    fillBoardInitial() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let color;
                do { color = Math.floor(Math.random() * this.numColors) + 1; }
                while (
                    (c >= 2 && this.board[r][c - 1]?.color === color && this.board[r][c - 2]?.color === color) ||
                    (r >= 2 && this.board[r - 1][c]?.color === color && this.board[r - 2][c]?.color === color)
                );
                this.createTile(r, c, color, SPECIALS.NONE);
            }
        }
    }

    /* ---------- Tile DOM ---------- */

    createTile(row, col, color, special, dropFromOffset = 0) {
        const el = document.createElement('button');
        el.type = 'button';
        el.setAttribute('aria-label', 'game piece');

        // .tile itself is reserved exclusively for board-position transforms
        // (swap/fall/drag) - decorative scale/rotate/wiggle animations all
        // target .tile-inner instead, so the shadow and gem always move as
        // a single rigid unit and never fight a position-setting transform.
        const inner = document.createElement('span');
        inner.className = 'tile-inner';

        const shadow = document.createElement('span');
        shadow.className = 'tile-shadow';

        const gem = document.createElement('span');
        gem.className = 'gem';

        const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        icon.classList.add('tile-icon');
        icon.setAttribute('viewBox', '0 0 480 480');
        icon.setAttribute('aria-hidden', 'true');
        const iconUse = document.createElementNS('http://www.w3.org/2000/svg', 'use');
        icon.appendChild(iconUse);
        gem.appendChild(icon);

        inner.appendChild(shadow);
        inner.appendChild(gem);
        el.appendChild(inner);

        const tile = { id: `${Date.now()}_${Math.random().toString(36).slice(2)}`, r: row, c: col, color, special, el, inner, gem, icon, iconUse };
        this.board[row][col] = tile;

        this.setTileVisual(tile);
        el.style.width = `${this.geom.cell || 40}px`;
        el.style.height = `${this.geom.cell || 40}px`;
        const startRow = row - dropFromOffset;
        el.style.transform = this.tileTransform(startRow, col);

        el.addEventListener('pointerdown', e => this.onPointerDown(e, tile));
        el.addEventListener('click', () => this.onTileClick(tile));

        this.grid.appendChild(el);
        return tile;
    }

    setTileVisual(tile) {
        const cls = ['tile'];
        if (tile.special === SPECIALS.BOMB) {
            cls.push('special-bomb');
        } else {
            cls.push(`type-${tile.color}`);
            if (tile.special !== SPECIALS.NONE) cls.push('has-special');
        }
        if (this.selected === tile) cls.push('selected');
        tile.el.className = cls.join(' ');

        const symbolId = tile.special !== SPECIALS.NONE ? SPECIAL_SHAPES[tile.special] : SHAPES[tile.color];
        tile.iconUse.setAttribute('href', `#${symbolId}`);
        tile.iconUse.setAttributeNS('http://www.w3.org/1999/xlink', 'href', `#${symbolId}`);
    }

    /* ---------- HUD ---------- */

    bumpEl(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

    updateHUD(celebrate = true) {
        this.movesEl.innerText = this.moves;
        this.levelEl.innerText = this.currentLevelIdx + 1;
        this.scoreEl.innerText = this.score;

        const progress = Math.max(0, Math.min(100, (this.score / this.starMax) * 100));
this.progressFill.style.width = `${progress}%`;
this.progressHead.style.left = `calc(2px + (100% - 4px) * ${progress / 100})`;
this.progressTrack.classList.toggle('full', this.score >= this.starMax);

        const banked = this.computeBankedStars();
        this.progressTrack.classList.toggle('tier-2', banked >= 2);
        this.progressTrack.classList.toggle('tier-3', banked >= 3);

        MILESTONE_PCTS.forEach((pt, i) => {
            const passed = progress >= pt - 0.01;
            this.mileEls[i].style.left = `${Math.min(100, pt)}%`;
            this.mileEls[i].classList.toggle('passed', passed);
            if (passed && !this.reachedMilestones.has(i) && celebrate) {
                this.reachedMilestones.add(i);
                this.milestoneCelebrate(i, pt);
            } else if (passed) {
                this.reachedMilestones.add(i);
            }
        });

        if (progress > this.lastProgress && celebrate) {
            const p = this.shellPointForCell(0, 0);
            const headPct = progress / 100;
            const trackRect = this.progressTrack.getBoundingClientRect();
            const shellRect = this.shell.getBoundingClientRect();
            const x = (trackRect.left - shellRect.left) + trackRect.width * headPct;
            const y = (trackRect.top - shellRect.top) + trackRect.height / 2;
            if (Math.random() > 0.55) this.particleBurst(x, y, banked + 3, 4);
        }
        this.lastProgress = progress;
    }

    computeBankedStars() {
        if (!this.targetScore) return 0;
        const ratio = this.score / this.targetScore;
        if (ratio >= 1.35) return 3;
        if (ratio >= 1.15) return 2;
        if (ratio >= 1) return 1;
        return 0;
    }

    computeStars() {
        const ratio = this.score / this.targetScore;
        if (ratio >= 1.35) return 3;
        if (ratio >= 1.15) return 2;
        return 1;
    }

    milestoneCelebrate(index, pct) {
        const el = this.mileEls[index];
        el.animate(
            [
                { transform: 'translate(-50%,-50%) scale(1)' },
                { transform: 'translate(-50%,-50%) scale(1.6)', offset: .45 },
                { transform: 'translate(-50%,-50%) scale(1.1)' }
            ],
            { duration: 520, easing: 'cubic-bezier(.16,.84,.22,1)' }
        );
        const trackRect = this.progressTrack.getBoundingClientRect();
        const shellRect = this.shell.getBoundingClientRect();
        const x = (trackRect.left - shellRect.left) + trackRect.width * (pct / 100);
        const y = (trackRect.top - shellRect.top) + trackRect.height / 2;
        const color = TIER_COLORS[index] === 'var(--color-true-yellow-base)' ? '#EAB308' : (index === 1 ? '#FFC567' : '#FD5A46');
        this.ringBurst(x, y, color, 40 + index * 8);
        this.particleBurst(x, y, index + 1, 10 + index * 3);
        this.progressToast(['1 STAR!', '2 STARS!', '3 STARS!'][index]);
        this.sfx.special();
        this.vibrate(14 + index * 5);
    }

    addScore(pts) {
        this.score += pts;
        this.updateHUD(true);
        this.bumpEl(this.scoreEl.closest('.pill'));
    }

    /* ---------- Interaction ---------- */

    onTileClick(tile) {
        if (this.isProcessing || this.drag?.moved) return;
        this.resetIdleTimer();

        if (this.pendingPowerUp === 'hammer') { this.useHammer(tile); return; }
        if (this.pendingPowerUp === 'megaHammer') { this.useMegaHammer(tile); return; }

        if (!this.selected) {
            this.selected = tile;
            this.setTileVisual(tile);
            this.microPulse(tile);
            return;
        }
        if (this.selected === tile) { this.clearSelection(); return; }

        const dist = Math.abs(this.selected.r - tile.r) + Math.abs(this.selected.c - tile.c);
        if (dist === 1) {
            const a = this.selected;
            this.clearSelection();
            this.attemptSwap(a, tile);
        } else {
            this.clearSelection();
            this.selected = tile;
            this.setTileVisual(tile);
            this.microPulse(tile);
        }
    }

    onPointerDown(e, tile) {
        if (this.isProcessing) return;
        this.resetIdleTimer();
        if (this.pendingPowerUp === 'hammer' || this.pendingPowerUp === 'megaHammer') return;

        this.drag = { tile, startX: e.clientX, startY: e.clientY, moved: false };
        tile.el.setPointerCapture?.(e.pointerId);
        tile.el.addEventListener('pointermove', this._onPointerMove ||= ev => this.onPointerMove(ev));
        tile.el.addEventListener('pointerup', ev => this.onPointerUp(ev), { once: true });
        tile.el.addEventListener('pointercancel', () => this.onPointerCancel(), { once: true });

        tile.inner.animate([{ transform: 'scale(1)' }, { transform: 'scale(.94)' }], { duration: 90, fill: 'forwards', easing: 'cubic-bezier(.2,.8,.2,1)' });
    }

    onPointerMove(e) {
        if (!this.drag || this.isProcessing) return;
        const dx = e.clientX - this.drag.startX;
        const dy = e.clientY - this.drag.startY;
        const dominantX = Math.abs(dx) >= Math.abs(dy);
        const limit = this.geom.cell * .34;
        const d = dominantX ? dx : dy;
        const clamped = Math.max(-limit, Math.min(limit, d));
        if (Math.abs(d) > 4) this.drag.moved = true;

        const base = this.pos(this.drag.tile.r, this.drag.tile.c);
        const tx = base.x + (dominantX ? clamped : 0);
        const ty = base.y + (dominantX ? 0 : clamped);
        this.drag.tile.el.style.transform = `translate3d(${tx}px,${ty}px,0) scale(1.02)`;
    }

    cleanupPointer(tile) {
        tile.el.removeEventListener('pointermove', this._onPointerMove);
        tile.inner.getAnimations().forEach(a => a.cancel());
        tile.inner.style.transform = '';
    }

    onPointerCancel() {
        if (!this.drag) return;
        const tile = this.drag.tile;
        tile.el.style.transform = this.tileTransform(tile.r, tile.c);
        this.cleanupPointer(tile);
        this.drag = null;
    }

    onPointerUp(e) {
        if (!this.drag || this.isProcessing) return;
        const state = this.drag;
        const tile = state.tile;
        this.cleanupPointer(tile);

        const dx = e.clientX - state.startX;
        const dy = e.clientY - state.startY;
        const threshold = Math.max(16, this.geom.cell * 0.3);

        if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) {
            tile.el.style.transform = this.tileTransform(tile.r, tile.c);
            this.drag = null;
            return;
        }

        let nr = tile.r, nc = tile.c;
        if (Math.abs(dx) > Math.abs(dy)) nc += dx > 0 ? 1 : -1; else nr += dy > 0 ? 1 : -1;

        this.drag = null;
        this.clearSelection();

        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && this.board[nr][nc]) {
            if (this.pendingPowerUp === 'hammer') { this.useHammer(tile); return; }
            if (this.pendingPowerUp === 'megaHammer') { this.useMegaHammer(tile); return; }
            this.attemptSwap(tile, this.board[nr][nc]);
        } else {
            this.springBack(tile);
        }
    }

    async springBack(tile) {
        const p = this.pos(tile.r, tile.c);
        const current = tile.el.style.transform;
        const a = tile.el.animate(
            [{ transform: current }, { transform: `translate3d(${p.x}px,${p.y}px,0) scale(.985)` }, { transform: this.tileTransform(tile.r, tile.c) }],
            { duration: 180, easing: 'cubic-bezier(.18,.9,.2,1)' }
        );
        await this.safeFinished(a);
        tile.el.style.transform = this.tileTransform(tile.r, tile.c);
    }

    microPulse(tile) {
        tile.inner.animate(
            [{ transform: 'scale(1)' }, { transform: 'scale(.93)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }],
            { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' }
        );
    }

    clearSelection() {
        if (this.selected) { const t = this.selected; this.selected = null; this.setTileVisual(t); }
    }

    resetIdleTimer() { this.lastActionAt = Date.now(); }

    /* ---------- Swap & match resolution ---------- */

    swapData(p1, p2) {
        const ar = p1.r, ac = p1.c, br = p2.r, bc = p2.c;
        this.board[ar][ac] = p2; this.board[br][bc] = p1;
        p1.r = br; p1.c = bc; p2.r = ar; p2.c = ac;
    }

    updatePositions() {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) this.board[r][c].el.style.transform = this.tileTransform(r, c);
    }

    async animateSwap(a, b, forward = true) {
        const aStart = this.tileTransform(a.r, a.c);
        const bStart = this.tileTransform(b.r, b.c);
        const aEnd = this.tileTransform(b.r, b.c);
        const bEnd = this.tileTransform(a.r, a.c);
        const options = { duration: forward ? 155 : 170, easing: forward ? 'cubic-bezier(.22,.76,.22,1)' : 'cubic-bezier(.28,.75,.22,1)', fill: 'forwards' };

        const aa = a.el.animate([{ transform: aStart, offset: 0 }, { transform: aEnd.replace('scale(1,1)', 'scale(1.045,1.045)'), offset: .72 }, { transform: aEnd, offset: 1 }], options);
        const bb = b.el.animate([{ transform: bStart, offset: 0 }, { transform: bEnd.replace('scale(1,1)', 'scale(1.045,1.045)'), offset: .72 }, { transform: bEnd, offset: 1 }], options);
        await Promise.all([this.safeFinished(aa), this.safeFinished(bb)]);
        a.el.style.transform = aEnd; b.el.style.transform = bEnd;
    }

    async attemptSwap(p1, p2) {
        if (!p1 || !p2 || this.isProcessing || this.moves <= 0) return;
        this.isProcessing = true;
        this.sfx.swap();

        await this.animateSwap(p1, p2, true);
        this.swapData(p1, p2);
        p1.el.style.transform = this.tileTransform(p1.r, p1.c);
        p2.el.style.transform = this.tileTransform(p2.r, p2.c);

        const comboResult = this.checkSpecialCombo(p1, p2);
        let matchGroups = comboResult.isCombo ? [] : this.findMatches();

        if (!comboResult.isCombo && matchGroups.length === 0) {
            this.sfx.invalid();
            this.invalidFeedback(p1, p2);
            await wait(260);
            await this.animateSwap(p1, p2, false);
            this.swapData(p1, p2);
            p1.el.style.transform = this.tileTransform(p1.r, p1.c);
            p2.el.style.transform = this.tileTransform(p2.r, p2.c);
            this.isProcessing = false;
            return;
        }

        this.moves--;
        this.bumpEl(this.movesEl.closest('.pill'));
        this.updateHUD();

        this.lastSwap = { p1, p2 };
        await this.resolveBoard(matchGroups, comboResult);
    }

    invalidFeedback(a, b) {
        for (const tile of [a, b]) {
            tile.inner.animate(
                [{ transform: 'translateX(0)' }, { transform: 'translateX(-8%) rotate(-2deg)' }, { transform: 'translateX(8%) rotate(2deg)' }, { transform: 'translateX(0)' }],
                { duration: 260, easing: 'ease-out' }
            );
        }
        this.vibrate(12);
    }

    findMatches() {
        let horiz = [], vert = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                let col = this.board[r][c]?.color;
                if (!col || this.board[r][c].special === SPECIALS.BOMB) continue;
                let len = 1; while (c + len < COLS && this.board[r][c + len]?.color === col && this.board[r][c + len].special !== SPECIALS.BOMB) len++;
                if (len >= 3) { let g = []; for (let i = 0; i < len; i++) g.push(this.board[r][c + i]); horiz.push(g); c += len - 1; }
            }
        }
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                let col = this.board[r][c]?.color;
                if (!col || this.board[r][c].special === SPECIALS.BOMB) continue;
                let len = 1; while (r + len < ROWS && this.board[r + len][c]?.color === col && this.board[r + len][c].special !== SPECIALS.BOMB) len++;
                if (len >= 3) { let g = []; for (let i = 0; i < len; i++) g.push(this.board[r + i][c]); vert.push(g); r += len - 1; }
            }
        }
        let all = [...horiz, ...vert], merged = [];
        while (all.length > 0) {
            let cur = new Set(all.shift()), found = true;
            while (found) {
                found = false;
                for (let i = 0; i < all.length; i++) {
                    if (all[i].some(p => cur.has(p))) { all[i].forEach(p => cur.add(p)); all.splice(i, 1); found = true; break; }
                }
            }
            merged.push(Array.from(cur));
        }
        return merged;
    }

    simulateSwapHasMatch(r1, c1, r2, c2) {
        const b = this.board;
        const a = b[r1][c1], d = b[r2][c2];
        b[r1][c1] = d; b[r2][c2] = a;
        const hasMatch = this.findMatches().length > 0;
        b[r1][c1] = a; b[r2][c2] = d;
        return hasMatch;
    }

    hasPossibleMove() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (!p) continue;
                if (c < COLS - 1) {
                    const q = this.board[r][c + 1];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r, c + 1))) return true;
                }
                if (r < ROWS - 1) {
                    const q = this.board[r + 1][c];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r + 1, c))) return true;
                }
            }
        }
        return false;
    }

    findHintMove() {
        const moves = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (!p) continue;
                if (c < COLS - 1) {
                    const q = this.board[r][c + 1];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r, c + 1))) moves.push([p, q]);
                }
                if (r < ROWS - 1) {
                    const q = this.board[r + 1][c];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r + 1, c))) moves.push([p, q]);
                }
            }
        }
        if (!moves.length) return null;
        return moves[Math.floor(Math.random() * moves.length)];
    }

    showHint() {
        const move = this.findHintMove();
        if (!move) return;
        this.hintActive = true;
        for (const tile of move) {
            tile.inner.animate(
                [
                    { transform: 'scale(1)' },
                    { transform: 'scale(1.13)', offset: .35 },
                    { transform: 'scale(.97)', offset: .65 },
                    { transform: 'scale(1)' }
                ],
                { duration: 720, easing: 'ease-in-out', iterations: 2 }
            );
        }
        setTimeout(() => {
            this.hintActive = false;
            this.resetIdleTimer();
        }, 1440);
    }

    async ensureSolvable() { if (!this.hasPossibleMove()) await this.reshuffleBoard(); }

    async reshuffleBoard() {
        this.comboFeedback('SHUFFLING!');
        this.sfx.shuffle();

        this.allTiles().forEach(p => {
            p.el.style.transition = 'transform .3s ease, opacity .3s ease';
            p.el.style.opacity = '0';
        });
        await wait(320);

        let attempts = 0;
        do {
            this.grid.innerHTML = '';
            this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
            this.fillBoardInitial();
            attempts++;
        } while (!this.hasPossibleMove() && attempts < 20);

        await wait(60);
    }

    checkSpecialCombo(p1, p2) {
        const s1 = p1.special, s2 = p2.special;
        if (s1 === SPECIALS.NONE && s2 === SPECIALS.NONE) return { isCombo: false };

        if (s1 === SPECIALS.NONE || s2 === SPECIALS.NONE) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : (s2 === SPECIALS.BOMB ? p2 : null);
            if (bomb) { const normal = bomb === p1 ? p2 : p1; return { isCombo: true, type: 'BOMB_COLOR', color: normal.color, origin: bomb }; }
            return { isCombo: false };
        }

        if (s1 === SPECIALS.BOMB && s2 === SPECIALS.BOMB) return { isCombo: true, type: 'BOMB_BOMB' };
        if (s1 === SPECIALS.BOMB || s2 === SPECIALS.BOMB) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : p2;
            const other = bomb === p1 ? p2 : p1;
            return { isCombo: true, type: 'BOMB_SPECIAL', origin: bomb, other };
        }
        const isStripe = s => s === SPECIALS.H_STRIPE || s === SPECIALS.V_STRIPE;
        if (isStripe(s1) && isStripe(s2)) return { isCombo: true, type: 'STRIPE_STRIPE', origin: p2 };
        if (s1 === SPECIALS.WRAP && s2 === SPECIALS.WRAP) return { isCombo: true, type: 'WRAP_WRAP', origin: p2 };

        const wrapPiece = s1 === SPECIALS.WRAP ? p1 : p2;
        return { isCombo: true, type: 'STRIPE_WRAP', origin: wrapPiece };
    }

    async resolveBoard(initialGroups, initialCombo) {
        let groups = initialGroups, combo = initialCombo, comboCount = 0;

        while (groups.length > 0 || combo?.isCombo) {
            let toDestroy = new Set(), spawnQ = [];
            let matchColor = null;
            comboCount++;

            if (combo?.isCombo) {
                this.sfx.special();
                if (combo.type === 'BOMB_BOMB') {
                    this.allTiles().forEach(t => toDestroy.add(t));
                    this.flashScreen(.5);
                    this.ringBurst(...Object.values(this.shellPointForCell(ROWS / 2, COLS / 2)), '#FFC567', 120);
                } else if (combo.type === 'BOMB_COLOR') {
                    matchColor = combo.color;
                    toDestroy.add(combo.origin);
                    this.allTiles().forEach(t => { if (t.color === combo.color) toDestroy.add(t); });
                    this.flashScreen(.4);
                    const p = this.shellPointForCell(combo.origin.r, combo.origin.c);
                    this.ringBurst(p.x, p.y, COLORS[combo.color], 100);
                } else if (combo.type === 'BOMB_SPECIAL') {
                    matchColor = combo.other.color;
                    toDestroy.add(combo.origin); toDestroy.add(combo.other);
                    this.allTiles().forEach(t => { if (t.color === combo.other.color) toDestroy.add(t); });
                    this.flashScreen(.4);
                    const p = this.shellPointForCell(combo.origin.r, combo.origin.c);
                    this.ringBurst(p.x, p.y, COLORS[combo.other.color], 100);
                } else if (combo.type === 'WRAP_WRAP') {
                    matchColor = combo.origin.color;
                    toDestroy.add(combo.origin);
                    for (let r = Math.max(0, combo.origin.r - 2); r <= Math.min(ROWS - 1, combo.origin.r + 2); r++)
                        for (let c = Math.max(0, combo.origin.c - 2); c <= Math.min(COLS - 1, combo.origin.c + 2); c++)
                            if (this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.flashScreen(.35);
                    const p = this.shellPointForCell(combo.origin.r, combo.origin.c);
                    this.ringBurst(p.x, p.y, COLORS[combo.origin.color], 90);
                } else if (combo.type === 'STRIPE_WRAP') {
                    matchColor = combo.origin.color;
                    toDestroy.add(combo.origin);
                    for (let dr = -1; dr <= 1; dr++) { const rr = combo.origin.r + dr; if (rr < 0 || rr >= ROWS) continue; for (let c = 0; c < COLS; c++) if (this.board[rr][c]) toDestroy.add(this.board[rr][c]); }
                    for (let dc = -1; dc <= 1; dc++) { const cc = combo.origin.c + dc; if (cc < 0 || cc >= COLS) continue; for (let r = 0; r < ROWS; r++) if (this.board[r][cc]) toDestroy.add(this.board[r][cc]); }
                    const p = this.shellPointForCell(combo.origin.r, combo.origin.c);
                    this.ringBurst(p.x, p.y, COLORS[combo.origin.color], 70);
                } else if (combo.type === 'STRIPE_STRIPE') {
                    matchColor = combo.origin.color;
                    toDestroy.add(combo.origin);
                    for (let c = 0; c < COLS; c++) if (this.board[combo.origin.r][c]) toDestroy.add(this.board[combo.origin.r][c]);
                    for (let r = 0; r < ROWS; r++) if (this.board[r][combo.origin.c]) toDestroy.add(this.board[r][combo.origin.c]);
                    const p = this.shellPointForCell(combo.origin.r, combo.origin.c);
                    this.beamCross(p.x, p.y, COLORS[combo.origin.color]);
                }
                combo = null;
            }

            groups.forEach(g => {
                g.forEach(p => toDestroy.add(p));
                const points = g.length * 10 * comboCount;
                this.addScore(points);

                const mid = Math.floor(g.length / 2);
                const fp = this.shellPointForCell(g[mid].r, g[mid].c);
                this.floatingScore(fp.x, fp.y, `+${points}`);

                let xs = g.map(p => p.c), ys = g.map(p => p.r);
                let w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;

                let sP = g[0];
                if (this.lastSwap && (g.includes(this.lastSwap.p1) || g.includes(this.lastSwap.p2))) {
                    sP = g.includes(this.lastSwap.p1) ? this.lastSwap.p1 : this.lastSwap.p2;
                }

                if (g.length >= 5 && (w >= 5 || h >= 5)) spawnQ.push({ r: sP.r, c: sP.c, col: 0, sp: SPECIALS.BOMB });
                else if (w >= 3 && h >= 3) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.WRAP });
                else if (w === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.V_STRIPE });
                else if (h === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.H_STRIPE });
            });

            if (groups.length > 0) {
                let primary = groups[0];
                if (this.lastSwap) {
                    const swapGroup = groups.find(g => g.includes(this.lastSwap.p1) || g.includes(this.lastSwap.p2));
                    if (swapGroup) primary = swapGroup;
                } else if (groups.length > 1) {
                    primary = groups.reduce((a, b) => (b.length > a.length ? b : a), groups[0]);
                }
                if (primary[0]) matchColor = primary[0].color;
            }
            if (matchColor) this.applyMatchColor(matchColor);

            let q = Array.from(toDestroy), done = new Set();
            while (q.length > 0) {
                let p = q.shift();
                if (done.has(p)) continue;
                done.add(p); toDestroy.add(p);

                if (p.special === SPECIALS.H_STRIPE) { for (let c = 0; c < COLS; c++) if (this.board[p.r][c] && !done.has(this.board[p.r][c])) q.push(this.board[p.r][c]); }
                else if (p.special === SPECIALS.V_STRIPE) { for (let r = 0; r < ROWS; r++) if (this.board[r][p.c] && !done.has(this.board[r][p.c])) q.push(this.board[r][p.c]); }
                else if (p.special === SPECIALS.WRAP) {
                    for (let r = Math.max(0, p.r - 1); r <= Math.min(ROWS - 1, p.r + 1); r++)
                        for (let c = Math.max(0, p.c - 1); c <= Math.min(COLS - 1, p.c + 1); c++)
                            if (this.board[r][c] && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                } else if (p.special === SPECIALS.BOMB) {
                    let tc = Math.floor(Math.random() * this.numColors) + 1;
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === tc && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                }
            }

            if (toDestroy.size > 7) {
                this.shell.animate(
                    [{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(1.014) rotate(-.25deg)' }, { transform: 'scale(.997) rotate(.18deg)' }, { transform: 'scale(1) rotate(0)' }],
                    { duration: 250, easing: 'ease-out' }
                );
            }

            if (toDestroy.size > 0) {
                this.sfx.pop(comboCount);
                if (comboCount > 1) {
                    const word = ACTION_WORDS[Math.floor(Math.random() * ACTION_WORDS.length)];
                    this.comboFeedback(`${word} x${comboCount}`);
                }

                const destroyList = Array.from(toDestroy);
                const stagger = Math.min(18, 160 / Math.max(1, destroyList.length));
                const pops = destroyList.map((p, i) => this.popTile(p, i * stagger));
                await Promise.all(pops);
                for (const p of destroyList) { this.board[p.r][p.c] = null; }
            }

            spawnQ.forEach(s => this.spawnSpecial(s.r, s.c, s.col, s.sp));
            await this.applyGravity();
            this.lastSwap = null;
            groups = this.findMatches();
        }

        if (this.moves > 0 && this.score < this.starMax) await this.ensureSolvable();
        this.checkWinLoss();
    }

    async popTile(tile, delay) {
        const p = this.shellPointForCell(tile.r, tile.c);
        const big = tile.special !== SPECIALS.NONE;
        await wait(delay);
        this.particleBurst(p.x, p.y, tile.special === SPECIALS.BOMB ? (Math.floor(Math.random() * 6) + 1) : tile.color, big ? 14 : 8);
        const anim = tile.inner.animate(
            [{ transform: 'scale(1)', opacity: 1, offset: 0 }, { transform: 'scale(1.18)', opacity: 1, offset: .38 }, { transform: 'scale(.18)', opacity: 0, offset: 1 }],
            { duration: 190, easing: 'cubic-bezier(.3,.82,.35,1)', fill: 'forwards' }
        );
        await this.safeFinished(anim);
        tile.el.remove();
    }

    spawnSpecial(r, c, color, special) {
        const existing = this.board[r][c];
        if (existing) existing.el.remove();
        const tile = this.createTile(r, c, color, special);
        tile.el.style.transform = this.tileTransform(r, c);
        tile.inner.animate(
            [{ transform: 'scale(.82) rotate(-6deg)' }, { transform: 'scale(1.18) rotate(5deg)' }, { transform: 'scale(.97) rotate(-2deg)' }, { transform: 'scale(1) rotate(0)' }],
            { duration: 340, easing: 'cubic-bezier(.16,.84,.22,1)' }
        );
        const p = this.shellPointForCell(r, c);
        this.ringBurst(p.x, p.y, special === SPECIALS.BOMB ? '#FFC567' : COLORS[color], 42);
        this.particleBurst(p.x, p.y, color || 1, 12);
        return tile;
    }

    async applyGravity() {
        const animations = [];
        for (let c = 0; c < COLS; c++) {
            const survivors = [];
            for (let r = ROWS - 1; r >= 0; r--) { const t = this.board[r][c]; if (t) survivors.push(t); }
            const holes = ROWS - survivors.length;
            const column = Array(ROWS).fill(null);

            let write = ROWS - 1;
            for (const tile of survivors) {
                const oldRow = tile.r;
                const newRow = write--;
                column[newRow] = tile;
                if (oldRow !== newRow) {
                    const distance = newRow - oldRow;
                    tile.r = newRow; tile.c = c;
                    animations.push(this.animateFall(tile, oldRow, newRow, distance));
                }
            }

            for (let r = holes - 1; r >= 0; r--) {
                const color = Math.floor(Math.random() * this.numColors) + 1;
                const startRow = -(holes - r) - 1;
                const tile = this.createTile(r, c, color, SPECIALS.NONE, -(startRow - r));
                column[r] = tile;
                animations.push(this.animateSpawnFall(tile, startRow, r, holes - r));
            }

            for (let r = 0; r < ROWS; r++) this.board[r][c] = column[r];
        }
        await Promise.all(animations);
    }

    async animateFall(tile, oldRow, newRow, distance) {
        const start = this.tileTransform(oldRow, tile.c);
        const end = this.tileTransform(newRow, tile.c);
        const p = this.pos(newRow, tile.c);
        const duration = Math.min(340, 155 + distance * 34);
        const anim = tile.el.animate(
            [
                { transform: start, offset: 0 },
                { transform: `translate3d(${p.x}px,${p.y}px,0) scale(1.01,.985)`, offset: .82 },
                { transform: `translate3d(${p.x}px,${p.y}px,0) scale(1.06,.92)`, offset: .91 },
                { transform: `translate3d(${p.x}px,${p.y}px,0) scale(.98,1.035)`, offset: .97 },
                { transform: end, offset: 1 }
            ],
            { duration, easing: 'cubic-bezier(.16,.72,.18,1)', fill: 'forwards' }
        );
        await this.safeFinished(anim);
        tile.el.style.transform = end;
    }

    async animateSpawnFall(tile, startRow, newRow, distance) {
        const start = this.tileTransform(startRow, tile.c, .86, .86);
        const p = this.pos(newRow, tile.c);
        const end = this.tileTransform(newRow, tile.c);
        const duration = Math.min(390, 205 + distance * 36);
        tile.el.style.transform = start;
        tile.el.style.opacity = '.25';
        const anim = tile.el.animate(
            [
                { transform: start, opacity: .25, offset: 0 },
                { transform: `translate3d(${p.x}px,${p.y}px,0) scale(1.015,.985)`, opacity: 1, offset: .82 },
                { transform: `translate3d(${p.x}px,${p.y}px,0) scale(1.07,.91)`, opacity: 1, offset: .91 },
                { transform: `translate3d(${p.x}px,${p.y}px,0) scale(.98,1.04)`, opacity: 1, offset: .97 },
                { transform: end, opacity: 1, offset: 1 }
            ],
            { duration, easing: 'cubic-bezier(.14,.72,.18,1)', fill: 'forwards' }
        );
        await this.safeFinished(anim);
        tile.el.style.transform = end;
        tile.el.style.opacity = '1';
    }

    /* ---------- Coins & Shop ---------- */

    updateCoinDisplay() {
        document.getElementById('coin-txt').innerText = this.coins;
        document.getElementById('shop-coin-txt').innerText = this.coins;
    }

    addCoins(n) {
        this.coins += n;
        this.updateCoinDisplay();
        this.bumpEl(document.getElementById('coin-chip'));
    }

    openShop() {
        const row = document.getElementById('shop-row');
        row.innerHTML = '';
        Object.keys(PREMIUM_POWER_UPS).forEach(type => {
            const def = PREMIUM_POWER_UPS[type];
            const affordable = this.coins >= def.cost;
            const card = document.createElement('div');
            card.className = 'reward-card premium' + (affordable ? '' : ' unaffordable');
            card.innerHTML = `<span class="material-symbols-outlined">${def.icon}</span><span class="rc-name">${def.name}</span><span class="rc-desc">${def.desc}</span><span class="rc-cost"><span class="material-symbols-outlined">paid</span>${def.cost}</span>`;
            if (affordable) card.addEventListener('click', () => this.buyPremium(type));
            row.appendChild(card);
        });
        this.updateCoinDisplay();
        document.getElementById('shop-overlay').classList.add('active');
    }

    closeShop() { document.getElementById('shop-overlay').classList.remove('active'); }

    buyPremium(type) {
        const def = PREMIUM_POWER_UPS[type];
        if (!def || this.coins < def.cost) return;
        this.coins -= def.cost;
        this.inventory[type] = (this.inventory[type] || 0) + 1;
        this.sfx.special();
        this.updateCoinDisplay();
        this.updatePowerUpTray();
        this.openShop();
    }

    /* ---------- Power-ups ---------- */

    updatePowerUpTray() {
        const tray = document.getElementById('powerup-tray');
        if (!tray) return;
        tray.innerHTML = '';
        const renderOne = (type, def, premium) => {
            const count = this.inventory[type] || 0;
            const btn = document.createElement('button');
            btn.className = 'pu-btn'
                + (count === 0 ? ' empty' : '')
                + (this.pendingPowerUp === type ? ' armed' : '')
                + (premium ? ' premium' : '');
            btn.setAttribute('aria-label', `${def.name} (${count})`);
            btn.innerHTML = `<span class="material-symbols-outlined">${def.icon}</span><span class="pu-count">${count}</span>`;
            btn.addEventListener('click', () => this.usePowerUp(type));
            tray.appendChild(btn);
        };
        Object.keys(POWER_UPS).forEach(type => renderOne(type, POWER_UPS[type], false));
        Object.keys(PREMIUM_POWER_UPS).forEach(type => renderOne(type, PREMIUM_POWER_UPS[type], true));
    }

    usePowerUp(type) {
        if (this.isProcessing) return;
        if (!this.inventory[type]) return;

        if (type === 'hammer' || type === 'megaHammer') {
            this.pendingPowerUp = this.pendingPowerUp === type ? null : type;
            this.updatePowerUpTray();
            return;
        }

        this.inventory[type]--;
        this.sfx.special();

        if (type === 'shuffle') {
            this.isProcessing = true;
            this.updatePowerUpTray();
            this.reshuffleBoard().then(() => { this.isProcessing = false; });
        } else if (type === 'extraMoves') {
            this.moves += 5;
            this.bumpEl(this.movesEl.closest('.pill'));
            this.updateHUD();
            this.updatePowerUpTray();
        } else if (type === 'colorBomb') {
            this.dropColorBombs(1);
            this.updatePowerUpTray();
        } else if (type === 'doubleBomb') {
            this.dropColorBombs(2);
            this.updatePowerUpTray();
        }
    }

    async useHammer(tile) {
        this.pendingPowerUp = null;
        this.inventory.hammer--;
        this.updatePowerUpTray();
        this.isProcessing = true;
        this.sfx.pop(1);
        await this.popTile(tile, 0);
        this.board[tile.r][tile.c] = null;
        this.addScore(20);
        await this.applyGravity();
        if (this.moves > 0 && this.score < this.starMax) await this.ensureSolvable();
        this.checkWinLoss();
    }

    async useMegaHammer(tile) {
        this.pendingPowerUp = null;
        this.inventory.megaHammer--;
        this.updatePowerUpTray();
        this.isProcessing = true;
        this.sfx.special();
        this.flashScreen(.35);
        const row = tile.r;
        const victims = [];
        for (let c = 0; c < COLS; c++) if (this.board[row][c]) victims.push(this.board[row][c]);
        const pops = victims.map((p, i) => this.popTile(p, i * 20));
        victims.forEach(p => this.addScore(15));
        await Promise.all(pops);
        victims.forEach(p => { this.board[p.r][p.c] = null; });
        await this.applyGravity();
        if (this.moves > 0 && this.score < this.starMax) await this.ensureSolvable();
        this.checkWinLoss();
    }

    dropColorBombs(count) {
        for (let i = 0; i < count; i++) {
            const candidates = [];
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c] && this.board[r][c].special === SPECIALS.NONE) candidates.push([r, c]);
            if (!candidates.length) return;
            const [r, c] = candidates[Math.floor(Math.random() * candidates.length)];
            this.spawnSpecial(r, c, 0, SPECIALS.BOMB);
        }
    }

    showRewardPicker() {
        const picks = Object.keys(POWER_UPS).sort(() => Math.random() - 0.5).slice(0, 2);
        const row = document.getElementById('reward-row');
        row.innerHTML = '';
        picks.forEach(type => {
            const def = POWER_UPS[type];
            const card = document.createElement('div');
            card.className = 'reward-card';
            card.innerHTML = `<span class="material-symbols-outlined">${def.icon}</span><span class="rc-name">${def.name}</span><span class="rc-desc">${def.desc}</span>`;
            card.addEventListener('click', () => this.pickReward(type));
            row.appendChild(card);
        });
        document.getElementById('reward-overlay').classList.add('active');
    }

    pickReward(type) {
        this.inventory[type] = (this.inventory[type] || 0) + 1;
        this.updatePowerUpTray();
        document.getElementById('reward-overlay').classList.remove('active');
        this.startLevel();
    }

    /* ---------- Win / loss ---------- */

    checkWinLoss() {
        const done = this.moves <= 0 || this.score >= this.starMax;
        if (!done) { this.isProcessing = false; return; }

        if (this.score >= this.targetScore) {
            this.sfx.win();
            this.playLottieConfetti();
            const stars = this.computeStars();
            const coinsEarned = stars * 15;
            this.addCoins(coinsEarned);
            this.currentLevelIdx++;
            if (this.currentLevelIdx >= LEVELS.length) {
                this.showScreen('You Win!', `FINAL SCORE: ${this.score} · +${coinsEarned} COINS`, 'PLAY AGAIN', stars, 'play', true);
                this.currentLevelIdx = 0;
                this.inventory = { hammer: 0, shuffle: 0, extraMoves: 0, colorBomb: 0, megaHammer: 0, doubleBomb: 0 };
                this.coins = 0;
                this.updatePowerUpTray();
                this.updateCoinDisplay();
            } else {
                this.showScreen('Level Clear!', `SCORE: ${this.score} / ${this.targetScore} · +${coinsEarned} COINS`, 'CONTINUE', stars, 'reward', true);
            }
        } else {
            this.sfx.lose();
            this.showScreen('Out of Moves', `SCORE: ${this.score} / ${this.targetScore}`, 'TRY AGAIN', null, 'play');
        }
    }

    /* ---------- Confetti ---------- */

    playLottieConfetti() {
        const container = document.getElementById('confetti-lottie');
        if (!container || typeof lottie === 'undefined') return;
        container.innerHTML = '';
        const w = Math.max(1, window.innerWidth);
        const h = Math.max(1, window.innerHeight);
        const data = buildConfettiLottieData(w, h);
        let anim;
        try {
            anim = lottie.loadAnimation({ container, renderer: 'svg', loop: false, autoplay: true, animationData: data });
        } catch (e) { return; }
        const cleanup = () => { try { anim.destroy(); } catch (e) {} container.innerHTML = ''; };
        anim.addEventListener('complete', cleanup);
        setTimeout(cleanup, (data.op / data.fr) * 1000 + 500);
    }

    /* ---------- Idle hint & watchdog ---------- */

    startIdleWatcher() {
        setInterval(() => {
            if (this.isProcessing || this.hintActive) return;
            if (document.getElementById('screen-overlay').classList.contains('active')) return;
            if (Date.now() - this.lastActionAt < 10000) return;
            this.showHint();
        }, 1000);
    }

    startWatchdog() {
        setInterval(() => {
            const overlayActive = document.getElementById('screen-overlay').classList.contains('active');
            if (this.isProcessing && !overlayActive) {
                this.stuckTicks = (this.stuckTicks || 0) + 1;
                if (this.stuckTicks > 7) { console.warn('[match] input was stuck; repairing board.'); this.repairBoard(); }
            } else {
                this.stuckTicks = 0;
            }
            if (!this.isProcessing && !overlayActive && this.board && this.numColors) {
                for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!this.board[r][c]) { this.repairBoard(); return; }
                const valid = new Set(this.allTiles().map(t => t.el));
                this.grid.querySelectorAll('.tile').forEach(el => { if (!valid.has(el)) el.remove(); });
            }
        }, 1000);
    }

    async repairBoard() {
        if (this.repairing) return;
        this.repairing = true;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!this.board[r][c]) this.createTile(r, c, Math.floor(Math.random() * this.numColors) + 1, SPECIALS.NONE);
        const valid = new Set(this.allTiles().map(t => t.el));
        this.grid.querySelectorAll('.tile').forEach(el => { if (!valid.has(el)) el.remove(); });
        this.updatePositions();
        this.isProcessing = false;
        this.stuckTicks = 0;
        this.drag = null;
        this.clearSelection();
        await this.ensureSolvable();
        this.repairing = false;
    }

    /* ---------- Canvas FX engine ---------- */

    safeFinished(animation) { return animation.finished.catch(() => {}); }

    vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

    flashScreen(intensity = .3) {
        this.flashEl.getAnimations().forEach(a => a.cancel());
        this.flashEl.animate([{ opacity: 0 }, { opacity: intensity, offset: .28 }, { opacity: 0 }], { duration: 240, easing: 'ease-out' });
    }

    comboFeedback(text) {
        const el = document.createElement('div');
        el.className = 'combo-text';
        el.textContent = text;
        this.textLayer.appendChild(el);
        const anim = el.animate(
            [
                { opacity: 0, transform: 'translate(-50%,14px) scale(.65)', offset: 0 },
                { opacity: 1, transform: 'translate(-50%,-2px) scale(1.08)', offset: .28 },
                { opacity: 1, transform: 'translate(-50%,-8px) scale(1)', offset: .72 },
                { opacity: 0, transform: 'translate(-50%,-24px) scale(.96)', offset: 1 }
            ],
            { duration: 650, easing: 'cubic-bezier(.2,.88,.24,1)' }
        );
        anim.finished.finally(() => el.remove()).catch(() => el.remove());
    }

    progressToast(text) {
        const el = document.createElement('div');
        el.className = 'combo-text';
        el.style.top = '2%';
        el.textContent = text;
        this.textLayer.appendChild(el);
        const anim = el.animate(
            [
                { opacity: 0, transform: 'translate(-50%,10px) scale(.72)' },
                { opacity: 1, transform: 'translate(-50%,-2px) scale(1.08)', offset: .3 },
                { opacity: 1, transform: 'translate(-50%,-6px) scale(1)', offset: .7 },
                { opacity: 0, transform: 'translate(-50%,-20px) scale(.96)' }
            ],
            { duration: 720, easing: 'cubic-bezier(.2,.88,.24,1)' }
        );
        anim.finished.finally(() => el.remove()).catch(() => el.remove());
    }

    floatingScore(shellX, shellY, text) {
        const el = document.createElement('div');
        el.className = 'score-pop';
        el.textContent = text;
        el.style.left = `${shellX + 24}px`;
        el.style.top = `${shellY + 52}px`;
        this.textLayer.appendChild(el);
        const anim = el.animate(
            [
                { opacity: 0, transform: 'translate(-50%,-25%) scale(.7)' },
                { opacity: 1, transform: 'translate(-50%,-60%) scale(1.14)', offset: .25 },
                { opacity: 0, transform: 'translate(-50%,-160%) scale(.92)' }
            ],
            { duration: 650, easing: 'ease-out' }
        );
        anim.finished.finally(() => el.remove()).catch(() => el.remove());
    }

    particleBurst(shellX, shellY, colorIdx, count = 12) {
        const off = this.canvasOffset();
        const x = shellX + off.x, y = shellY + off.y;
        const color = COLORS[((colorIdx - 1 + 600) % 6) + 1] || COLORS[1];
        const adaptive = this.perf.frame > 13 ? .65 : this.perf.frame > 10 ? .82 : 1;
        const n = Math.max(4, Math.round(count * adaptive));
        for (let i = 0; i < n; i++) {
            const angle = Math.PI * 2 * (i / n) + Math.random() * .45;
            const speed = 55 + Math.random() * 95;
            this.particles.push({
                x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 18,
                life: 0, ttl: .42 + Math.random() * .24, size: 2.4 + Math.random() * 3.2, color
            });
        }
    }

    ringBurst(shellX, shellY, color, maxRadius = 58) {
        const off = this.canvasOffset();
        this.rings.push({ x: shellX + off.x, y: shellY + off.y, life: 0, ttl: .42, color, maxRadius });
    }

    beamCross(shellX, shellY, color) {
        const off = this.canvasOffset();
        const extent = Math.max(this.shell.clientWidth, this.shell.clientHeight) * 1.15;
        [0, Math.PI].forEach(angle => this.beams.push({ x: shellX + off.x, y: shellY + off.y, angle, length: extent, life: 0, ttl: .22, color }));
        [-Math.PI / 2, Math.PI / 2].forEach(angle => this.beams.push({ x: shellX + off.x, y: shellY + off.y, angle, length: extent, life: 0, ttl: .22, color }));
    }

    drawFx(dt) {
        const rect = this.canvas.getBoundingClientRect();
        this.ctx.clearRect(0, 0, rect.width, rect.height);

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life += dt;
            if (p.life >= p.ttl) { this.particles.splice(i, 1); continue; }
            const t = p.life / p.ttl;
            p.vy += 240 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
            this.ctx.globalAlpha = (1 - t) * (1 - t);
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size * (1 - .6 * t), 0, Math.PI * 2);
            this.ctx.fill();
        }

        for (let i = this.rings.length - 1; i >= 0; i--) {
            const r = this.rings[i];
            r.life += dt;
            if (r.life >= r.ttl) { this.rings.splice(i, 1); continue; }
            const t = r.life / r.ttl;
            this.ctx.globalAlpha = 1 - t;
            this.ctx.strokeStyle = r.color;
            this.ctx.lineWidth = 3 * (1 - t) + .5;
            this.ctx.beginPath();
            this.ctx.arc(r.x, r.y, r.maxRadius * (.18 + .82 * t), 0, Math.PI * 2);
            this.ctx.stroke();
        }

        for (let i = this.beams.length - 1; i >= 0; i--) {
            const b = this.beams[i];
            b.life += dt;
            if (b.life >= b.ttl) { this.beams.splice(i, 1); continue; }
            const t = b.life / b.ttl;
            const eased = 1 - Math.pow(1 - t, 3);
            const len = b.length * eased;
            const x2 = b.x + Math.cos(b.angle) * len, y2 = b.y + Math.sin(b.angle) * len;
            this.ctx.globalAlpha = (1 - t) * .95;
            this.ctx.strokeStyle = b.color;
            this.ctx.lineCap = 'round';
            this.ctx.lineWidth = 11 * (1 - t) + 4;
            this.ctx.beginPath();
            this.ctx.moveTo(b.x, b.y);
            this.ctx.lineTo(x2, y2);
            this.ctx.stroke();
        }
        this.ctx.globalAlpha = 1;
    }

    fxLoop(now) {
        let dt = (now - this.perf.last) / 1000;
        if (dt > 0.05) dt = 0.05;
        this.perf.frame = dt * 1000;
        this.drawFx(dt);
        this.perf.last = now;
        requestAnimationFrame(t => this.fxLoop(t));
    }
}

window.addEventListener('load', () => { window.game = new Game(); });
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && window.game) window.game.perf.last = performance.now();
});
</script>
