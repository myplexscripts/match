<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mellow Match</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mellow Match">
<meta name="theme-color" content="#F5F2EB">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,100..700,0..1,-50..200" />

<style>
@property --spin-angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
}

:root{
  --bg:#F5F2EB;
  --ink:#20201F;
  --muted:#8B8B86;

  --color-yellow-orange-light:#FFDFAB;
  --color-yellow-orange-base:#FFC567;
  --color-yellow-orange-dark:#C57A00;

  --color-pink-light:#FDB5CD;
  --color-pink-base:#FB7DA8;
  --color-pink-dark:#C90649;

  --color-red-orange-light:#FEA499;
  --color-red-orange-base:#FD5A46;
  --color-red-orange-dark:#B01502;

  --color-purple-light:#9F76D2;
  --color-purple-base:#552C87;
  --color-purple-dark:#30194D;

  --color-green-light:#3BFFB3;
  --color-green-base:#00995E;
  --color-green-dark:#00663F;

  --color-blue-light:#63C5FB;
  --color-blue-base:#058CD7;
  --color-blue-dark:#034D76;

  --color-true-yellow-light:#FAD970;
  --color-true-yellow-base:#EAB308;
  --color-true-yellow-dark:#816204;

  --color-teal-light:#4FF0E1;
  --color-teal-base:#0D9488;
  --color-teal-dark:#085E56;

  --color-indigo-light:#6484DD;
  --color-indigo-base:#1E3A8A;
  --color-indigo-dark:#122354;

  --color-pure-red-light:#EC8888;
  --color-pure-red-base:#DC2626;
  --color-pure-red-dark:#7A1414;

  --neutral-0:#FFFFFF;
  --neutral-50:#F7F5F0;
  --neutral-100:#EEEAE2;
  --neutral-700:#343238;
  --neutral-800:#26242A;
  --neutral-900:#17161A;

--accent: var(--color-blue-light);

--board-pad:4px;
--gap:7px;
--border-thick:2px;

--shadow-x:3px;
--shadow-y:3px;

--shadow-small:
  var(--shadow-x)
  var(--shadow-y)
  0
  var(--neutral-900);

--shadow-hard:
  5px
  5px
  0
  var(--neutral-900);
}

*{box-sizing:border-box}
html,body{height:100%; height:100dvh;}
body{
  margin:0;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  background: var(--neutral-50);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
}
.bg-wash{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% -5%,rgba(255,255,255,.95),transparent 40%),
    rgba(255,255,255,0);
  transition:background-color .8s ease;
}

button,input{font:inherit}
button{touch-action:manipulation}

.material-symbols-outlined{
  font-family:'Material Symbols Outlined';
  font-variation-settings:'FILL' 1,'wght' 600,'GRAD' 0,'opsz' 48;
  font-weight:normal;
  font-style:normal;
  line-height:1;
  letter-spacing:normal;
  text-transform:none;
  white-space:nowrap;
  word-wrap:normal;
  direction:ltr;
  -webkit-font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased;
  display:inline-block;
}

.app{
  position:relative;
  z-index:1;
  width:min(100%,480px);
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top)) 16px 0;
}

.topbar{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:10px;
}

.brand-card,
.pill,
.coin-chip{
  position:relative;
  min-width:68px;
  height:40px;
  display:grid;
  place-items:center;
  align-content:center;
  border-radius:14px;
  background:var(--neutral-0);
  border:var(--border-thick) solid var(--neutral-900);
  box-shadow:var(--shadow-small);
}

.brand-card{
  width:62px;
  justify-self:start;
}

.brand-card b,
.pill b{
  font-size:13.5px;
  line-height:1;
}

.brand-card span,
.pill span{
  margin-top:3px;
  font-size:8.5px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.stats{
  justify-self:center;
  display:flex;
  align-items:center;
  gap:7px;
}

.pill.bump,
.coin-chip.bump{
  animation:bumpVal .3s ease;
}

.topbar-right{
  justify-self:end;
  display:flex;
  align-items:center;
  gap:8px;
}

.coin-chip{
  min-width:78px;
  padding:0 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  background:linear-gradient(155deg,var(--color-true-yellow-light),var(--color-yellow-orange-light));
}

.coin-chip span:last-child{
  font-weight:800;
  font-size:.85rem;
  color:var(--neutral-900);
}

.coin-icon{
  width:30px;
  height:20px;
  display:block;
  overflow:visible;
}

.coin-icon ellipse{
  fill:var(--neutral-0);
  stroke:var(--neutral-900);
  stroke-width:2.4;
}

.coin-icon path{
  fill:none;
  stroke:var(--neutral-900);
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-btn{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:var(--border-thick) solid var(--neutral-900);
  border-radius:13px;
  background:var(--neutral-0);
  box-shadow:var(--shadow-small);
  color:var(--ink);
  cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;
}
.icon-btn:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--neutral-900);}
.icon-btn .material-symbols-outlined{font-size:1.05rem;font-variation-settings:'FILL' 1,'wght' 600}

.stage{
  min-height:0;
  flex:1;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-top:66px;
}

.shell{
  position:relative;
  contain:layout style;
  overflow:visible;
}

.board{
  position:absolute;
  inset:0;
  overflow:visible;
  background:transparent;
  border:0;
  box-shadow:none;
}
.grid{
  position:absolute;
  inset:var(--board-pad);
  touch-action:none;
  contain:layout style;
  overflow:visible;
}

.tile{
  position:absolute;
  left:0;
  top:0;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  transform-origin:center;
  will-change:transform,opacity;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  contain:layout style;
  overflow:visible;
}
.tile-inner{
  position:absolute;
  inset:0;
  transform-origin:center;
  will-change:transform,opacity;
}
.tile-shadow{
  position:absolute;
  inset:0;
  border-radius:24%;
  background:var(--neutral-900);
  transform:translate3d(4px,4px,0);
  pointer-events:none;
  z-index:0;
}
.gem{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  border-radius:24%;
  overflow:hidden;
  background:var(--tile-bg,var(--neutral-50));
  border:3px solid var(--neutral-900);
  transform:translateZ(0);
  will-change:transform,opacity;
  z-index:1;
}

.tile-icon{
  width:58%;
  height:58%;
  display:block;
  overflow:visible;
  pointer-events:none;
  position:relative;
  z-index:2;
}
.tile-icon use{
  fill:var(--tile-shape);
  stroke:var(--neutral-800);
  stroke-width:19.2;
  stroke-linejoin:round;
  stroke-linecap:round;
  overflow:visible;
}

symbol{
  overflow:visible;
}

.type-1{ --tile-bg:var(--color-yellow-orange-base); --tile-shape:var(--color-yellow-orange-light); }
.type-2{ --tile-bg:var(--color-pink-base); --tile-shape:var(--color-pink-light); }
.type-3{ --tile-bg:var(--color-blue-base); --tile-shape:var(--color-blue-light); }
.type-4{ --tile-bg:var(--color-teal-base); --tile-shape:var(--color-teal-light); }
.type-5{ --tile-bg:var(--color-purple-base); --tile-shape:var(--color-purple-light); }
.type-6{ --tile-bg:var(--color-red-orange-base); --tile-shape:var(--color-red-orange-light); }

.tile.special-bomb .gem{
  background:conic-gradient(from var(--spin-angle),
    var(--color-yellow-orange-base), var(--color-pink-base), var(--color-red-orange-base),
    var(--color-purple-base), var(--color-blue-base), var(--color-teal-base), var(--color-yellow-orange-base));
  animation:spinAngle 6s linear infinite;
}
.tile.special-bomb .tile-icon use{ fill:var(--neutral-0); stroke:var(--neutral-900); }

.tile.has-special .gem{
  animation:none;
  box-shadow:none;
}

.tile.selected .tile-inner{
  animation:selectedPulse .58s ease-in-out infinite alternate;
}
@keyframes selectedPulse{
  from{transform:scale(.93)}
  to{transform:scale(1.035)}
}
@keyframes spinAngle{ from{ --spin-angle:0deg; } to{ --spin-angle:360deg; } }

.level-progress{
  position:absolute;
  left:6px;
  right:6px;
  top:-54px;
  height:42px;
  z-index:30;
}
.progress-track{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  transform:translateY(-50%);
  height:16px;
  border-radius:999px;
  background:var(--neutral-0);
  border:2px solid var(--neutral-800);
  box-shadow:3px 3px 0 var(--neutral-800);
  overflow:visible;
}
.progress-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  border-radius:999px;
  background:var(--color-true-yellow-base);
  will-change:width;
  overflow:hidden;
  transition:width .48s cubic-bezier(.16,.84,.24,1), background .28s ease;
}
.progress-track.full .progress-fill{ animation:pulseMeter .6s ease-in-out infinite alternate; }
@keyframes pulseMeter{ 0%{filter:brightness(1)} 100%{filter:brightness(1.22)} }

.progress-head{
  position:absolute;
  left:0;
  top:50%;
  width:42px;
  height:42px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:8;
  transition:left .48s cubic-bezier(.16,.84,.24,1);
}
.progress-head-icon{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
  animation:starSpin 3.2s linear infinite;
}
.progress-head-icon use{
  fill:var(--color-true-yellow-light);
  stroke:var(--neutral-800);
  stroke-width:3.5;
  stroke-linejoin:round;
  stroke-linecap:round;
}
@keyframes starSpin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.progress-track.tier-2 .progress-fill{ background:var(--color-yellow-orange-base); }
.progress-track.tier-2 .progress-head-icon use{ fill:var(--color-yellow-orange-light); }
.progress-track.tier-3 .progress-fill{ background:var(--color-red-orange-base); }
.progress-track.tier-3 .progress-head-icon use{ fill:var(--color-red-orange-light); }

.milestone-dot{
  position:absolute;
  top:50%;
  width:8px;
  height:8px;
  transform:translate(-50%,-50%) translateZ(0);
  border-radius:50%;
  background:rgba(0,0,0,.16);
  z-index:6;
  opacity:1;
  transition:transform .22s ease,background .22s ease,opacity .22s ease;
}
.milestone-dot.passed{ opacity:0; transform:translate(-50%,-50%) scale(.45); }

.fx-canvas{
  position:absolute;
  inset:-52px -24px -24px;
  width:calc(100% + 48px);
  height:calc(100% + 76px);
  pointer-events:none;
  z-index:50;
}
.text-layer{
  position:absolute;
  inset:-52px -24px -24px;
  pointer-events:none;
  z-index:55;
  overflow:visible;
}
.combo-text{
  position:absolute;
  left:50%;
  top:15%;
  transform:translate(-50%,0);
  font:800 clamp(22px,7.5vw,36px)/1 Manrope,sans-serif;
  letter-spacing:-.04em;
  white-space:nowrap;
  text-shadow:0 4px 14px rgba(0,0,0,.14);
  color:var(--ink);
}
.score-pop{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:13px;
  font-weight:800;
  color:var(--ink);
  text-shadow:0 2px 9px rgba(255,255,255,.8);
}

.screen-flash{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.5),transparent 55%);
  mix-blend-mode:screen;
}

.bottom-bar{
  flex:0 0 auto;
  padding:14px 0 max(14px, env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
}
.powerup-tray{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  min-height:44px;
}
.pu-btn{
  position:relative;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:var(--neutral-0);
  border:var(--border-thick) solid var(--neutral-900);
  box-shadow:var(--shadow-small);
  cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;
}
.pu-btn:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--neutral-900); }
.pu-btn .material-symbols-outlined{ font-size:1.15rem; color:var(--ink); font-variation-settings:'FILL' 1,'wght' 600; }
.pu-btn.empty{ opacity:.32; pointer-events:none; }
.pu-btn.armed{ background:var(--color-true-yellow-light); animation:armedPulse .9s ease-in-out infinite; }
.pu-btn.premium{ background:linear-gradient(155deg,var(--color-true-yellow-light),var(--color-yellow-orange-light)); }
.pu-btn.premium .material-symbols-outlined{ color:var(--color-yellow-orange-dark); }
.pu-btn.premium .pu-count{ background:var(--color-yellow-orange-dark); }
@keyframes armedPulse{
  0%,100%{ box-shadow:var(--shadow-small); }
  50%{ box-shadow:var(--shadow-small), 0 0 12px 3px rgba(234,179,8,.75); }
}

.pu-count{
  position:absolute;
  top:-8px;
  right:-8px;
  min-width:19px;
  height:19px;
  padding:0 3px;
  background:var(--color-red-orange-base);
  color:#fff;
  font-size:.72rem;
  font-weight:800;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid var(--neutral-900);
}

.screen-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  width:100%;
}

.overlay button.secondary{
  margin-top:4px;
  padding:14px 24px;
  font:800 .98rem Manrope,sans-serif;
  letter-spacing:.01em;
  border:var(--border-thick) solid var(--neutral-900);
  border-radius:16px;
  background:var(--neutral-0);
  color:var(--neutral-900);
  cursor:pointer;
  box-shadow:var(--shadow-hard);
  transition:transform .1s ease, box-shadow .1s ease;
}

.overlay button.secondary:active{
  transform:translate(5px,5px);
  box-shadow:0 0 0 var(--neutral-900);
}

.overlay button.secondary[hidden]{
  display:none;
}

.overlay{
  position:absolute; inset:0;
  background:rgba(23,22,26,.55);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
}
.overlay.active{ opacity:1; pointer-events:auto; }

.overlay-card{
  background:var(--neutral-0);
  border:var(--border-thick) solid var(--neutral-900);
  border-radius:26px;
  box-shadow:var(--shadow-hard);
  padding:30px 26px;
  max-width:min(90vw,360px);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  transform:scale(.85);
  transition:transform .3s cubic-bezier(.175,.885,.32,1.275);
}
.overlay.active .overlay-card{ transform:scale(1); }

.overlay h2{
  font:800 2rem/1.05 Manrope,sans-serif;
  letter-spacing:-.03em;
  color:var(--ink);
}
.overlay p{
  font-size:.98rem;
  font-weight:600;
  color:var(--muted);
  line-height:1.4;
}

.stars-row{ display:flex; gap:8px; height:2.2rem; }
.stars-row .star{
  font-size:2.2rem;
  color:var(--neutral-100);
  font-variation-settings:'FILL' 1,'wght' 600;
}
.stars-row .star.filled{
  color:var(--color-true-yellow-base);
  animation:starPop .5s both;
}
.stars-row .star.filled:nth-child(2){ animation-delay:.1s; }
.stars-row .star.filled:nth-child(3){ animation-delay:.2s; }
@keyframes starPop{
  0%{ transform:scale(0) rotate(-30deg); opacity:0; }
  60%{ transform:scale(1.3) rotate(8deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}

.overlay button.primary{
  margin-top:4px;
  padding:14px 40px;
  font:800 1.05rem Manrope,sans-serif;
  letter-spacing:.01em;
  border:var(--border-thick) solid var(--neutral-900);
  border-radius:16px;
  background:var(--accent);
  color:var(--neutral-900);
  cursor:pointer;
  box-shadow:var(--shadow-hard);
  transition:transform .1s ease, box-shadow .1s ease;
}
.overlay button.primary:active{ transform:translate(5px,5px); box-shadow:0 0 0 var(--neutral-900); }

.reward-row{ display:flex; gap:10px; }
.reward-card{
  width:126px;
  padding:18px 10px 14px;
  background:var(--neutral-50);
  border:var(--border-thick) solid var(--neutral-900);
  border-radius:20px;
  box-shadow:var(--shadow-small);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;
}
.reward-card:active{ transform:translate(3px,3px); box-shadow:0 0 0 var(--neutral-900); }
.reward-card .material-symbols-outlined{ font-size:1.9rem; color:var(--color-blue-dark); font-variation-settings:'FILL' 1,'wght' 600; }
.reward-card .rc-name{ font-weight:800; font-size:.92rem; font-family:Manrope,sans-serif; }
.reward-card .rc-desc{ font-size:.72rem; color:var(--muted); text-align:center; line-height:1.3; font-weight:600; }

.reward-card.premium{
  background:linear-gradient(155deg,var(--color-true-yellow-light),var(--color-yellow-orange-light));
  border-color:var(--neutral-900);
}
.reward-card.premium .material-symbols-outlined{ color:var(--color-yellow-orange-dark); }
.reward-card.premium .rc-cost{
  display:flex;
  align-items:center;
  gap:3px;
  font-weight:800;
  font-size:.76rem;
  color:var(--color-yellow-orange-dark);
  background:rgba(255,255,255,.6);
  padding:2px 8px;
  border-radius:999px;
  border:1.5px solid var(--neutral-900);
}
.reward-card.premium .rc-cost .material-symbols-outlined{ font-size:.76rem; color:var(--color-yellow-orange-dark); }
.reward-card.premium.unaffordable{ opacity:.5; cursor:not-allowed; }

.shop-balance{
  display:flex;
  align-items:center;
  gap:6px;
  padding:5px 16px;
  background:linear-gradient(155deg,var(--color-true-yellow-light),var(--color-yellow-orange-light));
  border:var(--border-thick) solid var(--neutral-900);
  border-radius:999px;
  font-weight:800;
  font-size:1rem;
  box-shadow:var(--shadow-small);
}
.shop-balance .coin-icon{
  width:26px;
  height:18px;
}

.confetti-lottie{ position:fixed; inset:0; z-index:250; pointer-events:none; }
.confetti-lottie svg{ width:100%; height:100%; }

@keyframes bumpVal{ 0%{transform:scale(1)} 40%{transform:scale(1.16)} 100%{transform:scale(1)} }

@media(max-height:720px){
  .app{ padding-top:10px; }
  .stage{ padding-top:28px; }
  .pill{ height:37px; }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>
<div class="bg-wash" id="bgWash"></div>
