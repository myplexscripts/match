<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brutal Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,100..700,0..1,-50..200" />
    <style>
        :root {
            /* Soft Neo-Brutalism Palette */
            --bg-color: #103848;
            --bg-color-2: #0A2530;
            --board-bg: #FBF3E3; /* Warm cream */
            --black: #263440; /* Soft ink, not pure black */
            --white: #FBF3E3; /* Cream */

            /* Gentle Candy Colors */
            --c1: #2E9C90;
            --c2: #4FC7BE;
            --c3: #A9E8DE;
            --c4: #8C7FD1;
            --c5: #F28FA6;
            --c6: #FFB073;
            --c7: #FFDD7A;

            /* Structural Variables */
            --board-size: min(92vw, 500px);
            --border-thick: 4px;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --shadow-hard: 6px 6px 0px var(--black), 10px 14px 24px rgba(8, 30, 40, 0.35);
            --shadow-small: 3px 3px 0px var(--black), 5px 7px 14px rgba(8, 30, 40, 0.28);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
            margin: 0;
            padding: 0;
            font-family: 'Oswald', sans-serif;
        }

        html, body { height: 100%; }

        body {
            background: radial-gradient(circle at 15% 10%, #17495c 0%, transparent 45%),
                        radial-gradient(circle at 90% 90%, #123543 0%, transparent 50%),
                        linear-gradient(160deg, var(--bg-color) 0%, var(--bg-color-2) 100%);
            color: var(--black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.28;
            z-index: 0;
            pointer-events: none;
        }
        body::before { width: 340px; height: 340px; background: var(--c4); top: -100px; left: -90px; }
        body::after { width: 300px; height: 300px; background: var(--c5); bottom: -90px; right: -80px; }

        .mute-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--white);
            border: var(--border-thick) solid var(--black);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
            cursor: pointer;
            z-index: 300;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .mute-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black); }
        .mute-btn .material-symbols-outlined { font-size: 1.4rem; font-variation-settings: 'FILL' 1, 'wght' 600; color: var(--black); }

        .hud {
            width: var(--board-size);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            z-index: 10;
            position: relative;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .hud-box {
            background: var(--white);
            padding: 8px 12px;
            border: var(--border-thick) solid var(--black);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
            text-align: center;
            min-width: 90px;
        }

        .hud-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-val {
            font-size: 1.6rem;
            font-weight: 900;
            line-height: 1.1;
            transition: transform 0.15s ease;
        }

        .hud-val.bump { animation: bumpVal 0.3s ease; }

        .level-title {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--white);
            text-shadow:
                -2px -2px 0 var(--black),
                 2px -2px 0 var(--black),
                -2px  2px 0 var(--black),
                 2px  2px 0 var(--black),
                 var(--shadow-hard);
            letter-spacing: -1px;
            transform: rotate(-2deg);
        }

        .meter-container {
            width: 100%;
            height: 32px;
            background: var(--white);
            border: var(--border-thick) solid var(--black);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-small);
            position: relative;
            overflow: hidden;
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: var(--c1);
            border-right: var(--border-thick) solid var(--black);
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.3s;
            position: relative;
        }

        .meter-fill.full {
            background: var(--c2);
            animation: pulse-meter 0.5s infinite alternate;
        }

        .meter-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            font-weight: 900;
            color: var(--white);
            -webkit-text-stroke: 1px var(--black);
            text-shadow: 2px 2px 0 var(--black);
            pointer-events: none;
            z-index: 2;
        }

        #board-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: var(--board-bg);
            border: var(--border-thick) solid var(--black);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-hard);
            padding: 4px;
            z-index: 1;
            overflow: hidden;
        }

        #grid-bg {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
            gap: 2px;
        }

        .grid-cell {
            background: rgba(38, 52, 64, 0.03);
            border: 2px dashed rgba(38, 52, 64, 0.14);
            border-radius: 6px;
        }

        #pieces-layer {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            pointer-events: none;
        }

        .piece {
            position: absolute;
            width: 12.5%;
            height: 12.5%;
            padding: 2px;
            /* Buttery smooth transitions */
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
        }

        .piece-inner {
            width: 100%;
            height: 100%;
            background: var(--white);
            border: 3px solid var(--black);
            border-radius: var(--radius-sm);
            box-shadow: 0px 4px 0px var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .piece-inner:hover { box-shadow: 0px 6px 0px var(--black); }

        /* Bouncy Selection */
        .piece.selected .piece-inner {
            transform: scale(1.1) translate(0px, 4px);
            box-shadow: 0px 0px 0px var(--black);
            background: #f0ece0;
        }

        .piece-inner.invalid { border-color: #D9534F; }

        /* Material Symbols Integration */
        .material-symbols-outlined {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
            pointer-events: none; /* Ensures drag/click registers on the piece */
        }

        /* Icon Colors */
        .color-1 { color: var(--c1); }
        .color-2 { color: var(--c2); }
        .color-3 { color: var(--c3); }
        .color-4 { color: var(--c4); }
        .color-5 { color: var(--c5); }
        .color-6 { color: var(--c6); }
        .color-7 { color: var(--c7); }

        .color-bomb .material-symbols-outlined {
            background: repeating-conic-gradient(from 0deg, var(--c1) 0 51deg, var(--c2) 51deg 102deg, var(--c3) 102deg 154deg, var(--c4) 154deg 205deg, var(--c5) 205deg 257deg, var(--c6) 257deg 308deg, var(--c7) 308deg 360deg);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: spin 2s linear infinite;
        }

        /* Specials Details */
        .stripe-h::after {
            content: ''; position: absolute; width: 110%; height: 6px; background: var(--black); top: 50%; transform: translateY(-50%); border-radius: 3px;
        }
        .stripe-v::after {
            content: ''; position: absolute; height: 110%; width: 6px; background: var(--black); left: 50%; transform: translateX(-50%); border-radius: 3px;
        }
        .wrap::before {
            content: ''; position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 3px dashed var(--black); border-radius: inherit; animation: spin 4s linear infinite;
        }

        .pop { animation: popOut 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake { animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        .wiggle { animation: wiggleTile 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        .particle {
            position: absolute;
            border: 2px solid var(--black);
            pointer-events: none;
            z-index: 20;
            animation: particle-burst 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .shockwave {
            position: absolute;
            width: 40px; height: 40px;
            border: 4px solid var(--black);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 30;
            animation: shockwaveExpand 0.5s ease-out forwards;
        }

        .combo-banner {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            opacity: 0;
            font-size: 1.7rem;
            font-weight: 900;
            text-align: center;
            color: var(--white);
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 4px 4px 0 var(--black);
            pointer-events: none;
            z-index: 60;
            white-space: nowrap;
        }
        .combo-banner.show { animation: comboPop 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

        .floating-text {
            position: absolute;
            color: var(--white);
            font-weight: 900;
            font-size: 2rem;
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 4px 4px 0 var(--black);
            pointer-events: none;
            z-index: 40;
            animation: float-up 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .flash {
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: var(--white); z-index: 100; pointer-events: none;
            animation: flash-fade 0.2s ease-out forwards;
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 15px; height: 15px;
            border: 2px solid var(--black);
            z-index: 150;
            pointer-events: none;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.4) rotate(15deg); }
            100% { transform: scale(0) rotate(-15deg); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes wiggleTile {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15%); }
            75% { transform: translateX(15%); }
        }
        @keyframes screenShake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20%, 60% { transform: translate3d(-6px, 4px, 0); }
            40%, 80% { transform: translate3d(6px, -4px, 0); }
        }
        @keyframes particle-burst {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(180deg); opacity: 1; }
        }
        @keyframes shockwaveExpand {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-4deg); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.25) rotate(2deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -60%) scale(1.05) rotate(0deg); opacity: 0; }
        }
        @keyframes float-up {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(-5deg); opacity: 0; }
            20% { transform: translate(-50%, -100%) scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%, -300%) scale(1) rotate(0deg); opacity: 0; }
        }
        @keyframes flash-fade { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes pulse-meter { 0% { transform: scaleY(1); } 100% { transform: scaleY(1.1); } }
        @keyframes bumpVal { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(720deg); }
        }
        @keyframes starPop {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            60% { transform: scale(1.3) rotate(8deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(16, 56, 72, 0.9);
            backdrop-filter: blur(4px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .overlay-card {
            background: var(--white);
            border: var(--border-thick) solid var(--black);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-hard);
            padding: 40px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay.active .overlay-card { transform: scale(1); }

        .overlay h2 {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--white);
            -webkit-text-stroke: 2px var(--black);
            text-shadow: 4px 4px 0 var(--black);
            transform: rotate(-2deg);
        }

        .overlay p {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--black);
        }

        .stars-row {
            display: flex;
            gap: 6px;
            height: 2.6rem;
        }
        .stars-row .star {
            font-size: 2.6rem;
            color: rgba(38, 52, 64, 0.18);
            font-variation-settings: 'FILL' 0, 'wght' 600;
        }
        .stars-row .star.filled {
            color: #FFC94A;
            font-variation-settings: 'FILL' 1, 'wght' 700;
            text-shadow: 2px 2px 0 var(--black);
            animation: starPop 0.5s both;
        }
        .stars-row .star.filled:nth-child(2) { animation-delay: 0.1s; }
        .stars-row .star.filled:nth-child(3) { animation-delay: 0.2s; }

        .overlay button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: 900;
            border: var(--border-thick) solid var(--black);
            border-radius: var(--radius-md);
            background: var(--c2);
            color: var(--black);
            cursor: pointer;
            box-shadow: var(--shadow-hard);
            transition: all 0.1s;
        }
        .overlay button:hover { transform: translate(-2px, -2px); }
        .overlay button:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 var(--black);
        }
    </style>
</head>
<body>

    <button class="mute-btn" id="mute-btn" aria-label="Toggle Sound">
        <span class="material-symbols-outlined" id="mute-icon">volume_up</span>
    </button>

    <div class="hud">
        <div class="hud-top">
            <div class="hud-box">
                <div class="hud-label">MOVES</div>
                <div class="hud-val" id="moves-txt">0</div>
            </div>
            <div class="level-title" id="level-txt">LVL 1</div>
            <div class="hud-box">
                <div class="hud-label">SCORE</div>
                <div class="hud-val" id="score-txt">0</div>
            </div>
        </div>
        <div class="meter-container">
            <div class="meter-fill" id="goal-meter"></div>
            <div class="meter-text" id="meter-text">GOAL PROGRESS</div>
        </div>
    </div>

    <div id="board-container">
        <div id="grid-bg"></div>
        <div id="pieces-layer">
            <div class="combo-banner" id="combo-banner"></div>
        </div>
    </div>

    <div class="overlay" id="screen-overlay">
        <div class="overlay-card">
            <h2 id="screen-title">LEVEL 1</h2>
            <p id="screen-desc">SCORE POINTS TO FILL THE METER!</p>
            <div class="stars-row" id="screen-stars"></div>
            <button id="screen-btn" onclick="game.startLevel()">PLAY</button>
        </div>
    </div>

<script>
const LEVELS = [
    { id: 1, moves: 15, target: 1500, colors: 5, desc: "FILL THE METER TO WIN!" },
    { id: 2, moves: 20, target: 3500, colors: 6, desc: "BIGGER TARGET, MORE COLORS!" },
    { id: 3, moves: 25, target: 6000, colors: 6, desc: "CREATE SPECIAL COMBOS!" },
    { id: 4, moves: 20, target: 8000, colors: 7, desc: "EXPERT MODE!" }
];

const SPECIALS = { NONE: 0, H_STRIPE: 1, V_STRIPE: 2, WRAP: 3, BOMB: 4 };
const ACTION_WORDS = ["BAM!", "RAD!", "BOOM!", "SICK!", "WILD!", "POP!", "SWEET!", "TASTY!"];
const ICONS = {
    1: 'star',
    2: 'favorite',
    3: 'diamond',
    4: 'spa',
    5: 'cloud',
    6: 'sunny',
    7: 'bolt'
};
const COLORS = {
    1: '#2E9C90', 2: '#4FC7BE', 3: '#A9E8DE', 4: '#8C7FD1',
    5: '#F28FA6', 6: '#FFB073', 7: '#FFDD7A'
};

const SIZE = 8;
const ANIM_DUR = 250;
const wait = (ms) => new Promise(res => setTimeout(res, ms));

class SFX {
    constructor() { this.ctx = null; this.muted = false; }
    ensure() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
    }
    tone(freq, dur = 0.12, type = 'sine', vol = 0.18, delay = 0) {
        if (this.muted) return;
        try {
            const ctx = this.ensure();
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(t0); osc.stop(t0 + dur + 0.03);
        } catch (e) { /* audio unavailable */ }
    }
    swap() { this.tone(320, 0.08, 'sine', 0.1); }
    invalid() { this.tone(150, 0.16, 'sawtooth', 0.1); }
    pop(streak = 1) { this.tone(420 + Math.min(streak, 6) * 55, 0.14, 'triangle', 0.16); }
    special() { this.tone(220, 0.3, 'sine', 0.14); this.tone(560, 0.28, 'sine', 0.1, 0.05); }
    shuffle() { this.tone(260, 0.2, 'square', 0.09); this.tone(330, 0.2, 'square', 0.07, 0.1); }
    win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.18, i * 0.12)); }
    lose() { [400, 340, 280].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.13, i * 0.15)); }
}

class Match3Game {
    constructor() {
        this.board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
        this.layer = document.getElementById('pieces-layer');
        this.boardEl = document.getElementById('board-container');
        this.score = 0;
        this.moves = 0;
        this.currentLevelIdx = 0;
        this.isProcessing = false;
        this.sfx = new SFX();

        this.dragStart = null;
        this.selectedPiece = null;

        this.initGridBg();
        this.bindEvents();
        this.showScreen(`LEVEL ${LEVELS[0].id}`, LEVELS[0].desc, "PLAY");
    }

    initGridBg() {
        const bg = document.getElementById('grid-bg');
        for (let i = 0; i < SIZE * SIZE; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            bg.appendChild(cell);
        }
    }

    bindEvents() {
        this.layer.addEventListener('pointerdown', (e) => this.handlePointerDown(e));
        window.addEventListener('pointerup', (e) => this.handlePointerUp(e));
        this.boardEl.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
        document.getElementById('mute-btn').addEventListener('click', () => this.toggleMute());
    }

    toggleMute() {
        this.sfx.muted = !this.sfx.muted;
        this.sfx.ensure();
        document.getElementById('mute-icon').innerText = this.sfx.muted ? 'volume_off' : 'volume_up';
    }

    showScreen(title, desc, btnText, stars = null) {
        document.getElementById('screen-title').innerText = title;
        document.getElementById('screen-desc').innerText = desc;
        document.getElementById('screen-btn').innerText = btnText;
        const starsRow = document.getElementById('screen-stars');
        starsRow.innerHTML = '';
        if (stars !== null) {
            for (let i = 0; i < 3; i++) {
                const s = document.createElement('span');
                s.className = 'material-symbols-outlined star' + (i < stars ? ' filled' : '');
                s.innerText = 'star';
                starsRow.appendChild(s);
            }
        }
        document.getElementById('screen-overlay').classList.add('active');
    }

    hideScreen() {
        document.getElementById('screen-overlay').classList.remove('active');
    }

    async startLevel() {
        this.isProcessing = true;
        this.hideScreen();
        const config = LEVELS[this.currentLevelIdx] || LEVELS[LEVELS.length - 1];
        this.moves = config.moves;
        this.score = 0;
        this.targetScore = config.target;
        this.numColors = config.colors;

        document.getElementById('goal-meter').classList.remove('full');
        this.updateHUD();
        this.layer.innerHTML = '<div class="combo-banner" id="combo-banner"></div>';
        this.board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));

        this.fillBoardInitial();
        await this.ensureSolvable();
        this.isProcessing = false;
    }

    updateHUD() {
        const movesEl = document.getElementById('moves-txt');
        const scoreEl = document.getElementById('score-txt');
        movesEl.innerText = this.moves;
        document.getElementById('level-txt').innerText = `LVL ${this.currentLevelIdx + 1}`;
        scoreEl.innerText = this.score;

        const progress = Math.min(100, (this.score / this.targetScore) * 100);
        const meter = document.getElementById('goal-meter');
        meter.style.width = `${progress}%`;

        if (progress >= 100) {
            meter.classList.add('full');
            document.getElementById('meter-text').innerText = "GOAL REACHED!";
        } else {
            document.getElementById('meter-text').innerText = `${Math.floor(progress)}%`;
        }
    }

    bumpHUD(el) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
    }

    addScore(pts) {
        this.score += pts;
        this.updateHUD();
        this.bumpHUD(document.getElementById('score-txt'));
    }

    fillBoardInitial() {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                let color;
                do { color = Math.floor(Math.random() * this.numColors) + 1; }
                while (
                    (c >= 2 && this.board[r][c-1]?.color === color && this.board[r][c-2]?.color === color) ||
                    (r >= 2 && this.board[r-1][c]?.color === color && this.board[r-2][c]?.color === color)
                );
                this.spawnPiece(r, c, color, SPECIALS.NONE);
            }
        }
    }

    spawnPiece(r, c, color, special, dropFromOffset = 0) {
        const el = document.createElement('div');
        el.className = 'piece';

        const inner = document.createElement('div');
        inner.className = special === SPECIALS.BOMB ? 'piece-inner color-bomb' : `piece-inner color-${color}`;

        // Add Material Symbol Icon
        const icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.innerText = special === SPECIALS.BOMB ? 'auto_awesome' : ICONS[color];

        // Apply color to icon if not a bomb
        if (special !== SPECIALS.BOMB) {
            icon.style.color = COLORS[color];
        }

        inner.appendChild(icon);

        if (special === SPECIALS.H_STRIPE) inner.classList.add('stripe-h');
        if (special === SPECIALS.V_STRIPE) inner.classList.add('stripe-v');
        if (special === SPECIALS.WRAP) inner.classList.add('wrap');

        el.appendChild(inner);
        this.layer.appendChild(el);

        const piece = { r, c, color, special, el, inner };
        this.board[r][c] = piece;

        el.style.transform = `translate(${c * 100}%, ${(r - dropFromOffset) * 100}%)`;
        requestAnimationFrame(() => el.style.transform = `translate(${c * 100}%, ${r * 100}%)`);
        return piece;
    }

    createParticles(piece) {
        const cellW = this.boardEl.clientWidth / 8;
        const cellH = this.boardEl.clientHeight / 8;
        const x = (piece.c * cellW) + (cellW / 2);
        const y = (piece.r * cellH) + (cellH / 2);

        const big = piece.special !== SPECIALS.NONE;
        // Map particle color to tile icon color
        const col = piece.special === SPECIALS.BOMB ? '#F5F3EB' : COLORS[piece.color];
        const count = big ? 10 : 6;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.background = col;
            p.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px';

            const base = big ? 12 : 8;
            p.style.width = `${Math.random() * base + base}px`;
            p.style.height = p.style.width;

            p.style.left = `${x}px`;
            p.style.top = `${y}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * (big ? 90 : 60) + 30;
            p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
            p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);

            this.layer.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }
    }

    spawnShockwave(r, c) {
        const cellW = this.boardEl.clientWidth / 8;
        const cellH = this.boardEl.clientHeight / 8;
        const x = (c * cellW) + (cellW / 2);
        const y = (r * cellH) + (cellH / 2);
        const el = document.createElement('div');
        el.className = 'shockwave';
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 500);
    }

    createConfetti() {
        const colors = ['#2E9C90', '#4FC7BE', '#A9E8DE', '#8C7FD1', '#F28FA6', '#FFB073', '#FFDD7A'];
        for(let i=0; i<50; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = `${Math.random() * 100}vw`;
            conf.style.background = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
            conf.style.animationDuration = `${Math.random() * 2 + 2}s`;
            conf.style.animationDelay = `${Math.random() * 0.5}s`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 5000);
        }
    }

    showFloatingText(r, c, text, scale = 1) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = `${c * 12.5 + 6.25}%`;
        el.style.top = `${r * 12.5 + 6.25}%`;
        if(scale !== 1) el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    comboBanner(text) {
        const el = document.getElementById('combo-banner');
        if (!el) return;
        el.innerText = text;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
    }

    screenFlash() {
        const flash = document.createElement('div');
        flash.className = 'flash';
        this.boardEl.appendChild(flash);
        setTimeout(() => flash.remove(), 200);
    }

    handlePointerDown(e) {
        if (this.isProcessing) return;
        const target = e.target.closest('.piece');
        if (!target) return;

        const piece = this.getPieceFromElement(target);
        if (!piece) return;

        this.sfx.ensure();

        if (this.selectedPiece) {
            if (this.selectedPiece === piece) { this.clearSelection(); return; }
            const dr = Math.abs(this.selectedPiece.r - piece.r);
            const dc = Math.abs(this.selectedPiece.c - piece.c);
            if (dr + dc === 1) { this.attemptSwap(this.selectedPiece, piece); this.clearSelection(); return; }
            this.clearSelection();
        }

        this.selectedPiece = piece;
        piece.el.classList.add('selected');
        this.dragStart = { x: e.clientX, y: e.clientY, piece: piece };
    }

    handlePointerUp(e) {
        if (!this.dragStart || this.isProcessing) return;
        const dx = e.clientX - this.dragStart.x;
        const dy = e.clientY - this.dragStart.y;

        if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
            let tr = this.dragStart.piece.r, tc = this.dragStart.piece.c;
            if (Math.abs(dx) > Math.abs(dy)) tc += (dx > 0 ? 1 : -1); else tr += (dy > 0 ? 1 : -1);
            if (tr >= 0 && tr < SIZE && tc >= 0 && tc < SIZE) this.attemptSwap(this.dragStart.piece, this.board[tr][tc]);
            this.clearSelection();
        }
        this.dragStart = null;
    }

    clearSelection() {
        if (this.selectedPiece) { this.selectedPiece.el.classList.remove('selected'); this.selectedPiece = null; }
    }

    getPieceFromElement(el) {
        for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) if(this.board[r][c]?.el === el) return this.board[r][c];
        return null;
    }

    async attemptSwap(p1, p2) {
        this.isProcessing = true;
        this.sfx.swap();

        // Swap visually
        this.swapData(p1, p2);
        this.updatePositions();
        await wait(ANIM_DUR);

        const comboResult = this.checkSpecialCombo(p1, p2);
        let matchGroups = comboResult.isCombo ? [] : this.findMatches();

        // Invalid Move logic: Wiggle and swap back (does not cost a move)
        if (!comboResult.isCombo && matchGroups.length === 0) {
            this.sfx.invalid();
            p1.el.firstChild.classList.add('wiggle', 'invalid');
            p2.el.firstChild.classList.add('wiggle', 'invalid');
            await wait(300); // Wiggle duration
            p1.el.firstChild.classList.remove('wiggle', 'invalid');
            p2.el.firstChild.classList.remove('wiggle', 'invalid');

            // Swap back
            this.swapData(p1, p2);
            this.updatePositions();
            await wait(ANIM_DUR);

            this.isProcessing = false;
            return;
        }

        this.moves--;
        this.bumpHUD(document.getElementById('moves-txt'));
        this.updateHUD();

        this.lastSwap = {p1, p2};
        await this.resolveBoard(matchGroups, comboResult);
    }

    swapData(p1, p2) {
        const tR = p1.r, tC = p1.c;
        p1.r = p2.r; p1.c = p2.c; p2.r = tR; p2.c = tC;
        this.board[p1.r][p1.c] = p1; this.board[p2.r][p2.c] = p2;
    }

    updatePositions() {
        for (let r=0; r<SIZE; r++) for (let c=0; c<SIZE; c++) if (this.board[r][c]) this.board[r][c].el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
    }

    findMatches() {
        let horiz = [], vert = [];
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE - 2; c++) {
                let col = this.board[r][c]?.color;
                if (!col) continue;
                let len = 1; while (c + len < SIZE && this.board[r][c + len]?.color === col) len++;
                if (len >= 3) {
                    let g = []; for (let i = 0; i < len; i++) g.push(this.board[r][c + i]);
                    horiz.push(g); c += len - 1;
                }
            }
        }
        for (let c = 0; c < SIZE; c++) {
            for (let r = 0; r < SIZE - 2; r++) {
                let col = this.board[r][c]?.color;
                if (!col) continue;
                let len = 1; while (r + len < SIZE && this.board[r + len][c]?.color === col) len++;
                if (len >= 3) {
                    let g = []; for (let i = 0; i < len; i++) g.push(this.board[r + i][c]);
                    vert.push(g); r += len - 1;
                }
            }
        }
        let all = [...horiz, ...vert], merged = [];
        while (all.length > 0) {
            let cur = new Set(all.shift()), found = true;
            while (found) {
                found = false;
                for (let i = 0; i < all.length; i++) {
                    if (all[i].some(p => cur.has(p))) { all[i].forEach(p => cur.add(p)); all.splice(i, 1); found = true; break; }
                }
            }
            merged.push(Array.from(cur));
        }
        return merged;
    }

    // Simulates swapping the contents of two board cells and checks whether it produces a match.
    // Does not touch piece.r/c, since findMatches() only reads through this.board[r][c].
    simulateSwapHasMatch(r1, c1, r2, c2) {
        const b = this.board;
        const a = b[r1][c1], d = b[r2][c2];
        b[r1][c1] = d; b[r2][c2] = a;
        const hasMatch = this.findMatches().length > 0;
        b[r1][c1] = a; b[r2][c2] = d;
        return hasMatch;
    }

    hasPossibleMove() {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const p = this.board[r][c];
                if (!p) continue;
                if (c < SIZE - 1) {
                    const q = this.board[r][c + 1];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r, c + 1))) return true;
                }
                if (r < SIZE - 1) {
                    const q = this.board[r + 1][c];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r + 1, c))) return true;
                }
            }
        }
        return false;
    }

    async ensureSolvable() {
        if (!this.hasPossibleMove()) {
            await this.reshuffleBoard();
        }
    }

    async reshuffleBoard() {
        this.comboBanner("SHUFFLING!");
        this.sfx.shuffle();

        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const p = this.board[r][c];
                if (p) {
                    p.el.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    p.el.style.opacity = '0';
                    p.el.style.transform += ' scale(0.4) rotate(20deg)';
                }
            }
        }
        await wait(320);

        let attempts = 0;
        do {
            this.layer.innerHTML = '<div class="combo-banner" id="combo-banner"></div>';
            this.board = Array(SIZE).fill().map(() => Array(SIZE).fill(null));
            this.fillBoardInitial();
            attempts++;
        } while (!this.hasPossibleMove() && attempts < 20);

        await wait(100);
    }

    checkSpecialCombo(p1, p2) {
        const s1 = p1.special, s2 = p2.special;
        if (s1 === SPECIALS.NONE && s2 === SPECIALS.NONE) return { isCombo: false };

        // Exactly one piece is special: only a color-bomb auto-triggers on swap.
        if (s1 === SPECIALS.NONE || s2 === SPECIALS.NONE) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : (s2 === SPECIALS.BOMB ? p2 : null);
            if (bomb) {
                const normal = bomb === p1 ? p2 : p1;
                return { isCombo: true, type: 'BOMB_COLOR', color: normal.color, origin: bomb };
            }
            return { isCombo: false };
        }

        // Both pieces are special.
        if (s1 === SPECIALS.BOMB && s2 === SPECIALS.BOMB) return { isCombo: true, type: 'BOMB_BOMB' };
        if (s1 === SPECIALS.BOMB || s2 === SPECIALS.BOMB) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : p2;
            const other = bomb === p1 ? p2 : p1;
            return { isCombo: true, type: 'BOMB_SPECIAL', origin: bomb, other };
        }
        const isStripe = s => s === SPECIALS.H_STRIPE || s === SPECIALS.V_STRIPE;
        if (isStripe(s1) && isStripe(s2)) return { isCombo: true, type: 'STRIPE_STRIPE', origin: p2 };
        if (s1 === SPECIALS.WRAP && s2 === SPECIALS.WRAP) return { isCombo: true, type: 'WRAP_WRAP', origin: p2 };

        const wrapPiece = s1 === SPECIALS.WRAP ? p1 : p2;
        return { isCombo: true, type: 'STRIPE_WRAP', origin: wrapPiece };
    }

    async resolveBoard(initialGroups, initialCombo) {
        let groups = initialGroups, combo = initialCombo, comboCount = 0;

        while (groups.length > 0 || combo?.isCombo) {
            let toDestroy = new Set(), spawnQ = [];
            comboCount++;

            if (combo?.isCombo) {
                this.sfx.special();
                if (combo.type === 'BOMB_BOMB') {
                    for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) if(this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(3.5, 3.5);
                } else if (combo.type === 'BOMB_COLOR') {
                    toDestroy.add(combo.origin);
                    for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) if(this.board[r][c]?.color === combo.color) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'BOMB_SPECIAL') {
                    toDestroy.add(combo.origin); toDestroy.add(combo.other);
                    for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) if(this.board[r][c]?.color === combo.other.color) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'WRAP_WRAP') {
                    toDestroy.add(combo.origin);
                    for(let r = Math.max(0, combo.origin.r-2); r <= Math.min(SIZE-1, combo.origin.r+2); r++)
                        for(let c = Math.max(0, combo.origin.c-2); c <= Math.min(SIZE-1, combo.origin.c+2); c++)
                            if (this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'STRIPE_WRAP') {
                    toDestroy.add(combo.origin);
                    for(let dr=-1; dr<=1; dr++) {
                        const rr = combo.origin.r + dr;
                        if (rr < 0 || rr >= SIZE) continue;
                        for(let c=0; c<SIZE; c++) if (this.board[rr][c]) toDestroy.add(this.board[rr][c]);
                    }
                    for(let dc=-1; dc<=1; dc++) {
                        const cc = combo.origin.c + dc;
                        if (cc < 0 || cc >= SIZE) continue;
                        for(let r=0; r<SIZE; r++) if (this.board[r][cc]) toDestroy.add(this.board[r][cc]);
                    }
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'STRIPE_STRIPE') {
                    toDestroy.add(combo.origin);
                    for(let i=0; i<SIZE; i++) {
                        if (this.board[combo.origin.r][i]) toDestroy.add(this.board[combo.origin.r][i]);
                        if (this.board[i][combo.origin.c]) toDestroy.add(this.board[i][combo.origin.c]);
                    }
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                }
                combo = null;
            }

            groups.forEach(g => {
                g.forEach(p => toDestroy.add(p));
                const points = g.length * 10 * comboCount;
                this.addScore(points);

                const mid = Math.floor(g.length / 2);
                this.showFloatingText(g[mid].r, g[mid].c, `+${points}`);

                let xs = g.map(p => p.c), ys = g.map(p => p.r);
                let w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;

                let sP = g[0];
                if (this.lastSwap && (g.includes(this.lastSwap.p1) || g.includes(this.lastSwap.p2))) {
                    sP = g.includes(this.lastSwap.p1) ? this.lastSwap.p1 : this.lastSwap.p2;
                }

                if (g.length >= 5 && (w >= 5 || h >= 5)) spawnQ.push({ r: sP.r, c: sP.c, col: 0, sp: SPECIALS.BOMB });
                else if (w >= 3 && h >= 3) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.WRAP });
                else if (w === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.V_STRIPE });
                else if (h === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.H_STRIPE });
            });

            // Find recursive special hits
            let q = Array.from(toDestroy), done = new Set();
            while (q.length > 0) {
                let p = q.shift();
                if (done.has(p)) continue;
                done.add(p); toDestroy.add(p);

                if (p.special === 1) for(let c=0; c<SIZE; c++) { if(this.board[p.r][c] && !done.has(this.board[p.r][c])) q.push(this.board[p.r][c]); }
                else if (p.special === 2) for(let r=0; r<SIZE; r++) { if(this.board[r][p.c] && !done.has(this.board[r][p.c])) q.push(this.board[r][p.c]); }
                else if (p.special === 3) {
                    for(let r = Math.max(0, p.r-1); r <= Math.min(SIZE-1, p.r+1); r++)
                        for(let c = Math.max(0, p.c-1); c <= Math.min(SIZE-1, p.c+1); c++)
                            if (this.board[r][c] && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                } else if (p.special === 4) {
                    let tc = Math.floor(Math.random() * this.numColors) + 1;
                    for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) if (this.board[r][c]?.color === tc && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                }
            }

            if (toDestroy.size > 8) {
                this.boardEl.classList.add('shake');
                setTimeout(() => this.boardEl.classList.remove('shake'), 300);
            }

            if (toDestroy.size > 0) {
                this.sfx.pop(comboCount);
                if (comboCount > 1) {
                    let word = ACTION_WORDS[Math.floor(Math.random() * ACTION_WORDS.length)];
                    this.comboBanner(`${word} COMBO x${comboCount}!`);
                }

                toDestroy.forEach(p => {
                    this.createParticles(p);
                    p.el.classList.add('pop');
                    this.board[p.r][p.c] = null;
                    setTimeout(() => p.el.remove(), 250);
                });
                await wait(280);
            }

            spawnQ.forEach(s => this.spawnPiece(s.r, s.c, s.col, s.sp));
            await this.applyGravity();
            this.lastSwap = null;
            groups = this.findMatches();
        }

        if (this.moves > 0 && this.score < this.targetScore) {
            await this.ensureSolvable();
        }

        this.checkWinLoss();
    }

    async applyGravity() {
        let moved = false;
        for (let c = 0; c < SIZE; c++) {
            let empty = 0;
            for (let r = SIZE - 1; r >= 0; r--) {
                if (this.board[r][c] === null) empty++;
                else if (empty > 0) {
                    let p = this.board[r][c];
                    this.board[r][c] = null; p.r = r + empty; this.board[p.r][c] = p; moved = true;
                }
            }
            for (let r = empty - 1; r >= 0; r--) {
                this.spawnPiece(r, c, Math.floor(Math.random() * this.numColors) + 1, SPECIALS.NONE, empty);
                moved = true;
            }
        }
        if (moved) {
            this.updatePositions();
            await wait(300);
        }
    }

    computeStars() {
        const ratio = this.score / this.targetScore;
        if (ratio >= 1.6) return 3;
        if (ratio >= 1.25) return 2;
        return 1;
    }

    checkWinLoss() {
        if (this.score >= this.targetScore) {
            this.sfx.win();
            this.createConfetti();
            const stars = this.computeStars();
            this.currentLevelIdx++;
            if (this.currentLevelIdx >= LEVELS.length) {
                this.showScreen("YOU WIN!", `FINAL SCORE: ${this.score}`, "PLAY AGAIN", stars);
                this.currentLevelIdx = 0;
            } else {
                this.showScreen("LEVEL CLEAR!", `SCORE: ${this.score} / ${this.targetScore}`, "NEXT LEVEL", stars);
            }
        } else if (this.moves <= 0) {
            this.sfx.lose();
            this.showScreen("OUT OF MOVES", `SCORE: ${this.score} / ${this.targetScore}`, "TRY AGAIN");
        } else {
            // Ready for next input
            this.isProcessing = false;
        }
    }
}

window.addEventListener('load', () => game = new Match3Game());
</script>
