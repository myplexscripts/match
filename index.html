<script>
/* Targets are tuned against a bot playing random valid moves on this 6x8 board:
   that baseline is roughly 1.4k / 2.2k / 1.8k / 2.1k per level, so a target of
   ~0.8x baseline reads as a warm-up and ~1.4x demands deliberate play.
   Six colours is the ceiling here - seven leaves only ~7 tiles per colour on 48
   squares, which starves the board of matches. */
const LEVELS = [
    { id: 1, moves: 18, target: 1200, colors: 5, desc: "MATCH 3 OR MORE TO FILL THE METER!" },
    { id: 2, moves: 22, target: 2000, colors: 5, desc: "BIGGER TARGET. KEEP THE CASCADES GOING!" },
    { id: 3, moves: 26, target: 2400, colors: 6, desc: "MORE COLOURS. BUILD SPECIAL TILES!" },
    { id: 4, moves: 30, target: 3000, colors: 6, desc: "EXPERT MODE. COMBINE THE SPECIALS!" }
];

/* Each level dresses the background in a new colour story. */
/* Light/dark shade pair per candy colour - what the background gradient
   retints to whenever a match of that colour resolves. */
const COLOR_FAMILIES = {
    1: { light: '#A8DDD7', dark: '#246C67' }, // aqua
    2: { light: '#AAC2F7', dark: '#344B86' }, // blue
    3: { light: '#C6B1F4', dark: '#513A81' }, // violet
    4: { light: '#F0A2C5', dark: '#7E3052' }, // berry
    5: { light: '#F8AAA0', dark: '#873731' }, // coral
    6: { light: '#F8BC7D', dark: '#80461E' }, // orange
    7: { light: '#F3D47A', dark: '#755C20' }  // gold
};

/* Each level opens on a different colour's mood; matches then retint the
   background live from whatever was just cleared. */
const THEMES = [
    { colorId: 1, accent: '#55B7CB' },
    { colorId: 3, accent: '#9B7BE0' },
    { colorId: 4, accent: '#DE6399' },
    { colorId: 6, accent: '#EA8D3F' }
];

const SPECIALS = { NONE: 0, H_STRIPE: 1, V_STRIPE: 2, WRAP: 3, BOMB: 4 };

/* Power-ups: earned by picking one on the level-clear reward screen, used
   whenever the player likes (they don't cost a move). */
const POWER_UPS = {
    hammer: { icon: 'construction', name: 'Hammer', desc: 'Tap any tile to smash it instantly.' },
    shuffle: { icon: 'shuffle', name: 'Shuffle', desc: 'Reshuffle the whole board.' },
    extraMoves: { icon: 'add_circle', name: '+5 Moves', desc: 'Adds 5 extra moves to spend.' },
    colorBomb: { icon: 'auto_awesome', name: 'Color Bomb', desc: 'Drops a color bomb onto the board.' }
};

/* Coin-only power-ups: stronger versions of the free ones, bought from the
   shop rather than earned. Kept in a separate object (and given their own
   gold styling everywhere they render) so they always read as a distinct,
   premium tier rather than just "more of the same". */
const PREMIUM_POWER_UPS = {
    megaHammer: { icon: 'bolt', name: 'Mega Hammer', desc: 'Tap a tile to smash its whole row.', cost: 40 },
    doubleBomb: { icon: 'stars', name: 'Double Bomb', desc: 'Drops two color bombs at once.', cost: 60 }
};
const ACTION_WORDS = ["BAM!", "RAD!", "BOOM!", "SICK!", "WILD!", "POP!", "SWEET!", "TASTY!"];
const ICONS = {
    1: 'star',
    2: 'favorite',
    3: 'diamond',
    4: 'spa',
    5: 'cloud',
    6: 'sunny',
    7: 'bolt'
};
const COLORS = {
    1: '#429C94', 2: '#7197E8', 3: '#9B7BE0', 4: '#DE6399',
    5: '#EC7165', 6: '#EA8D3F', 7: '#E0B74A'
};
/* -100 shades of the same families, used to tint special tiles */
const TINTS = {
    1: '#E2F6F3', 2: '#E3ECFF', 3: '#EEE7FF', 4: '#FBE3EE',
    5: '#FFE5E1', 6: '#FFEBD8', 7: '#FFF3CF'
};

const COLS = 6;
const ROWS = 8;
const MAX_CELL = 88;
const ANIM_DUR = 250;
const wait = (ms) => new Promise(res => setTimeout(res, ms));

/* ---------- Lottie confetti ---------- */

const CONFETTI_PALETTE = ['#429C94', '#7197E8', '#9B7BE0', '#DE6399', '#EC7165', '#EA8D3F', '#E0B74A', '#68B77B', '#55B7CB'];

function hexToLottieColor(hex) {
    const n = parseInt(hex.replace('#', ''), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1];
}

/* Builds a Lottie animated-property keyframe array from plain {t, v} points.
   Every keyframe but the last needs both its start ("s") AND end ("e") value
   plus bezier ease handles ("i"/"o") - without them lottie-web's SVG
   renderer computes nothing for that property and silently drops the whole
   layer (display:none, empty <path>), with no console warning at all. This
   cost real time to track down via a minimal repro, so it's spelled out. */
function lottieKeyframes(points) {
    const EASE = { i: { x: [0.42], y: [1] }, o: { x: [0.58], y: [0] } };
    return points.map((p, i) => i === points.length - 1
        ? { t: p.t, s: p.v }
        : { t: p.t, s: p.v, e: points[i + 1].v, ...EASE });
}

/* Generates a self-contained Lottie composition (no external .json asset) so
   the confetti is drawn straight from this app's own palette every time,
   sized to whatever viewport is actually playing. */
function buildConfettiLottieData(w, h) {
    const fr = 30, op = 80, count = 70;
    const layers = [];
    for (let i = 0; i < count; i++) {
        const startFrame = Math.random() * 15;
        const fadeInEnd = startFrame + 6;
        const fadeOutStart = op - 16;
        const startX = Math.random() * w;
        const endX = startX + (Math.random() * 2 - 1) * 90;
        const startY = -40 - Math.random() * h * 0.3;
        const endY = h + 60;
        const rotStart = Math.random() * 360;
        const rotEnd = rotStart + (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540);
        const color = hexToLottieColor(CONFETTI_PALETTE[Math.floor(Math.random() * CONFETTI_PALETTE.length)]);
        const isCircle = Math.random() < 0.4;
        const sizeW = isCircle ? 10 + Math.random() * 8 : 7 + Math.random() * 6;
        const sizeH = isCircle ? sizeW : 12 + Math.random() * 10;

        const shape = { nm: 'shape', p: { a: 0, k: [0, 0] }, s: { a: 0, k: [sizeW, sizeH] } };
        if (isCircle) { shape.ty = 'el'; } else { shape.ty = 'rc'; shape.r = { a: 0, k: 2 }; shape.d = 1; }

        layers.push({
            ddd: 0, ind: i + 1, ty: 4, nm: `c${i}`, sr: 1, ao: 0, ip: 0, op, st: 0,
            ks: {
                o: { a: 1, k: lottieKeyframes([
                    { t: startFrame, v: [0] },
                    { t: fadeInEnd, v: [100] },
                    { t: fadeOutStart, v: [100] },
                    { t: op, v: [0] }
                ]) },
                r: { a: 1, k: lottieKeyframes([
                    { t: startFrame, v: [rotStart] },
                    { t: op, v: [rotEnd] }
                ]) },
                p: { a: 1, k: lottieKeyframes([
                    { t: startFrame, v: [startX, startY, 0] },
                    { t: op, v: [endX, endY, 0] }
                ]) },
                a: { a: 0, k: [0, 0, 0] },
                s: { a: 0, k: [100, 100, 100] }
            },
            // Lottie's SVG renderer expects the drawable + its style + its own
            // transform bundled inside a "gr" (group) item - shapes listed
            // flat under the layer (no group wrapper) silently render nothing.
            shapes: [
                {
                    ty: 'gr',
                    nm: 'piece',
                    it: [
                        shape,
                        { ty: 'fl', nm: 'fill', c: { a: 0, k: color }, o: { a: 0, k: 100 } },
                        { ty: 'tr', p: { a: 0, k: [0, 0] }, a: { a: 0, k: [0, 0] }, s: { a: 0, k: [100, 100] }, r: { a: 0, k: 0 }, o: { a: 0, k: 100 } }
                    ]
                }
            ]
        });
    }
    return { v: '5.9.6', fr, ip: 0, op, w, h, nm: 'confetti', ddd: 0, assets: [], layers };
}

class SFX {
    constructor() { this.ctx = null; this.muted = false; }
    ensure() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
    }
    tone(freq, dur = 0.12, type = 'sine', vol = 0.18, delay = 0) {
        if (this.muted) return;
        try {
            const ctx = this.ensure();
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(t0); osc.stop(t0 + dur + 0.03);
        } catch (e) { /* audio unavailable */ }
    }
    swap() { this.tone(320, 0.08, 'sine', 0.1); }
    invalid() { this.tone(150, 0.16, 'sawtooth', 0.1); }
    pop(streak = 1) { this.tone(420 + Math.min(streak, 6) * 55, 0.14, 'triangle', 0.16); }
    special() { this.tone(220, 0.3, 'sine', 0.14); this.tone(560, 0.28, 'sine', 0.1, 0.05); }
    shuffle() { this.tone(260, 0.2, 'square', 0.09); this.tone(330, 0.2, 'square', 0.07, 0.1); }
    win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.18, i * 0.12)); }
    lose() { [400, 340, 280].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.13, i * 0.15)); }
}

class Match3Game {
    constructor() {
        this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
        this.layer = document.getElementById('pieces-layer');
        this.boardEl = document.getElementById('board-container');
        this.boardWrap = document.getElementById('board-wrap');
        this.score = 0;
        this.moves = 0;
        this.currentLevelIdx = 0;
        this.isProcessing = false;
        this.lastProgress = 0;
        this.lastBankedStars = 0;
        this.sparkInterval = null;
        this.hintActive = false;
        this.lastActionAt = Date.now();
        this.sfx = new SFX();

        this.dragStart = null;
        this.selectedPiece = null;
        this.activePointerId = null;

        this.inventory = { hammer: 0, shuffle: 0, extraMoves: 0, colorBomb: 0, megaHammer: 0, doubleBomb: 0 };
        this.pendingPowerUp = null;
        this.coins = 0;

        this.applyTheme(0);
        this.layoutBoard();
        requestAnimationFrame(() => this.layoutBoard());
        this.bindEvents();
        this.startIdleWatcher();
        this.startWatchdog();
        this.updatePowerUpTray();
        this.updateCoinDisplay();
        this.showScreen(`LEVEL ${LEVELS[0].id}`, LEVELS[0].desc, "PLAY");
    }

    /* ---------- Background ---------- */

    applyTheme(levelIdx) {
        const t = THEMES[levelIdx % THEMES.length];
        this.theme = t;
        this.applyMatchColor(t.colorId);
        document.documentElement.style.setProperty('--accent', t.accent);
        // Set the transitioned properties directly so they animate reliably.
        document.getElementById('goal-meter').style.backgroundColor = t.accent;
        document.getElementById('screen-btn').style.backgroundColor = t.accent;
    }

    /* Retints the background gradient to a candy colour's own light/dark
       shades - called once per level for its opening mood, then again after
       every match so the background always reflects what was just cleared. */
    applyMatchColor(colorId) {
        const fam = COLOR_FAMILIES[colorId];
        if (!fam) return;
        document.documentElement.style.setProperty('--bg-light', fam.light);
        document.documentElement.style.setProperty('--bg-dark', fam.dark);
        // The gradient runs light-at-top to dark-at-bottom, and the status
        // bar sits at the very top - tint it to match what's actually behind
        // it there, not the shade from the opposite end of the screen.
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', fam.light);
    }

    /* ---------- Layout ---------- */

    layoutBoard() {
        const rect = this.boardWrap.getBoundingClientRect();
        const cs = getComputedStyle(this.boardWrap);
        const availW = rect.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const availH = rect.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const cell = Math.max(24, Math.min(MAX_CELL, Math.floor(Math.min(availW / COLS, availH / ROWS))));

        this.boardEl.style.width = `${cell * COLS}px`;
        this.boardEl.style.height = `${cell * ROWS}px`;
        document.documentElement.style.setProperty('--cell', `${cell}px`);
        document.documentElement.style.setProperty('--board-w', `${cell * COLS}px`);
    }

    bindEvents() {
        this.layer.addEventListener('pointerdown', (e) => this.handlePointerDown(e));
        window.addEventListener('pointerup', (e) => this.handlePointerUp(e));
        window.addEventListener('resize', () => this.layoutBoard());
        window.addEventListener('orientationchange', () => setTimeout(() => this.layoutBoard(), 120));
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('dblclick', e => e.preventDefault());
        document.getElementById('mute-btn').addEventListener('click', () => this.toggleMute());
        document.getElementById('shop-btn').addEventListener('click', () => this.openShop());
        document.getElementById('shop-close-btn').addEventListener('click', () => this.closeShop());
    }

    toggleMute() {
        this.sfx.muted = !this.sfx.muted;
        this.sfx.ensure();
        document.getElementById('mute-icon').innerText = this.sfx.muted ? 'volume_off' : 'volume_up';
    }

    showScreen(title, desc, btnText, stars = null, action = 'play') {
        document.getElementById('screen-title').innerText = title;
        document.getElementById('screen-desc').innerText = desc;
        document.getElementById('screen-btn').innerText = btnText;
        this.screenAction = action;
        const starsRow = document.getElementById('screen-stars');
        starsRow.innerHTML = '';
        if (stars !== null) {
            for (let i = 0; i < 3; i++) {
                const s = document.createElement('span');
                s.className = 'material-symbols-outlined star' + (i < stars ? ' filled' : '');
                s.innerText = 'star';
                starsRow.appendChild(s);
            }
        }
        document.getElementById('screen-overlay').classList.add('active');
    }

    hideScreen() {
        document.getElementById('screen-overlay').classList.remove('active');
    }

    /* The overlay button either starts a level directly, or - after clearing
       a level that has one to follow - opens the reward picker first. */
    onScreenButton() {
        if (this.screenAction === 'reward') {
            this.hideScreen();
            this.showRewardPicker();
            return;
        }
        this.startLevel();
    }

    async startLevel() {
        this.isProcessing = true;
        this.hideScreen();
        const config = LEVELS[this.currentLevelIdx] || LEVELS[LEVELS.length - 1];
        this.moves = config.moves;
        this.score = 0;
        this.lastProgress = 0;
        this.lastBankedStars = 0;
        this.targetScore = config.target;
        // Bar maps 0 -> this max, so the 2-star/3-star thresholds are visible as
        // real distance along the track instead of only existing after the win.
        this.starMax = config.target * 1.35;
        this.numColors = config.colors;

        this.applyTheme(this.currentLevelIdx);
        this.currentFillColor = this.theme.accent;
        document.getElementById('goal-meter').style.backgroundColor = this.currentFillColor;
        document.getElementById('meter-container').classList.remove('full');
        this.stopMeterSparks();
        document.getElementById('meter-glow').classList.remove('on');
        [1, 2, 3].forEach(i => document.getElementById(`mstar-${i}`).classList.remove('filled', 'pop'));
        this.resetIdleTimer();
        this.pendingPowerUp = null;
        this.updatePowerUpTray();
        this.updateHUD();
        this.layoutBoard();
        this.layer.innerHTML = '<div class="combo-banner" id="combo-banner"></div>';
        this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));

        this.fillBoardInitial();
        await this.ensureSolvable();
        this.isProcessing = false;
    }

    updateHUD() {
        document.getElementById('moves-txt').innerText = this.moves;
        document.getElementById('level-txt').innerText = `LVL ${this.currentLevelIdx + 1}`;
        document.getElementById('score-txt').innerText = this.score;

        const progress = Math.min(100, (this.score / this.starMax) * 100);
        document.getElementById('goal-meter').style.width = `${progress}%`;
        // "Full" here means the goal itself is reached (1 star), not the bar's
        // physical end - the bar's end is the 3-star mark.
        document.getElementById('meter-container').classList.toggle('full', this.score >= this.targetScore);

        if (progress > this.lastProgress) this.emitMeterSparks(progress, 4);
        this.lastProgress = progress;
        this.manageMeterSparks(progress);

        const banked = this.computeBankedStars();
        if (banked !== this.lastBankedStars) {
            if (banked > this.lastBankedStars) this.rushMeterColor(banked, progress);
            this.updateMeterStars(banked);
            this.lastBankedStars = banked;
        }
    }

    computeBankedStars() {
        const ratio = this.score / this.targetScore;
        if (ratio >= 1.35) return 3;
        if (ratio >= 1.15) return 2;
        if (ratio >= 1) return 1;
        return 0;
    }

    tierColorFor(banked) {
        if (banked >= 3) return '#EC7165'; // coral - hottest
        if (banked === 2) return '#EA8D3F'; // orange
        if (banked === 1) return '#E0B74A'; // gold
        return this.theme.accent;
    }

    /* The headline ask: crossing a star threshold floods the bar with a new
       colour instead of just quietly ticking a number up. */
    rushMeterColor(banked, progress) {
        const color = this.tierColorFor(banked);
        this.currentFillColor = color;
        const fill = document.getElementById('goal-meter');
        fill.style.backgroundColor = color;

        const sweep = document.createElement('div');
        sweep.className = 'meter-rush';
        fill.appendChild(sweep);
        setTimeout(() => sweep.remove(), 700);

        this.emitMeterSparks(progress, 14);
        this.sfx.special();
    }

    /* Mini stars on the track light up live, in sync with the real thresholds,
       so "how does scoring work" is answered by just watching the bar. */
    updateMeterStars(banked) {
        for (let i = 1; i <= 3; i++) {
            const el = document.getElementById(`mstar-${i}`);
            if (i <= banked) {
                el.classList.add('filled');
                el.classList.remove('pop');
                void el.offsetWidth;
                el.classList.add('pop');
            } else {
                el.classList.remove('filled', 'pop');
            }
        }
    }

    /* Bright glowing sparks skip off the leading edge whenever the meter
       advances - sized and lit to be unmistakable, not a subtle detail. */
    emitMeterSparks(progress, count = 4) {
        const fx = document.getElementById('meter-fx');
        if (!fx) return;
        const w = fx.clientWidth;
        if (!w) return;
        const x = Math.min(w, (progress / 100) * w);
        const col = this.currentFillColor || '#55B7CB';
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            s.className = 'spark';
            const size = 6 + Math.random() * 7;
            s.style.width = `${size}px`;
            s.style.height = `${size}px`;
            s.style.left = `${x}px`;
            s.style.top = '50%';
            s.style.background = '#ffffff';
            s.style.boxShadow = `0 0 ${Math.round(size * 1.4)}px ${Math.round(size * 0.7)}px ${col}`;
            s.style.setProperty('--mx', `${(Math.random() * 2 - 1) * 28}px`);
            s.style.setProperty('--my', `${-18 - Math.random() * 30}px`);
            s.style.animationDelay = `${Math.random() * 0.1}s`;
            fx.appendChild(s);
            setTimeout(() => s.remove(), 1050);
        }
    }

    /* Constant sparks plus a pulsing glow orb once the bar passes its
       halfway point, on top of the reactive bursts above - stops the
       instant the bar empties or maxes out. */
    manageMeterSparks(progress) {
        const active = progress >= 51 && progress < 100;
        const glow = document.getElementById('meter-glow');
        glow.style.left = `${progress}%`;
        const col = this.currentFillColor || '#55B7CB';
        glow.style.background = `radial-gradient(circle, #ffffff 0%, ${col} 45%, rgba(255,255,255,0) 74%)`;
        glow.classList.toggle('on', active);

        if (active && !this.sparkInterval) {
            this.sparkInterval = setInterval(() => this.emitMeterSparks(this.lastProgress, 2), 140);
        } else if (!active) {
            this.stopMeterSparks();
        }
    }

    stopMeterSparks() {
        if (this.sparkInterval) { clearInterval(this.sparkInterval); this.sparkInterval = null; }
        const glow = document.getElementById('meter-glow');
        if (glow) glow.classList.remove('on');
    }

    bumpHUD(el) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
    }

    addScore(pts) {
        this.score += pts;
        this.updateHUD();
        this.bumpHUD(document.getElementById('score-txt'));
    }

    fillBoardInitial() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let color;
                do { color = Math.floor(Math.random() * this.numColors) + 1; }
                while (
                    (c >= 2 && this.board[r][c-1]?.color === color && this.board[r][c-2]?.color === color) ||
                    (r >= 2 && this.board[r-1][c]?.color === color && this.board[r-2][c]?.color === color)
                );
                this.spawnPiece(r, c, color, SPECIALS.NONE);
            }
        }
    }

    spawnPiece(r, c, color, special, dropFromOffset = 0) {
        const el = document.createElement('div');
        el.className = 'piece';

        const inner = document.createElement('div');
        inner.className = 'piece-inner';
        if (special === SPECIALS.H_STRIPE) inner.classList.add('sp-h');
        else if (special === SPECIALS.V_STRIPE) inner.classList.add('sp-v');
        else if (special === SPECIALS.WRAP) inner.classList.add('sp-wrap');
        else if (special === SPECIALS.BOMB) inner.classList.add('sp-bomb');

        if (special !== SPECIALS.BOMB) {
            inner.style.setProperty('--pc', COLORS[color]);
            inner.style.setProperty('--tint', TINTS[color]);
        }

        const fx = document.createElement('div');
        fx.className = 'fx';
        inner.appendChild(fx);

        const icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.innerText = special === SPECIALS.BOMB ? 'auto_awesome' : ICONS[color];
        if (special !== SPECIALS.BOMB) icon.style.color = COLORS[color];
        inner.appendChild(icon);

        el.appendChild(inner);
        this.layer.appendChild(el);

        const piece = { r, c, color, special, el, inner };
        this.board[r][c] = piece;

        el.style.transform = `translate(${c * 100}%, ${(r - dropFromOffset) * 100}%)`;
        requestAnimationFrame(() => el.style.transform = `translate(${c * 100}%, ${r * 100}%)`);
        return piece;
    }

    createParticles(piece) {
        const cellW = this.boardEl.clientWidth / COLS;
        const cellH = this.boardEl.clientHeight / ROWS;
        const x = (piece.c * cellW) + (cellW / 2);
        const y = (piece.r * cellH) + (cellH / 2);

        const big = piece.special !== SPECIALS.NONE;
        const count = big ? 10 : 6;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            // Colour bombs scatter the whole rainbow; everything else its own colour.
            p.style.background = piece.special === SPECIALS.BOMB
                ? COLORS[Math.floor(Math.random() * 7) + 1]
                : COLORS[piece.color];
            p.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px';

            const base = big ? 12 : 8;
            p.style.width = `${Math.random() * base + base}px`;
            p.style.height = p.style.width;

            p.style.left = `${x}px`;
            p.style.top = `${y}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * (big ? 90 : 60) + 30;
            p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
            p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);

            this.layer.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }
    }

    spawnShockwave(r, c) {
        const cellW = this.boardEl.clientWidth / COLS;
        const cellH = this.boardEl.clientHeight / ROWS;
        const el = document.createElement('div');
        el.className = 'shockwave';
        el.style.left = `${(c * cellW) + (cellW / 2)}px`;
        el.style.top = `${(r * cellH) + (cellH / 2)}px`;
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 500);
    }

    /* Plain CSS confetti - kept as a fallback for playLottieConfetti() below,
       in case lib/lottie-light.min.js ever fails to load. */
    createConfetti() {
        const colors = Object.values(COLORS);
        for (let i = 0; i < 50; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = `${Math.random() * 100}vw`;
            conf.style.background = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
            conf.style.animationDuration = `${Math.random() * 2 + 2}s`;
            conf.style.animationDelay = `${Math.random() * 0.5}s`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 5000);
        }
    }

    /* Builds a Lottie composition of confetti pieces on the fly, in our own
       palette, sized to the current viewport - no external animation asset,
       just the (self-hosted) Lottie renderer driving a generated scene. */
    playLottieConfetti() {
        const container = document.getElementById('confetti-lottie');
        if (!container) return;
        if (typeof lottie === 'undefined') { this.createConfetti(); return; }

        container.innerHTML = '';
        const w = Math.max(1, window.innerWidth);
        const h = Math.max(1, window.innerHeight);
        const data = buildConfettiLottieData(w, h);
        let anim;
        try {
            anim = lottie.loadAnimation({ container, renderer: 'svg', loop: false, autoplay: true, animationData: data });
        } catch (e) {
            this.createConfetti();
            return;
        }
        const cleanup = () => { try { anim.destroy(); } catch (e) {} container.innerHTML = ''; };
        anim.addEventListener('complete', cleanup);
        setTimeout(cleanup, (data.op / data.fr) * 1000 + 500);
    }

    /* ---------- Coins ---------- */

    updateCoinDisplay() {
        document.getElementById('coin-txt').innerText = this.coins;
        document.getElementById('shop-coin-txt').innerText = this.coins;
    }

    addCoins(n) {
        this.coins += n;
        this.updateCoinDisplay();
        const chip = document.getElementById('coin-chip');
        chip.classList.remove('bump');
        void chip.offsetWidth;
        chip.classList.add('bump');
    }

    /* ---------- Shop ---------- */

    openShop() {
        const row = document.getElementById('shop-row');
        row.innerHTML = '';
        Object.keys(PREMIUM_POWER_UPS).forEach(type => {
            const def = PREMIUM_POWER_UPS[type];
            const affordable = this.coins >= def.cost;
            const card = document.createElement('div');
            card.className = 'reward-card premium' + (affordable ? '' : ' unaffordable');
            card.innerHTML = `<span class="material-symbols-outlined">${def.icon}</span><span class="rc-name">${def.name}</span><span class="rc-desc">${def.desc}</span><span class="rc-cost"><span class="material-symbols-outlined">paid</span>${def.cost}</span>`;
            if (affordable) card.addEventListener('click', () => this.buyPremium(type));
            row.appendChild(card);
        });
        this.updateCoinDisplay();
        document.getElementById('shop-overlay').classList.add('active');
    }

    closeShop() {
        document.getElementById('shop-overlay').classList.remove('active');
    }

    buyPremium(type) {
        const def = PREMIUM_POWER_UPS[type];
        if (!def || this.coins < def.cost) return;
        this.coins -= def.cost;
        this.inventory[type] = (this.inventory[type] || 0) + 1;
        this.sfx.special();
        this.updateCoinDisplay();
        this.updatePowerUpTray();
        this.openShop(); // refresh affordability/prices in place
    }

    /* ---------- Power-ups ---------- */

    updatePowerUpTray() {
        const tray = document.getElementById('powerup-tray');
        if (!tray) return;
        tray.innerHTML = '';
        const renderOne = (type, def, premium) => {
            const count = this.inventory[type] || 0;
            const btn = document.createElement('button');
            btn.className = 'pu-btn'
                + (count === 0 ? ' empty' : '')
                + (this.pendingPowerUp === type ? ' armed' : '')
                + (premium ? ' premium' : '');
            btn.setAttribute('aria-label', `${def.name} (${count})`);
            btn.innerHTML = `<span class="material-symbols-outlined">${def.icon}</span><span class="pu-count">${count}</span>`;
            btn.addEventListener('click', () => this.usePowerUp(type));
            tray.appendChild(btn);
        };
        Object.keys(POWER_UPS).forEach(type => renderOne(type, POWER_UPS[type], false));
        Object.keys(PREMIUM_POWER_UPS).forEach(type => renderOne(type, PREMIUM_POWER_UPS[type], true));
    }

    usePowerUp(type) {
        if (this.isProcessing) return;
        if (!this.inventory[type]) return;

        // Hammer and its premium row-clearing cousin both need a target
        // tile, so tapping them just arms/disarms targeting mode; the
        // actual use happens in handlePointerDown.
        if (type === 'hammer' || type === 'megaHammer') {
            this.pendingPowerUp = this.pendingPowerUp === type ? null : type;
            this.updatePowerUpTray();
            return;
        }

        this.inventory[type]--;
        this.sfx.special();

        if (type === 'shuffle') {
            this.isProcessing = true;
            this.updatePowerUpTray();
            this.reshuffleBoard().then(() => { this.isProcessing = false; });
        } else if (type === 'extraMoves') {
            this.moves += 5;
            this.bumpHUD(document.getElementById('moves-txt'));
            this.updateHUD();
            this.updatePowerUpTray();
        } else if (type === 'colorBomb') {
            this.dropColorBombs(1);
            this.updatePowerUpTray();
        } else if (type === 'doubleBomb') {
            this.dropColorBombs(2);
            this.updatePowerUpTray();
        }
    }

    /* Smashes one tile directly - no move spent, and deliberately does not
       chain into a full cascade check the way a real match would; it's a
       simple, predictable utility rather than another match trigger. */
    async useHammer(piece) {
        this.pendingPowerUp = null;
        this.inventory.hammer--;
        this.updatePowerUpTray();
        this.isProcessing = true;
        this.sfx.pop(1);
        this.createParticles(piece);
        piece.el.classList.add('pop');
        this.board[piece.r][piece.c] = null;
        this.addScore(20);
        setTimeout(() => piece.el.remove(), 260);
        await wait(260);
        await this.applyGravity();
        if (this.moves > 0 && this.score < this.starMax) await this.ensureSolvable();
        this.checkWinLoss();
    }

    /* Premium version of the hammer: smashes the whole row the tapped tile
       is in, same no-move / no-cascade rules as the regular hammer. */
    async useMegaHammer(piece) {
        this.pendingPowerUp = null;
        this.inventory.megaHammer--;
        this.updatePowerUpTray();
        this.isProcessing = true;
        this.sfx.special();
        this.screenFlash();
        const row = piece.r;
        const victims = [];
        for (let c = 0; c < COLS; c++) if (this.board[row][c]) victims.push(this.board[row][c]);
        victims.forEach(p => {
            this.createParticles(p);
            p.el.classList.add('pop');
            this.board[p.r][p.c] = null;
            this.addScore(15);
            setTimeout(() => p.el.remove(), 260);
        });
        await wait(300);
        await this.applyGravity();
        if (this.moves > 0 && this.score < this.starMax) await this.ensureSolvable();
        this.checkWinLoss();
    }

    dropColorBombs(count) {
        for (let i = 0; i < count; i++) {
            const candidates = [];
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                if (this.board[r][c] && this.board[r][c].special === SPECIALS.NONE) candidates.push([r, c]);
            }
            if (!candidates.length) return;
            const [r, c] = candidates[Math.floor(Math.random() * candidates.length)];
            const old = this.board[r][c];
            old.el.remove();
            this.board[r][c] = null;
            this.spawnShockwave(r, c);
            this.spawnPiece(r, c, 0, SPECIALS.BOMB);
        }
    }

    showRewardPicker() {
        const picks = Object.keys(POWER_UPS).sort(() => Math.random() - 0.5).slice(0, 2);
        const row = document.getElementById('reward-row');
        row.innerHTML = '';
        picks.forEach(type => {
            const def = POWER_UPS[type];
            const card = document.createElement('div');
            card.className = 'reward-card';
            card.innerHTML = `<span class="material-symbols-outlined">${def.icon}</span><span class="rc-name">${def.name}</span><span class="rc-desc">${def.desc}</span>`;
            card.addEventListener('click', () => this.pickReward(type));
            row.appendChild(card);
        });
        document.getElementById('reward-overlay').classList.add('active');
    }

    pickReward(type) {
        this.inventory[type] = (this.inventory[type] || 0) + 1;
        this.updatePowerUpTray();
        document.getElementById('reward-overlay').classList.remove('active');
        this.startLevel();
    }

    showFloatingText(r, c, text, scale = 1) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = `${c * (100 / COLS) + (100 / COLS) / 2}%`;
        el.style.top = `${r * (100 / ROWS) + (100 / ROWS) / 2}%`;
        if (scale !== 1) el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    comboBanner(text) {
        const el = document.getElementById('combo-banner');
        if (!el) return;
        el.innerText = text;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
    }

    screenFlash() {
        const flash = document.createElement('div');
        flash.className = 'flash';
        this.boardEl.appendChild(flash);
        setTimeout(() => flash.remove(), 200);
    }

    /* ---------- Idle hint ---------- */

    resetIdleTimer() {
        this.lastActionAt = Date.now();
    }

    startIdleWatcher() {
        setInterval(() => {
            if (this.isProcessing || this.hintActive) return;
            if (document.getElementById('screen-overlay').classList.contains('active')) return;
            if (Date.now() - this.lastActionAt < 10000) return;
            this.showHint();
        }, 1000);
    }

    /* ---------- Safety net ----------
       Belt-and-braces for state I can't prove is unreachable: if input stays
       blocked for an unreasonable stretch with no overlay to explain it, or
       the board ends up with empty cells nothing is filling, self-heal
       instead of leaving the player stuck with a dead board. */
    startWatchdog() {
        setInterval(() => {
            const overlayActive = document.getElementById('screen-overlay').classList.contains('active');
            if (this.isProcessing && !overlayActive) {
                this.stuckTicks = (this.stuckTicks || 0) + 1;
                if (this.stuckTicks > 7) {
                    console.warn('[match] input was stuck; repairing board.');
                    this.repairBoard();
                }
            } else {
                this.stuckTicks = 0;
            }
            if (!this.isProcessing && !overlayActive && this.board) {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (!this.board[r][c]) { this.repairBoard(); return; }
                    }
                }
                // Continuous hygiene, independent of the stuck/hole checks above:
                // once the board is settled, any .piece element that isn't the
                // current occupant of its cell is a leftover from a timer that
                // fired late (a real device under load can run setTimeout well
                // past its requested delay). Sweep those every tick so a stray
                // tile can never sit there indefinitely looking like it's
                // "always reacting" to input meant for the real tile above it.
                const valid = new Set();
                for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) valid.add(this.board[r][c].el);
                this.layer.querySelectorAll('.piece').forEach(el => { if (!valid.has(el)) el.remove(); });
            }
        }, 1000);
    }

    async repairBoard() {
        if (this.repairing) return;
        this.repairing = true;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (!this.board[r][c]) this.spawnPiece(r, c, Math.floor(Math.random() * this.numColors) + 1, SPECIALS.NONE);
            }
        }
        const valid = new Set();
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) valid.add(this.board[r][c].el);
        this.layer.querySelectorAll('.piece').forEach(el => { if (!valid.has(el)) el.remove(); });
        this.updatePositions();
        this.isProcessing = false;
        this.stuckTicks = 0;
        this.dragStart = null;
        this.activePointerId = null;
        this.clearSelection();
        await this.ensureSolvable();
        this.repairing = false;
    }

    findHintMove() {
        // Collect every valid move and pick one at random - always returning
        // the first hit from a (0,0)-first scan meant a hint would disproportionately
        // land on the same top-left tiles almost every time it fired.
        const moves = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (!p) continue;
                if (c < COLS - 1) {
                    const q = this.board[r][c + 1];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r, c + 1))) moves.push([p, q]);
                }
                if (r < ROWS - 1) {
                    const q = this.board[r + 1][c];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r + 1, c))) moves.push([p, q]);
                }
            }
        }
        if (!moves.length) return null;
        return moves[Math.floor(Math.random() * moves.length)];
    }

    showHint() {
        const move = this.findHintMove();
        if (!move) return;
        this.hintActive = true;
        const [p1, p2] = move;
        p1.inner.classList.add('hint');
        p2.inner.classList.add('hint');
        setTimeout(() => {
            p1.inner.classList.remove('hint');
            p2.inner.classList.remove('hint');
            this.hintActive = false;
            // Require another full 10s of idling before nudging again.
            this.resetIdleTimer();
        }, 1100);
    }

    /* A quick tactile burst right where the player's finger lands. */
    tapBurst(piece) {
        const cellW = this.boardEl.clientWidth / COLS;
        const cellH = this.boardEl.clientHeight / ROWS;
        const x = (piece.c * cellW) + (cellW / 2);
        const y = (piece.r * cellH) + (cellH / 2);
        const col = piece.special === SPECIALS.BOMB ? '#E2F6F3' : COLORS[piece.color];

        for (let i = 0; i < 4; i++) {
            const p = document.createElement('div');
            p.className = 'particle tap-particle';
            p.style.background = col;
            p.style.borderRadius = '50%';
            const size = 4 + Math.random() * 4;
            p.style.width = `${size}px`;
            p.style.height = `${size}px`;
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            const angle = Math.random() * Math.PI * 2;
            const dist = 14 + Math.random() * 14;
            p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
            p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);
            p.style.animationDuration = '0.35s';
            this.layer.appendChild(p);
            setTimeout(() => p.remove(), 380);
        }
    }

    handlePointerDown(e) {
        this.resetIdleTimer();
        if (this.isProcessing) return;
        // A phone very easily registers a second, accidental touch (a palm
        // resting on the glass, a thumb bracing the edge). Without tracking
        // which pointer we actually started a gesture with, that stray touch
        // gets processed as if it were part of the same interaction - which
        // reads as some unrelated tile "randomly" reacting to every tap.
        if (this.activePointerId !== null && e.pointerId !== this.activePointerId) return;

        const target = e.target.closest('.piece');
        if (!target) return;

        const piece = this.getPieceFromElement(target);
        if (!piece) return;

        this.activePointerId = e.pointerId;
        this.sfx.ensure();

        if (this.pendingPowerUp === 'hammer') {
            this.useHammer(piece);
            return;
        }
        if (this.pendingPowerUp === 'megaHammer') {
            this.useMegaHammer(piece);
            return;
        }

        if (this.selectedPiece) {
            if (this.selectedPiece === piece) { this.clearSelection(); return; }
            const dr = Math.abs(this.selectedPiece.r - piece.r);
            const dc = Math.abs(this.selectedPiece.c - piece.c);
            if (dr + dc === 1) { this.attemptSwap(this.selectedPiece, piece); this.clearSelection(); return; }
            this.clearSelection();
        }

        this.selectedPiece = piece;
        piece.el.classList.add('selected');
        this.tapBurst(piece);
        this.dragStart = { x: e.clientX, y: e.clientY, piece: piece };
    }

    handlePointerUp(e) {
        if (e.pointerId !== this.activePointerId) return;
        this.activePointerId = null;
        if (!this.dragStart || this.isProcessing) return;
        const dx = e.clientX - this.dragStart.x;
        const dy = e.clientY - this.dragStart.y;
        const threshold = Math.max(18, this.boardEl.clientWidth / COLS * 0.4);

        if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
            let tr = this.dragStart.piece.r, tc = this.dragStart.piece.c;
            if (Math.abs(dx) > Math.abs(dy)) tc += (dx > 0 ? 1 : -1); else tr += (dy > 0 ? 1 : -1);
            // The target cell can be empty (board edge miscalculation, or an
            // in-flight resolve) - swapping against null would throw and,
            // since isProcessing is already latched true by then, permanently
            // lock input. Only ever attempt a swap against a real piece.
            if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS && this.board[tr][tc]) {
                this.attemptSwap(this.dragStart.piece, this.board[tr][tc]);
            }
            this.clearSelection();
        }
        this.dragStart = null;
    }

    clearSelection() {
        if (this.selectedPiece) { this.selectedPiece.el.classList.remove('selected'); this.selectedPiece = null; }
    }

    getPieceFromElement(el) {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.el === el) return this.board[r][c];
        return null;
    }

    async attemptSwap(p1, p2) {
        // Belt-and-braces: never let a null piece reach swapData, which would
        // throw and strand isProcessing at true forever.
        if (!p1 || !p2) return;
        this.isProcessing = true;
        this.sfx.swap();

        this.swapData(p1, p2);
        this.updatePositions();
        await wait(ANIM_DUR);

        const comboResult = this.checkSpecialCombo(p1, p2);
        let matchGroups = comboResult.isCombo ? [] : this.findMatches();

        // Invalid move: wiggle and swap back (does not cost a move)
        if (!comboResult.isCombo && matchGroups.length === 0) {
            this.sfx.invalid();
            p1.inner.classList.add('wiggle', 'invalid');
            p2.inner.classList.add('wiggle', 'invalid');
            await wait(300);
            p1.inner.classList.remove('wiggle', 'invalid');
            p2.inner.classList.remove('wiggle', 'invalid');

            this.swapData(p1, p2);
            this.updatePositions();
            await wait(ANIM_DUR);

            this.isProcessing = false;
            return;
        }

        this.moves--;
        this.bumpHUD(document.getElementById('moves-txt'));
        this.updateHUD();

        this.lastSwap = { p1, p2 };
        await this.resolveBoard(matchGroups, comboResult);
    }

    swapData(p1, p2) {
        const tR = p1.r, tC = p1.c;
        p1.r = p2.r; p1.c = p2.c; p2.r = tR; p2.c = tC;
        this.board[p1.r][p1.c] = p1; this.board[p2.r][p2.c] = p2;
    }

    updatePositions() {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) this.board[r][c].el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
    }

    findMatches() {
        let horiz = [], vert = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                let col = this.board[r][c]?.color;
                if (!col) continue;
                let len = 1; while (c + len < COLS && this.board[r][c + len]?.color === col) len++;
                if (len >= 3) {
                    let g = []; for (let i = 0; i < len; i++) g.push(this.board[r][c + i]);
                    horiz.push(g); c += len - 1;
                }
            }
        }
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                let col = this.board[r][c]?.color;
                if (!col) continue;
                let len = 1; while (r + len < ROWS && this.board[r + len][c]?.color === col) len++;
                if (len >= 3) {
                    let g = []; for (let i = 0; i < len; i++) g.push(this.board[r + i][c]);
                    vert.push(g); r += len - 1;
                }
            }
        }
        let all = [...horiz, ...vert], merged = [];
        while (all.length > 0) {
            let cur = new Set(all.shift()), found = true;
            while (found) {
                found = false;
                for (let i = 0; i < all.length; i++) {
                    if (all[i].some(p => cur.has(p))) { all[i].forEach(p => cur.add(p)); all.splice(i, 1); found = true; break; }
                }
            }
            merged.push(Array.from(cur));
        }
        return merged;
    }

    // Simulates swapping the contents of two board cells and checks whether it produces a match.
    // Does not touch piece.r/c, since findMatches() only reads through this.board[r][c].
    simulateSwapHasMatch(r1, c1, r2, c2) {
        const b = this.board;
        const a = b[r1][c1], d = b[r2][c2];
        b[r1][c1] = d; b[r2][c2] = a;
        const hasMatch = this.findMatches().length > 0;
        b[r1][c1] = a; b[r2][c2] = d;
        return hasMatch;
    }

    hasPossibleMove() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (!p) continue;
                if (c < COLS - 1) {
                    const q = this.board[r][c + 1];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r, c + 1))) return true;
                }
                if (r < ROWS - 1) {
                    const q = this.board[r + 1][c];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r + 1, c))) return true;
                }
            }
        }
        return false;
    }

    async ensureSolvable() {
        if (!this.hasPossibleMove()) await this.reshuffleBoard();
    }

    async reshuffleBoard() {
        this.comboBanner("SHUFFLING!");
        this.sfx.shuffle();

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (p) {
                    p.el.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    p.el.style.opacity = '0';
                    p.el.style.transform += ' scale(0.4) rotate(20deg)';
                }
            }
        }
        await wait(320);

        let attempts = 0;
        do {
            this.layer.innerHTML = '<div class="combo-banner" id="combo-banner"></div>';
            this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
            this.fillBoardInitial();
            attempts++;
        } while (!this.hasPossibleMove() && attempts < 20);

        await wait(100);
    }

    checkSpecialCombo(p1, p2) {
        const s1 = p1.special, s2 = p2.special;
        if (s1 === SPECIALS.NONE && s2 === SPECIALS.NONE) return { isCombo: false };

        // Exactly one piece is special: only a colour bomb auto-triggers on swap.
        if (s1 === SPECIALS.NONE || s2 === SPECIALS.NONE) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : (s2 === SPECIALS.BOMB ? p2 : null);
            if (bomb) {
                const normal = bomb === p1 ? p2 : p1;
                return { isCombo: true, type: 'BOMB_COLOR', color: normal.color, origin: bomb };
            }
            return { isCombo: false };
        }

        // Both pieces are special.
        if (s1 === SPECIALS.BOMB && s2 === SPECIALS.BOMB) return { isCombo: true, type: 'BOMB_BOMB' };
        if (s1 === SPECIALS.BOMB || s2 === SPECIALS.BOMB) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : p2;
            const other = bomb === p1 ? p2 : p1;
            return { isCombo: true, type: 'BOMB_SPECIAL', origin: bomb, other };
        }
        const isStripe = s => s === SPECIALS.H_STRIPE || s === SPECIALS.V_STRIPE;
        if (isStripe(s1) && isStripe(s2)) return { isCombo: true, type: 'STRIPE_STRIPE', origin: p2 };
        if (s1 === SPECIALS.WRAP && s2 === SPECIALS.WRAP) return { isCombo: true, type: 'WRAP_WRAP', origin: p2 };

        const wrapPiece = s1 === SPECIALS.WRAP ? p1 : p2;
        return { isCombo: true, type: 'STRIPE_WRAP', origin: wrapPiece };
    }

    async resolveBoard(initialGroups, initialCombo) {
        let groups = initialGroups, combo = initialCombo, comboCount = 0;

        while (groups.length > 0 || combo?.isCombo) {
            let toDestroy = new Set(), spawnQ = [];
            let matchColor = null;
            comboCount++;

            if (combo?.isCombo) {
                this.sfx.special();
                if (combo.type === 'BOMB_BOMB') {
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(ROWS / 2, COLS / 2);
                } else if (combo.type === 'BOMB_COLOR') {
                    matchColor = combo.color;
                    toDestroy.add(combo.origin);
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === combo.color) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'BOMB_SPECIAL') {
                    matchColor = combo.other.color;
                    toDestroy.add(combo.origin); toDestroy.add(combo.other);
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === combo.other.color) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'WRAP_WRAP') {
                    matchColor = combo.origin.color;
                    toDestroy.add(combo.origin);
                    for (let r = Math.max(0, combo.origin.r - 2); r <= Math.min(ROWS - 1, combo.origin.r + 2); r++)
                        for (let c = Math.max(0, combo.origin.c - 2); c <= Math.min(COLS - 1, combo.origin.c + 2); c++)
                            if (this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'STRIPE_WRAP') {
                    matchColor = combo.origin.color;
                    toDestroy.add(combo.origin);
                    for (let dr = -1; dr <= 1; dr++) {
                        const rr = combo.origin.r + dr;
                        if (rr < 0 || rr >= ROWS) continue;
                        for (let c = 0; c < COLS; c++) if (this.board[rr][c]) toDestroy.add(this.board[rr][c]);
                    }
                    for (let dc = -1; dc <= 1; dc++) {
                        const cc = combo.origin.c + dc;
                        if (cc < 0 || cc >= COLS) continue;
                        for (let r = 0; r < ROWS; r++) if (this.board[r][cc]) toDestroy.add(this.board[r][cc]);
                    }
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'STRIPE_STRIPE') {
                    matchColor = combo.origin.color;
                    toDestroy.add(combo.origin);
                    for (let c = 0; c < COLS; c++) if (this.board[combo.origin.r][c]) toDestroy.add(this.board[combo.origin.r][c]);
                    for (let r = 0; r < ROWS; r++) if (this.board[r][combo.origin.c]) toDestroy.add(this.board[r][combo.origin.c]);
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                }
                combo = null;
            }

            groups.forEach(g => {
                g.forEach(p => toDestroy.add(p));
                const points = g.length * 10 * comboCount;
                this.addScore(points);

                const mid = Math.floor(g.length / 2);
                this.showFloatingText(g[mid].r, g[mid].c, `+${points}`);

                let xs = g.map(p => p.c), ys = g.map(p => p.r);
                let w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;

                let sP = g[0];
                if (this.lastSwap && (g.includes(this.lastSwap.p1) || g.includes(this.lastSwap.p2))) {
                    sP = g.includes(this.lastSwap.p1) ? this.lastSwap.p1 : this.lastSwap.p2;
                }

                if (g.length >= 5 && (w >= 5 || h >= 5)) spawnQ.push({ r: sP.r, c: sP.c, col: 0, sp: SPECIALS.BOMB });
                else if (w >= 3 && h >= 3) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.WRAP });
                else if (w === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.V_STRIPE });
                else if (h === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.H_STRIPE });
            });

            // Retint the background to whichever colour was just matched -
            // the group touching the player's actual swap wins on the first
            // iteration; later cascade iterations (no swap to anchor to)
            // fall back to the biggest group in that wave.
            if (groups.length > 0) {
                let primary = groups[0];
                if (this.lastSwap) {
                    const swapGroup = groups.find(g => g.includes(this.lastSwap.p1) || g.includes(this.lastSwap.p2));
                    if (swapGroup) primary = swapGroup;
                } else if (groups.length > 1) {
                    primary = groups.reduce((a, b) => (b.length > a.length ? b : a), groups[0]);
                }
                if (primary[0]) matchColor = primary[0].color;
            }
            if (matchColor) this.applyMatchColor(matchColor);

            // Find recursive special hits
            let q = Array.from(toDestroy), done = new Set();
            while (q.length > 0) {
                let p = q.shift();
                if (done.has(p)) continue;
                done.add(p); toDestroy.add(p);

                if (p.special === SPECIALS.H_STRIPE) { for (let c = 0; c < COLS; c++) if (this.board[p.r][c] && !done.has(this.board[p.r][c])) q.push(this.board[p.r][c]); }
                else if (p.special === SPECIALS.V_STRIPE) { for (let r = 0; r < ROWS; r++) if (this.board[r][p.c] && !done.has(this.board[r][p.c])) q.push(this.board[r][p.c]); }
                else if (p.special === SPECIALS.WRAP) {
                    for (let r = Math.max(0, p.r - 1); r <= Math.min(ROWS - 1, p.r + 1); r++)
                        for (let c = Math.max(0, p.c - 1); c <= Math.min(COLS - 1, p.c + 1); c++)
                            if (this.board[r][c] && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                } else if (p.special === SPECIALS.BOMB) {
                    let tc = Math.floor(Math.random() * this.numColors) + 1;
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === tc && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                }
            }

            if (toDestroy.size > 7) {
                this.boardEl.classList.add('shake');
                setTimeout(() => this.boardEl.classList.remove('shake'), 300);
            }

            if (toDestroy.size > 0) {
                this.sfx.pop(comboCount);
                if (comboCount > 1) {
                    let word = ACTION_WORDS[Math.floor(Math.random() * ACTION_WORDS.length)];
                    this.comboBanner(`${word} COMBO x${comboCount}!`);
                }

                // Stagger the pops into a little ripple instead of one flat pulse,
                // and give the wait enough room to cover the longest delayed one.
                const destroyList = Array.from(toDestroy);
                const stagger = Math.min(18, 160 / Math.max(1, destroyList.length));
                destroyList.forEach((p, i) => {
                    const delay = i * stagger;
                    setTimeout(() => this.createParticles(p), delay);
                    p.el.style.animationDelay = `${delay}ms`;
                    p.el.classList.add('pop');
                    this.board[p.r][p.c] = null;
                    setTimeout(() => p.el.remove(), delay + 250);
                });
                await wait(250 + Math.min(220, (destroyList.length - 1) * stagger) + 30);
            }

            spawnQ.forEach(s => this.spawnPiece(s.r, s.c, s.col, s.sp));
            await this.applyGravity();
            this.lastSwap = null;
            groups = this.findMatches();
        }

        if (this.moves > 0 && this.score < this.starMax) await this.ensureSolvable();

        this.checkWinLoss();
    }

    async applyGravity() {
        let moved = false;
        const movedPieces = [];
        for (let c = 0; c < COLS; c++) {
            let empty = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (this.board[r][c] === null) empty++;
                else if (empty > 0) {
                    let p = this.board[r][c];
                    this.board[r][c] = null; p.r = r + empty; this.board[p.r][c] = p; moved = true;
                    movedPieces.push(p);
                }
            }
            for (let r = empty - 1; r >= 0; r--) {
                movedPieces.push(this.spawnPiece(r, c, Math.floor(Math.random() * this.numColors) + 1, SPECIALS.NONE, empty));
                moved = true;
            }
        }
        if (moved) {
            this.updatePositions();
            await wait(300);
            // A little squash on arrival gives falling tiles some weight.
            movedPieces.forEach(p => {
                p.inner.classList.add('land');
                setTimeout(() => p.inner.classList.remove('land'), 220);
            });
        }
    }

    computeStars() {
        const ratio = this.score / this.targetScore;
        if (ratio >= 1.35) return 3;
        if (ratio >= 1.15) return 2;
        return 1;
    }

    checkWinLoss() {
        // Reaching the goal does NOT end the level by itself - the meter
        // visibly keeps going past it toward the 2-star/3-star marks, so
        // stopping the instant it's touched would make that bar a lie: the
        // player would never have the moves-remaining chance to actually
        // reach for the higher tiers it's showing them. The level only ends
        // when there's nothing left to spend (out of moves) or nothing left
        // to gain (already at the 3-star cap).
        const done = this.moves <= 0 || this.score >= this.starMax;
        if (!done) {
            this.isProcessing = false;
            return;
        }

        this.stopMeterSparks();
        if (this.score >= this.targetScore) {
            this.sfx.win();
            this.playLottieConfetti();
            const stars = this.computeStars();
            const coinsEarned = stars * 15;
            this.addCoins(coinsEarned);
            this.currentLevelIdx++;
            if (this.currentLevelIdx >= LEVELS.length) {
                this.showScreen("YOU WIN!", `FINAL SCORE: ${this.score} · +${coinsEarned} COINS`, "PLAY AGAIN", stars, 'play');
                this.currentLevelIdx = 0;
                // A full clear ends the run - start the next one with a clean slate.
                this.inventory = { hammer: 0, shuffle: 0, extraMoves: 0, colorBomb: 0, megaHammer: 0, doubleBomb: 0 };
                this.coins = 0;
                this.updatePowerUpTray();
                this.updateCoinDisplay();
            } else {
                this.showScreen("LEVEL CLEAR!", `SCORE: ${this.score} / ${this.targetScore} · +${coinsEarned} COINS`, "CONTINUE", stars, 'reward');
            }
        } else {
            this.sfx.lose();
            this.showScreen("OUT OF MOVES", `SCORE: ${this.score} / ${this.targetScore}`, "TRY AGAIN", null, 'play');
        }
    }
}

window.addEventListener('load', () => game = new Match3Game());
</script>
