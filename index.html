<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Brutal Match</title>

    <!-- Installable / full-screen mobile web app -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brutal Match">
    <meta name="theme-color" content="#10242E">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,100..700,0..1,-50..200" />
    <style>
        :root {
            /* --- Palette --- */
            --aqua-100: #E2F6F3; --aqua-300: #A8DDD7; --aqua-500: #71C4BB; --aqua-700: #429C94; --aqua-900: #246C67;
            --ocean-100: #DDF4F8; --ocean-300: #9CD7E3; --ocean-500: #55B7CB; --ocean-700: #2E8DA4; --ocean-900: #1C6477;
            --blue-100: #E3ECFF; --blue-300: #AAC2F7; --blue-500: #7197E8; --blue-700: #4F70BE; --blue-900: #344B86;
            --violet-100: #EEE7FF; --violet-300: #C6B1F4; --violet-500: #9B7BE0; --violet-700: #7455B5; --violet-900: #513A81;
            --grape-100: #F5E4F6; --grape-300: #DFA7E2; --grape-500: #C56BCB; --grape-700: #98479E; --grape-900: #6A3270;
            --berry-100: #FBE3EE; --berry-300: #F0A2C5; --berry-500: #DE6399; --berry-700: #B44474; --berry-900: #7E3052;
            --coral-100: #FFE5E1; --coral-300: #F8AAA0; --coral-500: #EC7165; --coral-700: #C24E45; --coral-900: #873731;
            --orange-100: #FFEBD8; --orange-300: #F8BC7D; --orange-500: #EA8D3F; --orange-700: #BC6629; --orange-900: #80461E;
            --gold-100: #FFF3CF; --gold-300: #F3D47A; --gold-500: #E0B74A; --gold-700: #AE872D; --gold-900: #755C20;
            --lime-100: #F0F4D7; --lime-300: #CADB84; --lime-500: #A5C45C; --lime-700: #77943D; --lime-900: #50662C;
            --green-100: #E1F2E5; --green-300: #A4D4AF; --green-500: #68B77B; --green-700: #438D57; --green-900: #2E633E;
            --navy-100: #E5E9EC; --navy-300: #A8B2BA; --navy-500: #687985; --navy-700: #455762; --navy-900: #29343E;

            /* --- Neutrals + theme tokens --- */
            --ink: var(--navy-900);
            --paper: #F2F6F8;
            --paper-2: #DCE4E9;
            --accent: var(--ocean-500);

            /* Candy colors */
            --c1: var(--aqua-700);
            --c2: var(--blue-500);
            --c3: var(--violet-500);
            --c4: var(--berry-500);
            --c5: var(--coral-500);
            --c6: var(--orange-500);
            --c7: var(--gold-500);

            --cell: 56px;
            --board-w: 340px;

            --border-thick: 3px;
            --radius-lg: 22px;
            --radius-md: 14px;
            --radius-sm: 12px;
            --shadow-hard: 5px 5px 0px var(--ink), 8px 12px 22px rgba(4, 10, 14, 0.4);
            --shadow-small: 3px 3px 0px var(--ink), 4px 6px 12px rgba(4, 10, 14, 0.32);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-drag: none;
            margin: 0;
            padding: 0;
            font-family: 'Oswald', sans-serif;
        }

        html {
            height: 100%;
            background-color: #10242E;
            transition: background-color 1.6s ease;
            overscroll-behavior: none;
        }

        /* Fixed body kills iOS toolbar resize gaps + rubber-band white flashes */
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: transparent;
            color: var(--ink);
        }

        /* ---------- Living gradient background ---------- */
        #bg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            isolation: isolate;
            z-index: 0;
            background-color: #10242E;
            transition: background-color 1.6s ease;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            color: transparent;
            background: radial-gradient(circle at 50% 50%, currentColor 0%, rgba(0,0,0,0) 68%);
            mix-blend-mode: screen;
            transition: color 1.6s ease;
            will-change: transform;
            animation-name: drift;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes drift {
            from { transform: translate(-50%, -50%) translate3d(0, 0, 0) scale(1); }
            to   { transform: translate(-50%, -50%) translate3d(var(--dx), var(--dy), 0) scale(var(--s2)); }
        }

        /* Soft vignette so HUD/board always sit on a calm ground */
        #bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 40%, rgba(4, 10, 14, 0.45) 100%);
            pointer-events: none;
        }

        /* ---------- App shell ---------- */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding-top: max(env(safe-area-inset-top), 8px);
            padding-bottom: max(env(safe-area-inset-bottom), 10px);
            padding-left: max(env(safe-area-inset-left), 10px);
            padding-right: max(env(safe-area-inset-right), 10px);
        }

        .topbar {
            flex: 0 0 auto;
            width: var(--board-w);
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 38px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .icon-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0 var(--ink); }
        .icon-btn .material-symbols-outlined { font-size: 1.2rem; font-variation-settings: 'FILL' 1, 'wght' 600; color: var(--ink); }

        .hud {
            flex: 0 0 auto;
            width: var(--board-w);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 6px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-box {
            background: var(--paper);
            padding: 5px 13px;
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
            text-align: center;
            min-width: 74px;
        }

        .hud-label {
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--navy-500);
        }

        .hud-val {
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .hud-val.bump { animation: bumpVal 0.3s ease; }

        .level-title {
            font-size: 1.55rem;
            font-weight: 900;
            color: var(--paper);
            text-shadow:
                -2px -2px 0 var(--ink), 2px -2px 0 var(--ink),
                -2px  2px 0 var(--ink), 2px  2px 0 var(--ink);
            letter-spacing: -0.5px;
            transform: rotate(-2deg);
        }

        /* ---------- Goal meter ---------- */
        .meter-wrap {
            position: relative;
            width: 100%;
        }

        .meter-container {
            width: 100%;
            height: 22px;
            background: var(--paper);
            border: var(--border-thick) solid var(--ink);
            border-radius: 999px;
            box-shadow: var(--shadow-small);
            position: relative;
            overflow: hidden;
        }

        .meter-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 1.6s ease;
        }

        /* Soft travelling glow that rides the leading edge of the fill */
        .meter-cap {
            position: absolute;
            top: -4px; bottom: -4px;
            left: 0;
            width: 18px;
            transform: translateX(-50%);
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%);
            opacity: 0;
            pointer-events: none;
            transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
        }
        .meter-cap.on { opacity: 0.85; animation: capBreathe 1.9s ease-in-out infinite; }

        /* Unclipped layer so sparks can drift above the bar */
        .meter-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
        }

        .spark {
            position: absolute;
            border-radius: 50%;
            background: var(--paper);
            opacity: 0;
            pointer-events: none;
            animation: sparkFloat 0.85s ease-out forwards;
        }

        .meter-container.full .meter-fill { animation: pulse-meter 0.6s ease-in-out infinite alternate; }

        /* ---------- Board ---------- */
        #board-wrap {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
        }

        #board-container {
            position: relative;
        }

        #pieces-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .piece {
            position: absolute;
            width: calc(100% / 6);
            height: calc(100% / 8);
            padding: 3px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
        }

        .piece-inner {
            width: 100%;
            height: 100%;
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: 0px 4px 0px var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .piece.selected .piece-inner {
            transform: scale(1.08) translate(0px, 4px);
            box-shadow: 0px 0px 0px var(--ink);
            background: var(--paper-2);
        }

        .piece-inner.invalid { border-color: var(--coral-700); }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-size: calc(var(--cell) * 0.46);
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            position: relative;
            z-index: 2;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            pointer-events: none;
        }

        /* ---------- Special piece markers ----------
           Every special tints its card with its own colour family and adds a
           geometric marker that states what it will do:
             stripe  -> arrows pointing along the line it clears
             wrap    -> ring + corner pips (blast radius)
             bomb    -> full rainbow card (clears a whole colour)            */
        .fx { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; overflow: hidden; }

        .sp-h, .sp-v, .sp-wrap { background: var(--tint); }

        .sp-h .fx::before, .sp-h .fx::after,
        .sp-v .fx::before, .sp-v .fx::after {
            content: '';
            position: absolute;
            background: var(--pc);
        }
        .sp-h .fx::before {
            left: 3px; top: 50%;
            width: calc(var(--cell) * 0.13); height: calc(var(--cell) * 0.2);
            transform: translateY(-50%);
            clip-path: polygon(100% 0, 100% 100%, 0 50%);
        }
        .sp-h .fx::after {
            right: 3px; top: 50%;
            width: calc(var(--cell) * 0.13); height: calc(var(--cell) * 0.2);
            transform: translateY(-50%);
            clip-path: polygon(0 0, 0 100%, 100% 50%);
        }
        .sp-v .fx::before {
            top: 3px; left: 50%;
            height: calc(var(--cell) * 0.13); width: calc(var(--cell) * 0.2);
            transform: translateX(-50%);
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
        }
        .sp-v .fx::after {
            bottom: 3px; left: 50%;
            height: calc(var(--cell) * 0.13); width: calc(var(--cell) * 0.2);
            transform: translateX(-50%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .sp-wrap .fx::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 2.5px solid var(--pc);
            border-radius: 50%;
            opacity: 0.55;
            animation: wrapPulse 1.8s ease-in-out infinite;
        }
        .sp-wrap .fx::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 13% 13%, var(--pc) 0 2.4px, transparent 2.5px),
                radial-gradient(circle at 87% 13%, var(--pc) 0 2.4px, transparent 2.5px),
                radial-gradient(circle at 13% 87%, var(--pc) 0 2.4px, transparent 2.5px),
                radial-gradient(circle at 87% 87%, var(--pc) 0 2.4px, transparent 2.5px);
        }

        .sp-bomb .fx::before {
            content: '';
            position: absolute;
            inset: 0;
            background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c7), var(--c1));
            animation: spin 7s linear infinite;
        }
        .sp-bomb .material-symbols-outlined { color: var(--ink); }

        /* ---------- Feedback ---------- */
        .pop { animation: popOut 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake { animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        .wiggle { animation: wiggleTile 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        .particle {
            position: absolute;
            border: 2px solid var(--ink);
            pointer-events: none;
            z-index: 20;
            animation: particle-burst 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .shockwave {
            position: absolute;
            width: 40px; height: 40px;
            border: 4px solid var(--paper);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 30;
            animation: shockwaveExpand 0.5s ease-out forwards;
        }

        .combo-banner {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            opacity: 0;
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            color: var(--paper);
            -webkit-text-stroke: 2px var(--ink);
            text-shadow: 4px 4px 0 var(--ink);
            pointer-events: none;
            z-index: 60;
            white-space: nowrap;
        }
        .combo-banner.show { animation: comboPop 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

        .floating-text {
            position: absolute;
            color: var(--paper);
            font-weight: 900;
            font-size: 1.5rem;
            -webkit-text-stroke: 2px var(--ink);
            text-shadow: 3px 3px 0 var(--ink);
            pointer-events: none;
            z-index: 40;
            animation: float-up 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .flash {
            position: absolute; inset: 0;
            background: var(--paper); z-index: 100; pointer-events: none;
            border-radius: var(--radius-md);
            animation: flash-fade 0.2s ease-out forwards;
        }

        .confetti {
            position: fixed;
            width: 14px; height: 14px;
            border: 2px solid var(--ink);
            z-index: 150;
            pointer-events: none;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.4) rotate(15deg); }
            100% { transform: scale(0) rotate(-15deg); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes wrapPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.09); opacity: 0.85; }
        }
        @keyframes wiggleTile {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15%); }
            75% { transform: translateX(15%); }
        }
        @keyframes screenShake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20%, 60% { transform: translate3d(-5px, 3px, 0); }
            40%, 80% { transform: translate3d(5px, -3px, 0); }
        }
        @keyframes particle-burst {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(180deg); opacity: 1; }
        }
        @keyframes shockwaveExpand {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(-4deg); opacity: 0; }
            30% { transform: translate(-50%, -50%) scale(1.25) rotate(2deg); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -60%) scale(1.05) rotate(0deg); opacity: 0; }
        }
        @keyframes float-up {
            0% { transform: translate(-50%, -50%) scale(0.5) rotate(-5deg); opacity: 0; }
            20% { transform: translate(-50%, -100%) scale(1.2) rotate(5deg); opacity: 1; }
            100% { transform: translate(-50%, -300%) scale(1) rotate(0deg); opacity: 0; }
        }
        @keyframes flash-fade { 0% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes pulse-meter { 0% { filter: brightness(1); } 100% { filter: brightness(1.25); } }
        @keyframes capBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
        @keyframes sparkFloat {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            25% { opacity: 1; }
            100% { transform: translate(calc(-50% + var(--mx)), calc(-50% + var(--my))) scale(0); opacity: 0; }
        }
        @keyframes bumpVal { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(720deg); }
        }
        @keyframes starPop {
            0% { transform: scale(0) rotate(-30deg); opacity: 0; }
            60% { transform: scale(1.3) rotate(8deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* ---------- Overlay ---------- */
        .overlay {
            position: absolute; inset: 0;
            background: rgba(10, 18, 24, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

        .overlay-card {
            background: var(--paper);
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-hard);
            padding: 32px 30px;
            max-width: min(90vw, 360px);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .overlay.active .overlay-card { transform: scale(1); }

        .overlay h2 {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--paper);
            -webkit-text-stroke: 2px var(--ink);
            text-shadow: 4px 4px 0 var(--ink);
            transform: rotate(-2deg);
        }

        .overlay p {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--navy-700);
            line-height: 1.35;
        }

        .stars-row {
            display: flex;
            gap: 8px;
            height: 2.3rem;
        }
        .stars-row .star {
            font-size: 2.3rem;
            color: var(--paper-2);
            font-variation-settings: 'FILL' 1, 'wght' 600;
        }
        .stars-row .star.filled {
            color: var(--gold-500);
            text-shadow: 2px 2px 0 var(--ink);
            animation: starPop 0.5s both;
        }
        .stars-row .star.filled:nth-child(2) { animation-delay: 0.1s; }
        .stars-row .star.filled:nth-child(3) { animation-delay: 0.2s; }

        .overlay button {
            margin-top: 4px;
            padding: 13px 38px;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.5px;
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-md);
            background: var(--accent);
            color: var(--ink);
            cursor: pointer;
            box-shadow: var(--shadow-hard);
            transition: transform 0.1s, box-shadow 0.1s, background-color 1.6s ease;
        }
        .overlay button:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 var(--ink);
        }
    </style>
</head>
<body>

    <div id="bg"></div>

    <div id="app">
        <div class="topbar">
            <button class="icon-btn" id="mute-btn" aria-label="Toggle Sound">
                <span class="material-symbols-outlined" id="mute-icon">volume_up</span>
            </button>
        </div>

        <div class="hud">
            <div class="hud-top">
                <div class="hud-box">
                    <div class="hud-label">MOVES</div>
                    <div class="hud-val" id="moves-txt">0</div>
                </div>
                <div class="level-title" id="level-txt">LVL 1</div>
                <div class="hud-box">
                    <div class="hud-label">SCORE</div>
                    <div class="hud-val" id="score-txt">0</div>
                </div>
            </div>
            <div class="meter-wrap">
                <div class="meter-container" id="meter-container">
                    <div class="meter-fill" id="goal-meter"></div>
                    <div class="meter-cap" id="meter-cap"></div>
                </div>
                <div class="meter-fx" id="meter-fx"></div>
            </div>
        </div>

        <div id="board-wrap">
            <div id="board-container">
                <div id="pieces-layer">
                    <div class="combo-banner" id="combo-banner"></div>
                </div>
            </div>
        </div>

        <div class="overlay" id="screen-overlay">
            <div class="overlay-card">
                <h2 id="screen-title">LEVEL 1</h2>
                <p id="screen-desc">SCORE POINTS TO FILL THE METER!</p>
                <div class="stars-row" id="screen-stars"></div>
                <button id="screen-btn" onclick="game.startLevel()">PLAY</button>
            </div>
        </div>
    </div>

<script>
/* Targets are tuned against a bot playing random valid moves on this 6x8 board:
   that baseline is roughly 1.4k / 2.2k / 1.8k / 2.1k per level, so a target of
   ~0.8x baseline reads as a warm-up and ~1.4x demands deliberate play.
   Six colours is the ceiling here - seven leaves only ~7 tiles per colour on 48
   squares, which starves the board of matches. */
const LEVELS = [
    { id: 1, moves: 18, target: 1200, colors: 5, desc: "MATCH 3 OR MORE TO FILL THE METER!" },
    { id: 2, moves: 22, target: 2000, colors: 5, desc: "BIGGER TARGET. KEEP THE CASCADES GOING!" },
    { id: 3, moves: 26, target: 2400, colors: 6, desc: "MORE COLOURS. BUILD SPECIAL TILES!" },
    { id: 4, moves: 30, target: 3000, colors: 6, desc: "EXPERT MODE. COMBINE THE SPECIALS!" }
];

/* Each level dresses the background in a new colour story. */
const THEMES = [
    { base: '#10242E', accent: '#55B7CB', blobs: ['#2E8DA4', '#429C94', '#55B7CB', '#71C4BB', '#7197E8'] },
    { base: '#1B1730', accent: '#9B7BE0', blobs: ['#7455B5', '#9B7BE0', '#C56BCB', '#7197E8', '#DFA7E2'] },
    { base: '#2B1A22', accent: '#DE6399', blobs: ['#B44474', '#DE6399', '#EC7165', '#EA8D3F', '#F0A2C5'] },
    { base: '#152618', accent: '#68B77B', blobs: ['#438D57', '#68B77B', '#A5C45C', '#E0B74A', '#71C4BB'] }
];

const SPECIALS = { NONE: 0, H_STRIPE: 1, V_STRIPE: 2, WRAP: 3, BOMB: 4 };
const ACTION_WORDS = ["BAM!", "RAD!", "BOOM!", "SICK!", "WILD!", "POP!", "SWEET!", "TASTY!"];
const ICONS = {
    1: 'star',
    2: 'favorite',
    3: 'diamond',
    4: 'spa',
    5: 'cloud',
    6: 'sunny',
    7: 'bolt'
};
const COLORS = {
    1: '#429C94', 2: '#7197E8', 3: '#9B7BE0', 4: '#DE6399',
    5: '#EC7165', 6: '#EA8D3F', 7: '#E0B74A'
};
/* -100 shades of the same families, used to tint special tiles */
const TINTS = {
    1: '#E2F6F3', 2: '#E3ECFF', 3: '#EEE7FF', 4: '#FBE3EE',
    5: '#FFE5E1', 6: '#FFEBD8', 7: '#FFF3CF'
};

const COLS = 6;
const ROWS = 8;
const MAX_CELL = 88;
const ANIM_DUR = 250;
const wait = (ms) => new Promise(res => setTimeout(res, ms));

class SFX {
    constructor() { this.ctx = null; this.muted = false; }
    ensure() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
    }
    tone(freq, dur = 0.12, type = 'sine', vol = 0.18, delay = 0) {
        if (this.muted) return;
        try {
            const ctx = this.ensure();
            const t0 = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(t0); osc.stop(t0 + dur + 0.03);
        } catch (e) { /* audio unavailable */ }
    }
    swap() { this.tone(320, 0.08, 'sine', 0.1); }
    invalid() { this.tone(150, 0.16, 'sawtooth', 0.1); }
    pop(streak = 1) { this.tone(420 + Math.min(streak, 6) * 55, 0.14, 'triangle', 0.16); }
    special() { this.tone(220, 0.3, 'sine', 0.14); this.tone(560, 0.28, 'sine', 0.1, 0.05); }
    shuffle() { this.tone(260, 0.2, 'square', 0.09); this.tone(330, 0.2, 'square', 0.07, 0.1); }
    win() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.18, i * 0.12)); }
    lose() { [400, 340, 280].forEach((f, i) => this.tone(f, 0.3, 'sawtooth', 0.13, i * 0.15)); }
}

class Match3Game {
    constructor() {
        this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
        this.layer = document.getElementById('pieces-layer');
        this.boardEl = document.getElementById('board-container');
        this.boardWrap = document.getElementById('board-wrap');
        this.score = 0;
        this.moves = 0;
        this.currentLevelIdx = 0;
        this.isProcessing = false;
        this.lastProgress = 0;
        this.sfx = new SFX();

        this.dragStart = null;
        this.selectedPiece = null;

        this.createBlobs();
        this.applyTheme(0);
        this.layoutBoard();
        requestAnimationFrame(() => this.layoutBoard());
        this.bindEvents();
        this.showScreen(`LEVEL ${LEVELS[0].id}`, LEVELS[0].desc, "PLAY");
    }

    /* ---------- Background ---------- */

    createBlobs() {
        const bg = document.getElementById('bg');
        this.blobs = [];
        for (let i = 0; i < 5; i++) {
            const b = document.createElement('div');
            b.className = 'blob';
            const size = 40 + Math.random() * 45;
            b.style.width = `${size}vmax`;
            b.style.height = `${size}vmax`;
            b.style.left = `${10 + Math.random() * 80}%`;
            b.style.top = `${10 + Math.random() * 80}%`;
            b.style.opacity = (0.34 + Math.random() * 0.26).toFixed(2);
            b.style.setProperty('--dx', `${(Math.random() * 2 - 1) * 18}vw`);
            b.style.setProperty('--dy', `${(Math.random() * 2 - 1) * 14}vh`);
            b.style.setProperty('--s2', (0.82 + Math.random() * 0.45).toFixed(2));
            b.style.animationDuration = `${34 + Math.random() * 30}s`;
            b.style.animationDelay = `-${Math.random() * 30}s`;
            bg.appendChild(b);
            this.blobs.push(b);
        }
    }

    applyTheme(levelIdx) {
        const t = THEMES[levelIdx % THEMES.length];
        this.theme = t;
        document.documentElement.style.backgroundColor = t.base;
        document.getElementById('bg').style.backgroundColor = t.base;
        document.documentElement.style.setProperty('--accent', t.accent);
        // Set the transitioned properties directly so they animate reliably.
        document.getElementById('goal-meter').style.backgroundColor = t.accent;
        document.getElementById('screen-btn').style.backgroundColor = t.accent;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t.base);
        this.blobs.forEach((b, i) => { b.style.color = t.blobs[i % t.blobs.length]; });
    }

    /* ---------- Layout ---------- */

    layoutBoard() {
        const rect = this.boardWrap.getBoundingClientRect();
        const cs = getComputedStyle(this.boardWrap);
        const availW = rect.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const availH = rect.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
        const cell = Math.max(24, Math.min(MAX_CELL, Math.floor(Math.min(availW / COLS, availH / ROWS))));

        this.boardEl.style.width = `${cell * COLS}px`;
        this.boardEl.style.height = `${cell * ROWS}px`;
        document.documentElement.style.setProperty('--cell', `${cell}px`);
        document.documentElement.style.setProperty('--board-w', `${cell * COLS}px`);
    }

    bindEvents() {
        this.layer.addEventListener('pointerdown', (e) => this.handlePointerDown(e));
        window.addEventListener('pointerup', (e) => this.handlePointerUp(e));
        window.addEventListener('resize', () => this.layoutBoard());
        window.addEventListener('orientationchange', () => setTimeout(() => this.layoutBoard(), 120));
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('dblclick', e => e.preventDefault());
        document.getElementById('mute-btn').addEventListener('click', () => this.toggleMute());
    }

    toggleMute() {
        this.sfx.muted = !this.sfx.muted;
        this.sfx.ensure();
        document.getElementById('mute-icon').innerText = this.sfx.muted ? 'volume_off' : 'volume_up';
    }

    showScreen(title, desc, btnText, stars = null) {
        document.getElementById('screen-title').innerText = title;
        document.getElementById('screen-desc').innerText = desc;
        document.getElementById('screen-btn').innerText = btnText;
        const starsRow = document.getElementById('screen-stars');
        starsRow.innerHTML = '';
        if (stars !== null) {
            for (let i = 0; i < 3; i++) {
                const s = document.createElement('span');
                s.className = 'material-symbols-outlined star' + (i < stars ? ' filled' : '');
                s.innerText = 'star';
                starsRow.appendChild(s);
            }
        }
        document.getElementById('screen-overlay').classList.add('active');
    }

    hideScreen() {
        document.getElementById('screen-overlay').classList.remove('active');
    }

    async startLevel() {
        this.isProcessing = true;
        this.hideScreen();
        const config = LEVELS[this.currentLevelIdx] || LEVELS[LEVELS.length - 1];
        this.moves = config.moves;
        this.score = 0;
        this.lastProgress = 0;
        this.targetScore = config.target;
        this.numColors = config.colors;

        this.applyTheme(this.currentLevelIdx);
        document.getElementById('meter-container').classList.remove('full');
        document.getElementById('meter-cap').classList.remove('on');
        this.updateHUD();
        this.layoutBoard();
        this.layer.innerHTML = '<div class="combo-banner" id="combo-banner"></div>';
        this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));

        this.fillBoardInitial();
        await this.ensureSolvable();
        this.isProcessing = false;
    }

    updateHUD() {
        document.getElementById('moves-txt').innerText = this.moves;
        document.getElementById('level-txt').innerText = `LVL ${this.currentLevelIdx + 1}`;
        document.getElementById('score-txt').innerText = this.score;

        const progress = Math.min(100, (this.score / this.targetScore) * 100);
        document.getElementById('goal-meter').style.width = `${progress}%`;
        document.getElementById('meter-container').classList.toggle('full', progress >= 100);

        const cap = document.getElementById('meter-cap');
        cap.style.left = `${progress}%`;
        cap.classList.toggle('on', progress > 0.5 && progress < 100);

        if (progress > this.lastProgress) this.emitMeterSparks(progress);
        this.lastProgress = progress;
    }

    /* A few sparks skip off the leading edge whenever the meter advances. */
    emitMeterSparks(progress) {
        const fx = document.getElementById('meter-fx');
        if (!fx) return;
        const w = fx.clientWidth;
        if (!w) return;
        const x = Math.min(w, (progress / 100) * w);
        const count = 3;
        for (let i = 0; i < count; i++) {
            const s = document.createElement('div');
            s.className = 'spark';
            const size = 3 + Math.random() * 3;
            s.style.width = `${size}px`;
            s.style.height = `${size}px`;
            s.style.left = `${x}px`;
            s.style.top = '50%';
            s.style.setProperty('--mx', `${(Math.random() * 2 - 1) * 16}px`);
            s.style.setProperty('--my', `${-10 - Math.random() * 16}px`);
            s.style.animationDelay = `${Math.random() * 0.12}s`;
            fx.appendChild(s);
            setTimeout(() => s.remove(), 1000);
        }
    }

    bumpHUD(el) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
    }

    addScore(pts) {
        this.score += pts;
        this.updateHUD();
        this.bumpHUD(document.getElementById('score-txt'));
    }

    fillBoardInitial() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let color;
                do { color = Math.floor(Math.random() * this.numColors) + 1; }
                while (
                    (c >= 2 && this.board[r][c-1]?.color === color && this.board[r][c-2]?.color === color) ||
                    (r >= 2 && this.board[r-1][c]?.color === color && this.board[r-2][c]?.color === color)
                );
                this.spawnPiece(r, c, color, SPECIALS.NONE);
            }
        }
    }

    spawnPiece(r, c, color, special, dropFromOffset = 0) {
        const el = document.createElement('div');
        el.className = 'piece';

        const inner = document.createElement('div');
        inner.className = 'piece-inner';
        if (special === SPECIALS.H_STRIPE) inner.classList.add('sp-h');
        else if (special === SPECIALS.V_STRIPE) inner.classList.add('sp-v');
        else if (special === SPECIALS.WRAP) inner.classList.add('sp-wrap');
        else if (special === SPECIALS.BOMB) inner.classList.add('sp-bomb');

        if (special !== SPECIALS.BOMB) {
            inner.style.setProperty('--pc', COLORS[color]);
            inner.style.setProperty('--tint', TINTS[color]);
        }

        const fx = document.createElement('div');
        fx.className = 'fx';
        inner.appendChild(fx);

        const icon = document.createElement('span');
        icon.className = 'material-symbols-outlined';
        icon.innerText = special === SPECIALS.BOMB ? 'auto_awesome' : ICONS[color];
        if (special !== SPECIALS.BOMB) icon.style.color = COLORS[color];
        inner.appendChild(icon);

        el.appendChild(inner);
        this.layer.appendChild(el);

        const piece = { r, c, color, special, el, inner };
        this.board[r][c] = piece;

        el.style.transform = `translate(${c * 100}%, ${(r - dropFromOffset) * 100}%)`;
        requestAnimationFrame(() => el.style.transform = `translate(${c * 100}%, ${r * 100}%)`);
        return piece;
    }

    createParticles(piece) {
        const cellW = this.boardEl.clientWidth / COLS;
        const cellH = this.boardEl.clientHeight / ROWS;
        const x = (piece.c * cellW) + (cellW / 2);
        const y = (piece.r * cellH) + (cellH / 2);

        const big = piece.special !== SPECIALS.NONE;
        const count = big ? 10 : 6;

        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            // Colour bombs scatter the whole rainbow; everything else its own colour.
            p.style.background = piece.special === SPECIALS.BOMB
                ? COLORS[Math.floor(Math.random() * 7) + 1]
                : COLORS[piece.color];
            p.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px';

            const base = big ? 12 : 8;
            p.style.width = `${Math.random() * base + base}px`;
            p.style.height = p.style.width;

            p.style.left = `${x}px`;
            p.style.top = `${y}px`;

            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * (big ? 90 : 60) + 30;
            p.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
            p.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);

            this.layer.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }
    }

    spawnShockwave(r, c) {
        const cellW = this.boardEl.clientWidth / COLS;
        const cellH = this.boardEl.clientHeight / ROWS;
        const el = document.createElement('div');
        el.className = 'shockwave';
        el.style.left = `${(c * cellW) + (cellW / 2)}px`;
        el.style.top = `${(r * cellH) + (cellH / 2)}px`;
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 500);
    }

    createConfetti() {
        const colors = Object.values(COLORS);
        for (let i = 0; i < 50; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = `${Math.random() * 100}vw`;
            conf.style.background = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
            conf.style.animationDuration = `${Math.random() * 2 + 2}s`;
            conf.style.animationDelay = `${Math.random() * 0.5}s`;
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 5000);
        }
    }

    showFloatingText(r, c, text, scale = 1) {
        const el = document.createElement('div');
        el.className = 'floating-text';
        el.innerText = text;
        el.style.left = `${c * (100 / COLS) + (100 / COLS) / 2}%`;
        el.style.top = `${r * (100 / ROWS) + (100 / ROWS) / 2}%`;
        if (scale !== 1) el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        this.layer.appendChild(el);
        setTimeout(() => el.remove(), 1000);
    }

    comboBanner(text) {
        const el = document.getElementById('combo-banner');
        if (!el) return;
        el.innerText = text;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
    }

    screenFlash() {
        const flash = document.createElement('div');
        flash.className = 'flash';
        this.boardEl.appendChild(flash);
        setTimeout(() => flash.remove(), 200);
    }

    handlePointerDown(e) {
        if (this.isProcessing) return;
        const target = e.target.closest('.piece');
        if (!target) return;

        const piece = this.getPieceFromElement(target);
        if (!piece) return;

        this.sfx.ensure();

        if (this.selectedPiece) {
            if (this.selectedPiece === piece) { this.clearSelection(); return; }
            const dr = Math.abs(this.selectedPiece.r - piece.r);
            const dc = Math.abs(this.selectedPiece.c - piece.c);
            if (dr + dc === 1) { this.attemptSwap(this.selectedPiece, piece); this.clearSelection(); return; }
            this.clearSelection();
        }

        this.selectedPiece = piece;
        piece.el.classList.add('selected');
        this.dragStart = { x: e.clientX, y: e.clientY, piece: piece };
    }

    handlePointerUp(e) {
        if (!this.dragStart || this.isProcessing) return;
        const dx = e.clientX - this.dragStart.x;
        const dy = e.clientY - this.dragStart.y;
        const threshold = Math.max(18, this.boardEl.clientWidth / COLS * 0.4);

        if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
            let tr = this.dragStart.piece.r, tc = this.dragStart.piece.c;
            if (Math.abs(dx) > Math.abs(dy)) tc += (dx > 0 ? 1 : -1); else tr += (dy > 0 ? 1 : -1);
            if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) this.attemptSwap(this.dragStart.piece, this.board[tr][tc]);
            this.clearSelection();
        }
        this.dragStart = null;
    }

    clearSelection() {
        if (this.selectedPiece) { this.selectedPiece.el.classList.remove('selected'); this.selectedPiece = null; }
    }

    getPieceFromElement(el) {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.el === el) return this.board[r][c];
        return null;
    }

    async attemptSwap(p1, p2) {
        this.isProcessing = true;
        this.sfx.swap();

        this.swapData(p1, p2);
        this.updatePositions();
        await wait(ANIM_DUR);

        const comboResult = this.checkSpecialCombo(p1, p2);
        let matchGroups = comboResult.isCombo ? [] : this.findMatches();

        // Invalid move: wiggle and swap back (does not cost a move)
        if (!comboResult.isCombo && matchGroups.length === 0) {
            this.sfx.invalid();
            p1.inner.classList.add('wiggle', 'invalid');
            p2.inner.classList.add('wiggle', 'invalid');
            await wait(300);
            p1.inner.classList.remove('wiggle', 'invalid');
            p2.inner.classList.remove('wiggle', 'invalid');

            this.swapData(p1, p2);
            this.updatePositions();
            await wait(ANIM_DUR);

            this.isProcessing = false;
            return;
        }

        this.moves--;
        this.bumpHUD(document.getElementById('moves-txt'));
        this.updateHUD();

        this.lastSwap = { p1, p2 };
        await this.resolveBoard(matchGroups, comboResult);
    }

    swapData(p1, p2) {
        const tR = p1.r, tC = p1.c;
        p1.r = p2.r; p1.c = p2.c; p2.r = tR; p2.c = tC;
        this.board[p1.r][p1.c] = p1; this.board[p2.r][p2.c] = p2;
    }

    updatePositions() {
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) this.board[r][c].el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
    }

    findMatches() {
        let horiz = [], vert = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                let col = this.board[r][c]?.color;
                if (!col) continue;
                let len = 1; while (c + len < COLS && this.board[r][c + len]?.color === col) len++;
                if (len >= 3) {
                    let g = []; for (let i = 0; i < len; i++) g.push(this.board[r][c + i]);
                    horiz.push(g); c += len - 1;
                }
            }
        }
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                let col = this.board[r][c]?.color;
                if (!col) continue;
                let len = 1; while (r + len < ROWS && this.board[r + len][c]?.color === col) len++;
                if (len >= 3) {
                    let g = []; for (let i = 0; i < len; i++) g.push(this.board[r + i][c]);
                    vert.push(g); r += len - 1;
                }
            }
        }
        let all = [...horiz, ...vert], merged = [];
        while (all.length > 0) {
            let cur = new Set(all.shift()), found = true;
            while (found) {
                found = false;
                for (let i = 0; i < all.length; i++) {
                    if (all[i].some(p => cur.has(p))) { all[i].forEach(p => cur.add(p)); all.splice(i, 1); found = true; break; }
                }
            }
            merged.push(Array.from(cur));
        }
        return merged;
    }

    // Simulates swapping the contents of two board cells and checks whether it produces a match.
    // Does not touch piece.r/c, since findMatches() only reads through this.board[r][c].
    simulateSwapHasMatch(r1, c1, r2, c2) {
        const b = this.board;
        const a = b[r1][c1], d = b[r2][c2];
        b[r1][c1] = d; b[r2][c2] = a;
        const hasMatch = this.findMatches().length > 0;
        b[r1][c1] = a; b[r2][c2] = d;
        return hasMatch;
    }

    hasPossibleMove() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (!p) continue;
                if (c < COLS - 1) {
                    const q = this.board[r][c + 1];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r, c + 1))) return true;
                }
                if (r < ROWS - 1) {
                    const q = this.board[r + 1][c];
                    if (q && (this.checkSpecialCombo(p, q).isCombo || this.simulateSwapHasMatch(r, c, r + 1, c))) return true;
                }
            }
        }
        return false;
    }

    async ensureSolvable() {
        if (!this.hasPossibleMove()) await this.reshuffleBoard();
    }

    async reshuffleBoard() {
        this.comboBanner("SHUFFLING!");
        this.sfx.shuffle();

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = this.board[r][c];
                if (p) {
                    p.el.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    p.el.style.opacity = '0';
                    p.el.style.transform += ' scale(0.4) rotate(20deg)';
                }
            }
        }
        await wait(320);

        let attempts = 0;
        do {
            this.layer.innerHTML = '<div class="combo-banner" id="combo-banner"></div>';
            this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
            this.fillBoardInitial();
            attempts++;
        } while (!this.hasPossibleMove() && attempts < 20);

        await wait(100);
    }

    checkSpecialCombo(p1, p2) {
        const s1 = p1.special, s2 = p2.special;
        if (s1 === SPECIALS.NONE && s2 === SPECIALS.NONE) return { isCombo: false };

        // Exactly one piece is special: only a colour bomb auto-triggers on swap.
        if (s1 === SPECIALS.NONE || s2 === SPECIALS.NONE) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : (s2 === SPECIALS.BOMB ? p2 : null);
            if (bomb) {
                const normal = bomb === p1 ? p2 : p1;
                return { isCombo: true, type: 'BOMB_COLOR', color: normal.color, origin: bomb };
            }
            return { isCombo: false };
        }

        // Both pieces are special.
        if (s1 === SPECIALS.BOMB && s2 === SPECIALS.BOMB) return { isCombo: true, type: 'BOMB_BOMB' };
        if (s1 === SPECIALS.BOMB || s2 === SPECIALS.BOMB) {
            const bomb = s1 === SPECIALS.BOMB ? p1 : p2;
            const other = bomb === p1 ? p2 : p1;
            return { isCombo: true, type: 'BOMB_SPECIAL', origin: bomb, other };
        }
        const isStripe = s => s === SPECIALS.H_STRIPE || s === SPECIALS.V_STRIPE;
        if (isStripe(s1) && isStripe(s2)) return { isCombo: true, type: 'STRIPE_STRIPE', origin: p2 };
        if (s1 === SPECIALS.WRAP && s2 === SPECIALS.WRAP) return { isCombo: true, type: 'WRAP_WRAP', origin: p2 };

        const wrapPiece = s1 === SPECIALS.WRAP ? p1 : p2;
        return { isCombo: true, type: 'STRIPE_WRAP', origin: wrapPiece };
    }

    async resolveBoard(initialGroups, initialCombo) {
        let groups = initialGroups, combo = initialCombo, comboCount = 0;

        while (groups.length > 0 || combo?.isCombo) {
            let toDestroy = new Set(), spawnQ = [];
            comboCount++;

            if (combo?.isCombo) {
                this.sfx.special();
                if (combo.type === 'BOMB_BOMB') {
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(ROWS / 2, COLS / 2);
                } else if (combo.type === 'BOMB_COLOR') {
                    toDestroy.add(combo.origin);
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === combo.color) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'BOMB_SPECIAL') {
                    toDestroy.add(combo.origin); toDestroy.add(combo.other);
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === combo.other.color) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'WRAP_WRAP') {
                    toDestroy.add(combo.origin);
                    for (let r = Math.max(0, combo.origin.r - 2); r <= Math.min(ROWS - 1, combo.origin.r + 2); r++)
                        for (let c = Math.max(0, combo.origin.c - 2); c <= Math.min(COLS - 1, combo.origin.c + 2); c++)
                            if (this.board[r][c]) toDestroy.add(this.board[r][c]);
                    this.screenFlash();
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'STRIPE_WRAP') {
                    toDestroy.add(combo.origin);
                    for (let dr = -1; dr <= 1; dr++) {
                        const rr = combo.origin.r + dr;
                        if (rr < 0 || rr >= ROWS) continue;
                        for (let c = 0; c < COLS; c++) if (this.board[rr][c]) toDestroy.add(this.board[rr][c]);
                    }
                    for (let dc = -1; dc <= 1; dc++) {
                        const cc = combo.origin.c + dc;
                        if (cc < 0 || cc >= COLS) continue;
                        for (let r = 0; r < ROWS; r++) if (this.board[r][cc]) toDestroy.add(this.board[r][cc]);
                    }
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                } else if (combo.type === 'STRIPE_STRIPE') {
                    toDestroy.add(combo.origin);
                    for (let c = 0; c < COLS; c++) if (this.board[combo.origin.r][c]) toDestroy.add(this.board[combo.origin.r][c]);
                    for (let r = 0; r < ROWS; r++) if (this.board[r][combo.origin.c]) toDestroy.add(this.board[r][combo.origin.c]);
                    this.spawnShockwave(combo.origin.r, combo.origin.c);
                }
                combo = null;
            }

            groups.forEach(g => {
                g.forEach(p => toDestroy.add(p));
                const points = g.length * 10 * comboCount;
                this.addScore(points);

                const mid = Math.floor(g.length / 2);
                this.showFloatingText(g[mid].r, g[mid].c, `+${points}`);

                let xs = g.map(p => p.c), ys = g.map(p => p.r);
                let w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;

                let sP = g[0];
                if (this.lastSwap && (g.includes(this.lastSwap.p1) || g.includes(this.lastSwap.p2))) {
                    sP = g.includes(this.lastSwap.p1) ? this.lastSwap.p1 : this.lastSwap.p2;
                }

                if (g.length >= 5 && (w >= 5 || h >= 5)) spawnQ.push({ r: sP.r, c: sP.c, col: 0, sp: SPECIALS.BOMB });
                else if (w >= 3 && h >= 3) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.WRAP });
                else if (w === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.V_STRIPE });
                else if (h === 4) spawnQ.push({ r: sP.r, c: sP.c, col: sP.color, sp: SPECIALS.H_STRIPE });
            });

            // Find recursive special hits
            let q = Array.from(toDestroy), done = new Set();
            while (q.length > 0) {
                let p = q.shift();
                if (done.has(p)) continue;
                done.add(p); toDestroy.add(p);

                if (p.special === SPECIALS.H_STRIPE) { for (let c = 0; c < COLS; c++) if (this.board[p.r][c] && !done.has(this.board[p.r][c])) q.push(this.board[p.r][c]); }
                else if (p.special === SPECIALS.V_STRIPE) { for (let r = 0; r < ROWS; r++) if (this.board[r][p.c] && !done.has(this.board[r][p.c])) q.push(this.board[r][p.c]); }
                else if (p.special === SPECIALS.WRAP) {
                    for (let r = Math.max(0, p.r - 1); r <= Math.min(ROWS - 1, p.r + 1); r++)
                        for (let c = Math.max(0, p.c - 1); c <= Math.min(COLS - 1, p.c + 1); c++)
                            if (this.board[r][c] && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                } else if (p.special === SPECIALS.BOMB) {
                    let tc = Math.floor(Math.random() * this.numColors) + 1;
                    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (this.board[r][c]?.color === tc && !done.has(this.board[r][c])) q.push(this.board[r][c]);
                }
            }

            if (toDestroy.size > 7) {
                this.boardEl.classList.add('shake');
                setTimeout(() => this.boardEl.classList.remove('shake'), 300);
            }

            if (toDestroy.size > 0) {
                this.sfx.pop(comboCount);
                if (comboCount > 1) {
                    let word = ACTION_WORDS[Math.floor(Math.random() * ACTION_WORDS.length)];
                    this.comboBanner(`${word} COMBO x${comboCount}!`);
                }

                toDestroy.forEach(p => {
                    this.createParticles(p);
                    p.el.classList.add('pop');
                    this.board[p.r][p.c] = null;
                    setTimeout(() => p.el.remove(), 250);
                });
                await wait(280);
            }

            spawnQ.forEach(s => this.spawnPiece(s.r, s.c, s.col, s.sp));
            await this.applyGravity();
            this.lastSwap = null;
            groups = this.findMatches();
        }

        if (this.moves > 0 && this.score < this.targetScore) await this.ensureSolvable();

        this.checkWinLoss();
    }

    async applyGravity() {
        let moved = false;
        for (let c = 0; c < COLS; c++) {
            let empty = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (this.board[r][c] === null) empty++;
                else if (empty > 0) {
                    let p = this.board[r][c];
                    this.board[r][c] = null; p.r = r + empty; this.board[p.r][c] = p; moved = true;
                }
            }
            for (let r = empty - 1; r >= 0; r--) {
                this.spawnPiece(r, c, Math.floor(Math.random() * this.numColors) + 1, SPECIALS.NONE, empty);
                moved = true;
            }
        }
        if (moved) {
            this.updatePositions();
            await wait(300);
        }
    }

    computeStars() {
        const ratio = this.score / this.targetScore;
        if (ratio >= 1.35) return 3;
        if (ratio >= 1.15) return 2;
        return 1;
    }

    checkWinLoss() {
        if (this.score >= this.targetScore) {
            this.sfx.win();
            this.createConfetti();
            const stars = this.computeStars();
            this.currentLevelIdx++;
            if (this.currentLevelIdx >= LEVELS.length) {
                this.showScreen("YOU WIN!", `FINAL SCORE: ${this.score}`, "PLAY AGAIN", stars);
                this.currentLevelIdx = 0;
            } else {
                this.showScreen("LEVEL CLEAR!", `SCORE: ${this.score} / ${this.targetScore}`, "NEXT LEVEL", stars);
            }
        } else if (this.moves <= 0) {
            this.sfx.lose();
            this.showScreen("OUT OF MOVES", `SCORE: ${this.score} / ${this.targetScore}`, "TRY AGAIN");
        } else {
            this.isProcessing = false;
        }
    }
}

window.addEventListener('load', () => game = new Match3Game());
</script>
