<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Brutal Match</title>

    <!-- Installable / full-screen mobile web app -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brutal Match">
    <meta name="theme-color" content="#10242E">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24..48,100..700,0..1,-50..200" />
    <style>
        /* Registering this as a real <angle> is what lets it be keyframed
           directly (animating an unregistered custom property is a no-op) -
           and because it's the gradient's angle that moves, not any
           transform on the element, there's nothing for Safari's
           overflow+border-radius+transform clipping bug to ever catch. */
        @property --spin-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        /* Registered as real <color>s so the background gradient can
           transition itself natively whenever JS retints it after a match -
           no manual interpolation loop needed. */
        @property --bg-light {
            syntax: '<color>';
            inherits: true;
            initial-value: #9CD7E3;
        }
        @property --bg-dark {
            syntax: '<color>';
            inherits: true;
            initial-value: #1C6477;
        }

        :root {
            /* --- Palette --- */
            --aqua-100: #E2F6F3; --aqua-300: #A8DDD7; --aqua-500: #71C4BB; --aqua-700: #429C94; --aqua-900: #246C67;
            --ocean-100: #DDF4F8; --ocean-300: #9CD7E3; --ocean-500: #55B7CB; --ocean-700: #2E8DA4; --ocean-900: #1C6477;
            --blue-100: #E3ECFF; --blue-300: #AAC2F7; --blue-500: #7197E8; --blue-700: #4F70BE; --blue-900: #344B86;
            --violet-100: #EEE7FF; --violet-300: #C6B1F4; --violet-500: #9B7BE0; --violet-700: #7455B5; --violet-900: #513A81;
            --grape-100: #F5E4F6; --grape-300: #DFA7E2; --grape-500: #C56BCB; --grape-700: #98479E; --grape-900: #6A3270;
            --berry-100: #FBE3EE; --berry-300: #F0A2C5; --berry-500: #DE6399; --berry-700: #B44474; --berry-900: #7E3052;
            --coral-100: #FFE5E1; --coral-300: #F8AAA0; --coral-500: #EC7165; --coral-700: #C24E45; --coral-900: #873731;
            --orange-100: #FFEBD8; --orange-300: #F8BC7D; --orange-500: #EA8D3F; --orange-700: #BC6629; --orange-900: #80461E;
            --gold-100: #FFF3CF; --gold-300: #F3D47A; --gold-500: #E0B74A; --gold-700: #AE872D; --gold-900: #755C20;
            --lime-100: #F0F4D7; --lime-300: #CADB84; --lime-500: #A5C45C; --lime-700: #77943D; --lime-900: #50662C;
            --green-100: #E1F2E5; --green-300: #A4D4AF; --green-500: #68B77B; --green-700: #438D57; --green-900: #2E633E;
            --navy-100: #E5E9EC; --navy-300: #A8B2BA; --navy-500: #687985; --navy-700: #455762; --navy-900: #29343E;

            /* --- Neutrals + theme tokens --- */
            --ink: var(--navy-900);
            --paper: #F2F6F8;
            --paper-2: #DCE4E9;
            --accent: var(--ocean-500);

            /* Candy colors */
            --c1: var(--aqua-700);
            --c2: var(--blue-500);
            --c3: var(--violet-500);
            --c4: var(--berry-500);
            --c5: var(--coral-500);
            --c6: var(--orange-500);
            --c7: var(--gold-500);

            --cell: 56px;
            --board-w: 340px;

            --border-thick: 3px;
            --radius-lg: 22px;
            --radius-md: 14px;
            --radius-sm: 12px;
            --shadow-hard: 5px 5px 0px var(--ink), 8px 12px 22px rgba(4, 10, 14, 0.4);
            --shadow-small: 3px 3px 0px var(--ink), 4px 6px 12px rgba(4, 10, 14, 0.32);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-drag: none;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        html {
            height: 100%;
            background-color: var(--bg-dark);
            overscroll-behavior: none;
        }

        /* Fixed body kills iOS toolbar resize gaps + rubber-band white flashes */
        body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: transparent;
            color: var(--ink);
        }

        /* ---------- Reactive background ----------
           A single subtle radial gradient, light at the centre fading to dark
           at the edges. --bg-light/--bg-dark are registered below so the
           browser can animate the colours themselves on change, rather than
           us cross-fading two flat layers - whenever a match resolves, the
           gradient gracefully retints to that match's own colour family. */
        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            /* Plain linear gradient rather than radial: a radial's "farthest
               corner" falloff plateaus to flat colour well before a tall
               portrait viewport's actual bottom edge, which read as a hard
               seam / a separate panel down there - a linear interpolates
               evenly across the full height with no such flat zone possible. */
            background: linear-gradient(180deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            transition: --bg-light 1.3s ease, --bg-dark 1.3s ease;
        }

        /* ---------- App shell ---------- */
        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding-top: max(env(safe-area-inset-top), 8px);
            padding-left: max(env(safe-area-inset-left), 10px);
            padding-right: max(env(safe-area-inset-right), 10px);
        }

        .topbar {
            flex: 0 0 auto;
            width: var(--board-w);
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 38px;
        }

        .topbar-right { display: flex; gap: 8px; }

        .coin-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 38px;
            padding: 0 12px;
            background: var(--gold-100);
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
        }
        .coin-chip .material-symbols-outlined { font-size: 1.05rem; color: var(--gold-700); font-variation-settings: 'FILL' 1, 'wght' 600; }
        .coin-chip span:last-child { font-weight: 900; font-size: 0.95rem; color: var(--ink); }
        .coin-chip.bump { animation: bumpVal 0.3s ease; }

        .icon-btn {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper);
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .icon-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0 var(--ink); }
        .icon-btn .material-symbols-outlined { font-size: 1.2rem; font-variation-settings: 'FILL' 1, 'wght' 600; color: var(--ink); }

        .hud {
            flex: 0 0 auto;
            width: var(--board-w);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 6px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-box {
            background: var(--paper);
            padding: 5px 13px;
            border: var(--border-thick) solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-small);
            text-align: center;
            min-width: 74px;
        }

        .hud-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--navy-500);
        }

        .hud-val {
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1.1;
        }

        .hud-val.bump { animation: bumpVal 0.3s ease; }

        .level-title {
            font-size: 1.55rem;
            font-weight: 900;
            color: var(--paper);
            text-shadow:
                -2px -2px 0 var(--ink), 2px -2px 0 var(--ink),
                -2px  2px 0 var(--ink), 2px  2px 0 var(--ink);
            letter-spacing: -0.5px;
            transform: rotate(-2deg);
        }

        /* ---------- Goal meter ---------- */
        .meter-wrap {
            position: relative;
            width: 100%;
        }

        .meter-container {
            width: 100%;
            height: 22px;
            background: var(--paper);
            border: var(--border-thick) solid var(--ink);
            border-radius: 999px;
            box-shadow: var(--shadow-small);
            position: relative;
            overflow: hidden;
        }

        .meter-fill {
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 0%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.35s ease;
        }

        /* The bright flash that floods the currently-filled portion the
           instant a star threshold is crossed. Clipped to .meter-fill's own
           box, so it only ever sweeps across the filled part of the bar. */
        .meter-rush {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.95) 50%, transparent 100%);
            background-size: 220% 100%;
            background-position: -110% 0;
            animation: rushSweep 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Thin markers on the track showing the 2-star / 3-star thresholds */
        .meter-tick {
            position: absolute;
            top: 3px; bottom: 3px;
            width: 2px;
            background: rgba(41, 52, 62, 0.3);
            transform: translateX(-50%);
            z-index: 1;
            pointer-events: none;
        }

        /* Mini stars that light up live as the score crosses each threshold */
        .meter-stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        /* Extra specificity beats the general .material-symbols-outlined rule,
           which otherwise scales these to tile-icon size via --cell.
           Positioning uses margin, not transform: the .pop animation below
           drives transform for its scale/rotate flourish, and a CSS animation
           replaces the whole transform value rather than composing with it -
           so anything using transform to center itself would get clobbered
           the instant it pops. */
        .meter-stars .mstar {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            margin-top: -7px;
            margin-left: -7px;
            font-size: 0.875rem;
            line-height: 1;
            text-align: center;
            color: rgba(41, 52, 62, 0.32);
            font-variation-settings: 'FILL' 1, 'wght' 700;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
            transition: color 0.2s ease;
        }
        .meter-stars .mstar.filled { color: var(--gold-500); }
        .meter-stars .mstar.pop { animation: starPop 0.5s both; }

        /* Unclipped layer so sparks can drift above the bar */
        .meter-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: visible;
            z-index: 4;
        }

        .spark {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            animation: sparkFloat 0.9s ease-out forwards;
        }

        /* A constant pulsing glow riding the fill's leading edge once the bar
           passes halfway - pure CSS, so it's always visible regardless of
           how reliably any JS timer fires. Centered with margins, not
           transform: glowPulse below animates transform for the pulse, and
           an active animation replaces transform outright rather than
           composing with it. */
        .meter-glow {
            position: absolute;
            top: 50%;
            left: 0;
            width: 30px;
            height: 30px;
            margin-top: -15px;
            margin-left: -15px;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
        }
        .meter-glow.on { opacity: 1; animation: glowPulse 0.85s ease-in-out infinite; }

        .meter-container.full .meter-fill { animation: pulse-meter 0.6s ease-in-out infinite alternate; }

        /* ---------- Board ---------- */
        #board-wrap {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
        }

        #board-container {
            position: relative;
        }

        #pieces-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .piece {
            position: absolute;
            width: calc(100% / 6);
            height: calc(100% / 8);
            padding: 3px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform;
            pointer-events: auto;
            cursor: pointer;
            z-index: 5;
        }

        .piece-inner {
            width: 100%;
            height: 100%;
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: var(--radius-sm);
            box-shadow: 0px 4px 0px var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
        }

        .piece.selected .piece-inner {
            transform: scale(1.08) translate(0px, 4px);
            box-shadow: 0px 0px 0px var(--ink);
            background: var(--paper-2);
        }

        .piece-inner.invalid { border-color: var(--coral-700); }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            /* Scales with the JS-computed tile size, but never below the
               12px floor even on the smallest permitted cell. */
            font-size: max(0.75rem, calc(var(--cell) * 0.46));
            font-variation-settings: 'FILL' 1, 'wght' 700, 'GRAD' 0, 'opsz' 48;
            font-weight: normal;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            position: relative;
            z-index: 2;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            pointer-events: none;
        }

        /* ---------- Special piece markers ----------
           Every special tints its card with its own colour family and adds a
           geometric marker that states what it will do:
             stripe  -> arrows pointing along the line it clears
             wrap    -> ring + corner pips (blast radius)
             bomb    -> full rainbow card (clears a whole colour)            */
        .fx {
            position: absolute; inset: 0; border-radius: inherit; pointer-events: none; overflow: hidden;
            /* Safari fails to clip a rotating/transformed descendant with plain
               overflow:hidden + border-radius; a mask forces real clipping. */
            -webkit-mask-image: -webkit-radial-gradient(circle, #fff 100%, #000 100%);
            mask-image: radial-gradient(circle, #fff 100%, #000 100%);
        }

        .sp-h, .sp-v, .sp-wrap { background: var(--tint); }

        .sp-h .fx::before, .sp-h .fx::after,
        .sp-v .fx::before, .sp-v .fx::after {
            content: '';
            position: absolute;
            background: var(--pc);
        }
        .sp-h .fx::before {
            left: 3px; top: 50%;
            width: calc(var(--cell) * 0.13); height: calc(var(--cell) * 0.2);
            transform: translateY(-50%);
            clip-path: polygon(100% 0, 100% 100%, 0 50%);
        }
        .sp-h .fx::after {
            right: 3px; top: 50%;
            width: calc(var(--cell) * 0.13); height: calc(var(--cell) * 0.2);
            transform: translateY(-50%);
            clip-path: polygon(0 0, 0 100%, 100% 50%);
        }
        .sp-v .fx::before {
            top: 3px; left: 50%;
            height: calc(var(--cell) * 0.13); width: calc(var(--cell) * 0.2);
            transform: translateX(-50%);
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
        }
        .sp-v .fx::after {
            bottom: 3px; left: 50%;
            height: calc(var(--cell) * 0.13); width: calc(var(--cell) * 0.2);
            transform: translateX(-50%);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .sp-wrap .fx::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 2.5px solid var(--pc);
            border-radius: 50%;
            opacity: 0.55;
            animation: wrapPulse 1.8s ease-in-out infinite;
        }
        .sp-wrap .fx::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 13% 13%, var(--pc) 0 2.4px, transparent 2.5px),
                radial-gradient(circle at 87% 13%, var(--pc) 0 2.4px, transparent 2.5px),
                radial-gradient(circle at 13% 87%, var(--pc) 0 2.4px, transparent 2.5px),
                radial-gradient(circle at 87% 87%, var(--pc) 0 2.4px, transparent 2.5px);
        }

        .sp-bomb .fx::before {
            content: '';
            position: absolute;
            /* Exactly the tile's own size, never transformed - only the
               gradient's start angle animates (via the registered custom
               property below), so there is nothing here for the earlier
               transform-clipping bug to ever affect again. */
            inset: 0;
            background: conic-gradient(from var(--spin-angle), var(--c1), var(--c2), var(--c3), var(--c4), var(--c5), var(--c6), var(--c7), var(--c1));
            animation: spinAngle 7s linear infinite;
        }
        .sp-bomb .material-symbols-outlined { color: var(--ink); }

        /* ---------- Feedback ---------- */
        .pop { animation: popOut 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .shake { animation: screenShake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        .wiggle { animation: wiggleTile 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        .land { animation: landSquash 0.22s ease-out; }
        .piece-inner.hint { animation: hintWiggle 1.1s ease-in-out; }

        .tap-particle { border: 1.5px solid var(--ink); }

        .particle {
            position: absolute;
            border: 2px solid var(--ink);
            pointer-events: none;
            z-index: 20;
            animation: particle-burst 0.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .shockwave {
            position: absolute;
            width: 40px; height: 40px;
            border: 4px solid var(--paper);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 30;
            animation: shockwaveExpand 0.5s ease-out forwards;
        }

        .combo-banner {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            opacity: 0;
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            color: var(--paper);
            text-shadow: 4px 4px 0 var(--ink);
            pointer-events: none;
            z-index: 60;
            white-space: nowrap;
        }
        .combo-banner.show { animation: comboPop 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }

        .floating-text {
            position: absolute;
            color: var(--paper);
            font-weight: 900;
            font-size: 1.5rem;
            text-shadow: 3px 3px 0 var(--ink);
            pointer-events: none;
            z-index: 40;
            animation: float-up 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        .flash {
            position: absolute; inset: 0;
            background: var(--paper); z-index: 100; pointer-events: none;
            border-radius: var(--radius-md);
            animation: flash-fade 0.2s ease-out forwards;
        }

        .confetti {
            position: fixed;
            width: 14px; height: 14px;
            border: 2px solid var(--ink);
            z-index: 150;
            pointer-events: none;
            animation: confetti-fall 3s linear forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.4) rotate(15deg); }
            100% { transform: scale(0) rotate(-15deg); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinAngle { from { --spin-angle: 0deg; } to { --spin-angle: 360deg; } }
        @keyframes wrapPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.09); opacity: 0.85; }
        }
        @keyframes wiggleTile {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15%); }
            75% { transform: translateX(15%); }
        }
        @keyframes landSquash {
            0% { transform: scaleY(0.8) scaleX(1.08); }
            60% { transform: scaleY(1.06) scaleX(0.96); }
            100% { transform: scaleY(1) scaleX(1); }
        }
        @keyframes hintWiggle {
            0%, 100% { transform: translateX(0); box-shadow: 0px 4px 0px var(--ink); }
            15% { transform: translateX(-9%); box-shadow: 0px 4px 0px var(--ink), 0 0 14px 4px rgba(255,255,255,0.65); }
            30% { transform: translateX(7%); }
            45% { transform: translateX(-5%); box-shadow: 0px 4px 0px var(--ink), 0 0 14px 4px rgba(255,255,255,0.65); }
            60% { transform: translateX(3%); }
            75% { transform: translateX(0); box-shadow: 0px 4px 0px var(--ink); }
        }
        @keyframes screenShake {
            0%, 100% { transform: translate3d(0, 0, 0); }
            20%, 60% { transform: translate3d(-5px, 3px, 0); }
            40%, 80% { transform: translate3d(5px, -3px, 0); }
        }
        @keyframes particle-burst {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(180deg); opacity: 1; }
        }
        @keyframes shockwaveExpand {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
