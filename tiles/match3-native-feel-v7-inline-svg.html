<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mellow Match • Native Feel Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F5F2EB;
  --ink:#20201F;
  --muted:#8B8B86;
  /* YELLOW ORANGE */
  --color-yellow-orange-light:#FFDFAB;
  --color-yellow-orange-base:#FFC567;
  --color-yellow-orange-dark:#C57A00;

  /* PINK */
  --color-pink-light:#FDB5CD;
  --color-pink-base:#FB7DA8;
  --color-pink-dark:#C90649;

  /* RED ORANGE */
  --color-red-orange-light:#FEA499;
  --color-red-orange-base:#FD5A46;
  --color-red-orange-dark:#B01502;

  /* PURPLE */
  --color-purple-light:#9F76D2;
  --color-purple-base:#552C87;
  --color-purple-dark:#30194D;

  /* GREEN */
  --color-green-light:#3BFFB3;
  --color-green-base:#00995E;
  --color-green-dark:#00663F;

  /* BLUE */
  --color-blue-light:#63C5FB;
  --color-blue-base:#058CD7;
  --color-blue-dark:#034D76;

  /* TRUE YELLOW */
  --color-true-yellow-light:#FAD970;
  --color-true-yellow-base:#EAB308;
  --color-true-yellow-dark:#816204;

  /* TEAL */
  --color-teal-light:#4FF0E1;
  --color-teal-base:#0D9488;
  --color-teal-dark:#085E56;

  /* INDIGO */
  --color-indigo-light:#6484DD;
  --color-indigo-base:#1E3A8A;
  --color-indigo-dark:#122354;

  /* PURE RED */
  --color-pure-red-light:#EC8888;
  --color-pure-red-base:#DC2626;
  --color-pure-red-dark:#7A1414;

  /* NEUTRALS */
  --neutral-0:#FFFFFF;
  --neutral-50:#F7F5F0;
  --neutral-100:#EEEAE2;
  --neutral-700:#343238;
  --neutral-800:#26242A;
  --neutral-900:#17161A;

  --board-pad:14px;
  --gap:8px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  background:
    radial-gradient(circle at 50% -5%,rgba(255,255,255,.95),transparent 40%),
    var(--neutral-50);
  color:var(--ink);
  font-family:Inter,system-ui,sans-serif;
}

button,input{font:inherit}
button{touch-action:manipulation}

.app{
  width:min(100%,480px);
  height:100dvh;
  margin:auto;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  position:relative;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}
.brand{
  font:800 22px/1 Manrope,sans-serif;
  letter-spacing:-.04em;
}
.stats{display:flex;gap:8px}
.pill{
  min-width:78px;
  height:42px;
  display:grid;
  place-items:center;
  align-content:center;
  border-radius:15px;
  background:rgba(255,255,255,.84);
  border:1px solid rgba(0,0,0,.05);
  box-shadow:0 8px 22px rgba(0,0,0,.05);
  backdrop-filter:blur(12px);
}
.pill b{font-size:14px;line-height:1}
.pill span{
  margin-top:4px;
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}

.stage{
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:34px;
}

.shell{
  width:min(100%,440px);
  aspect-ratio:1;
  position:relative;
  contain:layout style;
  overflow:visible;
  filter:drop-shadow(0 24px 40px rgba(43,38,28,.10));
}

.board{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:26px;
  background:var(--neutral-100);
  border:4px solid var(--neutral-800);
  box-shadow:
    0 8px 0 var(--neutral-800),
    0 22px 44px rgba(38,35,29,.14);
}
.board::before{content:none}
.grid{
  position:absolute;
  inset:var(--board-pad);
  touch-action:none;
  contain:layout style;
  overflow:visible;
}

.tile{
  position:absolute;
  left:0;
  top:0;
  border:0;
  padding:0;
  margin:0;
  background:transparent;
  cursor:pointer;
  transform-origin:center;
  will-change:transform,opacity;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  contain:layout style;
  overflow:visible;
}
.gem{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  border-radius:24%;
  overflow:visible;
  background:var(--tile-bg,var(--neutral-50));
  border:3px solid var(--neutral-800);
  box-shadow:0 4px 0 var(--neutral-800);
  transform:translateZ(0);
  will-change:transform,opacity;
}
.gem::before,
.gem::after{content:none}

.tile-icon{
  width:58%;
  height:58%;
  display:block;
  overflow:visible;
  pointer-events:none;
}
.tile-icon use{
  fill:var(--tile-shape,var(--neutral-0));
  stroke:var(--neutral-800);
  stroke-width:4.5;
  stroke-linejoin:round;
  stroke-linecap:round;
  vector-effect:non-scaling-stroke;
}
.tile-fallback{display:none}

.type-0{--tile-bg:var(--color-yellow-orange-base);--tile-shape:var(--color-yellow-orange-light);--tile-accent:var(--color-yellow-orange-dark)}
.type-1{--tile-bg:var(--color-pink-base);--tile-shape:var(--color-pink-light);--tile-accent:var(--color-pink-dark)}
.type-2{--tile-bg:var(--color-blue-base);--tile-shape:var(--color-blue-light);--tile-accent:var(--color-blue-dark)}
.type-3{--tile-bg:var(--color-teal-base);--tile-shape:var(--color-teal-light);--tile-accent:var(--color-teal-dark)}

.type-0 .gem{background:var(--tile-bg)}
.type-1 .gem{background:var(--tile-bg)}
.type-2 .gem{background:var(--tile-bg)}
.type-3 .gem{background:var(--tile-bg)}

.tile.special-row .gem,
.tile.special-col .gem,
.tile.special-bomb .gem{
  box-shadow:0 5px 0 var(--neutral-800),0 0 0 3px var(--color-true-yellow-base);
}
.tile.special-row .gem::after,
.tile.special-col .gem::after,
.tile.special-bomb .gem::after{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:18%;
  pointer-events:none;
}
.tile.special-row .gem::after{
  background:repeating-linear-gradient(90deg,transparent 0 13%,rgba(255,255,255,.85) 13% 17%,transparent 17% 30%);
}
.tile.special-col .gem::after{
  background:repeating-linear-gradient(0deg,transparent 0 13%,rgba(255,255,255,.85) 13% 17%,transparent 17% 30%);
}
.tile.special-bomb .gem::after{
  inset:11px;
  border:3px solid rgba(255,255,255,.92);
  border-radius:50%;
}
.tile.special-row .gem::after{
  background:repeating-linear-gradient(90deg,transparent 0 12%,rgba(255,255,255,.8) 12% 17%,transparent 17% 30%);
}
.tile.special-col .gem::after{
  background:repeating-linear-gradient(0deg,transparent 0 12%,rgba(255,255,255,.8) 12% 17%,transparent 17% 30%);
}
.tile.special-bomb .gem::after{
  border:3px solid rgba(255,255,255,.9);
  border-radius:50%;
}
.tile.selected .gem{
  animation:selectedPulse .58s ease-in-out infinite alternate;
}
@keyframes selectedPulse{
  from{transform:scale(.93)}
  to{transform:scale(1.035)}
}

.level-progress{
  position:absolute;
  left:6px;
  right:6px;
  top:-34px;
  height:26px;
  z-index:30;
}
.progress-track{
  position:absolute;
  inset:6px 0 4px;
  height:16px;
  border-radius:999px;
  background:rgba(255,255,255,.8);
  border:1px solid rgba(0,0,0,.06);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);
  backdrop-filter:blur(10px);
}
.progress-fill{
  position:absolute;
  left:2px;
  top:2px;
  bottom:2px;
  right:2px;
  border-radius:999px;
  transform-origin:left center;
  transform:scaleX(.001) translateZ(0);
  background:linear-gradient(90deg,var(--color-blue-base),var(--color-purple-base));
  will-change:transform;
  overflow:visible;
}
.progress-fill::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:linear-gradient(105deg,transparent 14%,rgba(255,255,255,.38) 36%,transparent 58%);
  background-size:74px 100%;
  animation:barSheen 1.6s linear infinite;
}
@keyframes barSheen{
  from{background-position:-90px 0}
  to{background-position:190px 0}
}
.glitter-head{
  --glow:#FFFFFF;
  position:absolute;
  right:-8px;
  top:50%;
  width:18px;
  height:18px;
  transform:translateY(-50%) translateZ(0);
  border-radius:50%;
  background:radial-gradient(circle,#fff 0 11%,var(--glow) 12% 26%,transparent 57%);
  filter:drop-shadow(0 0 4px var(--glow)) drop-shadow(0 0 8px var(--glow));
  animation:glitterPulse 1.05s ease-in-out infinite alternate;
}
.glitter-head::before,.glitter-head::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:2px;
  height:25px;
  border-radius:999px;
  background:linear-gradient(transparent,var(--glow),transparent);
  transform:translate(-50%,-50%);
}
.glitter-head::after{transform:translate(-50%,-50%) rotate(90deg)}
@keyframes glitterPulse{
  from{transform:translateY(-50%) scale(.82) rotate(0)}
  to{transform:translateY(-50%) scale(1.12) rotate(18deg)}
}
.progress-fill.t1{background:linear-gradient(90deg,var(--color-blue-base),var(--color-teal-light))}
.progress-fill.t1 .glitter-head{--glow:#91EDFF}
.progress-fill.t2{background:linear-gradient(90deg,var(--color-purple-base),var(--color-pink-base))}
.progress-fill.t2 .glitter-head{
  --glow:#FFA0D3;
  animation-duration:.75s;
  filter:drop-shadow(0 0 5px #FFA0D3) drop-shadow(0 0 13px #FF77A9);
}
.progress-fill.t3{background:linear-gradient(90deg,var(--color-yellow-orange-base),var(--color-true-yellow-base))}
.progress-fill.t3 .glitter-head{
  --glow:#FFF1A0;
  animation-duration:.5s;
  filter:drop-shadow(0 0 6px #FFF1A0) drop-shadow(0 0 16px #FFD93D) drop-shadow(0 0 22px rgba(255,179,71,.55));
}
.progress-fill.done{
  background:linear-gradient(90deg,var(--color-true-yellow-base),#FFF4B8,var(--color-yellow-orange-base));
  background-size:180% 100%;
  animation:goldFlow .7s linear infinite;
}
@keyframes goldFlow{to{background-position:180% 0}}

.milestone{
  position:absolute;
  top:50%;
  width:23px;
  height:23px;
  transform:translate(-50%,-50%) translateZ(0);
  border-radius:50%;
  background:#F1EEE7;
  border:3px solid #fff;
  box-shadow:0 3px 8px rgba(0,0,0,.13),0 0 0 1px rgba(0,0,0,.05);
  z-index:5;
}
.milestone::after{
  content:"★";
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#AAA69F;
  font-size:10px;
}
.milestone.hit{
  background:var(--mc);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 13px var(--mc);
}
.milestone.hit::after{color:#fff}
.progress-percent{
  position:absolute;
  right:2px;
  top:-9px;
  color:var(--muted);
  font-size:9px;
  font-weight:800;
}

.fx-canvas{
  position:absolute;
  inset:-52px -24px -24px;
  width:calc(100% + 48px);
  height:calc(100% + 76px);
  pointer-events:none;
  z-index:50;
}

.text-layer{
  position:absolute;
  inset:-52px -24px -24px;
  pointer-events:none;
  z-index:55;
  overflow:visible;
}
.combo-text{
  position:absolute;
  left:50%;
  top:15%;
  transform:translate(-50%,0);
  font:800 clamp(25px,8vw,42px)/1 Manrope,sans-serif;
  letter-spacing:-.05em;
  white-space:nowrap;
  text-shadow:0 4px 14px rgba(0,0,0,.11);
}
.score-pop{
  position:absolute;
  transform:translate(-50%,-50%);
  font-size:14px;
  font-weight:800;
  text-shadow:0 2px 9px rgba(255,255,255,.75);
}

.screen-flash{
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.5),transparent 55%);
  mix-blend-mode:screen;
}

.bottom{
  padding-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.status{min-width:0}
.status strong{display:block;font-size:14px;margin-bottom:4px}
.status span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px}
.icon-btn{
  width:44px;
  height:44px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:15px;
  background:rgba(255,255,255,.88);
  box-shadow:0 8px 20px rgba(0,0,0,.05);
  color:var(--ink);
  font-weight:800;
  cursor:pointer;
}
.icon-btn:active{transform:scale(.94)}

.debug-toggle{
  position:fixed;
  z-index:200;
  right:14px;
  bottom:14px;
  height:38px;
  padding:0 14px;
  border:0;
  border-radius:14px;
  background:var(--neutral-900);
  color:white;
  box-shadow:0 10px 28px rgba(0,0,0,.2);
  font:700 11px Inter,sans-serif;
  cursor:pointer;
}
.debug-panel{
  position:fixed;
  z-index:199;
  right:14px;
  bottom:60px;
  width:min(330px,calc(100vw - 28px));
  max-height:calc(100dvh - 82px);
  overflow:auto;
  padding:14px;
  border-radius:20px;
  background:rgba(250,248,243,.98);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 24px 60px rgba(0,0,0,.2);
  backdrop-filter:blur(18px);
  opacity:0;
  pointer-events:none;
  transform:translateY(8px) scale(.98);
  transition:opacity .16s ease,transform .16s ease;
}
.debug-panel.open{
  opacity:1;
  pointer-events:auto;
  transform:none;
}
.debug-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}
.debug-title strong{font:800 14px Manrope,sans-serif}
.debug-title span{font-size:10px;color:var(--muted)}
.perf-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:10px;
}
.perf{
  padding:8px 6px;
  border-radius:10px;
  background:#fff;
  border:1px solid rgba(0,0,0,.05);
  text-align:center;
}
.perf b{display:block;font-size:13px}
.perf span{display:block;margin-top:3px;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.debug-group{
  padding:10px 0;
  border-top:1px solid rgba(0,0,0,.06);
}
.debug-group>span{
  display:block;
  margin-bottom:7px;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
}
.debug-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.debug-btn{
  min-height:34px;
  padding:7px;
  border:1px solid rgba(0,0,0,.07);
  border-radius:10px;
  background:#fff;
  color:var(--ink);
  font:700 10px Inter,sans-serif;
  cursor:pointer;
}
.debug-btn:active{transform:scale(.97)}
.debug-slider{width:100%;accent-color:#845EC2}
.debug-value{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  font-size:10px;
  color:var(--muted);
}

@media(max-height:720px){
  .app{padding-top:12px}
  .stage{padding-top:29px}
  .pill{height:39px}
  .bottom{padding-top:7px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="brand">Mellow Match</div>
    <div class="stats">
      <div class="pill"><b id="score">0</b><span>score</span></div>
      <div class="pill"><b id="moves">30</b><span>moves</span></div>
    </div>
  </header>

  <main class="stage">
    <div class="shell" id="shell">
      <div class="level-progress">
        <div class="progress-track" id="progressTrack">
          <div class="progress-fill" id="progressFill"><i class="glitter-head"></i></div>
          <i class="milestone" id="mile1" style="left:25%;--mc:#4FF0E1"></i>
          <i class="milestone" id="mile2" style="left:50%;--mc:#FB7DA8"></i>
          <i class="milestone" id="mile3" style="left:75%;--mc:#EAB308"></i>
          <span class="progress-percent" id="progressPercent">0%</span>
        </div>
      </div>

      <div class="board" id="board">
        <div class="grid" id="grid"></div>
      </div>

      <canvas class="fx-canvas" id="fxCanvas"></canvas>
      <div class="text-layer" id="textLayer"></div>
    </div>
  </main>

  <footer class="bottom">
    <div class="status">
      <strong id="statusTitle">Make a match</strong>
      <span id="statusSub">Swipe or tap neighbouring tiles</span>
    </div>
    <div class="actions">
      <button class="icon-btn" id="hintBtn" aria-label="Hint">?</button>
      <button class="icon-btn" id="resetBtn" aria-label="Reset">↻</button>
    </div>
  </footer>
</div>

<div class="screen-flash" id="screenFlash"></div>

<button class="debug-toggle" id="debugToggle">DEBUG</button>

<aside class="debug-panel" id="debugPanel">
  <div class="debug-title"><strong>Native Feel Lab</strong><span>live performance</span></div>

  <div class="perf-grid">
    <div class="perf"><b id="fpsOut">0</b><span>FPS</span></div>
    <div class="perf"><b id="frameOut">0 ms</b><span>Frame</span></div>
    <div class="perf"><b id="worstOut">0 ms</b><span>Worst</span></div>
    <div class="perf"><b id="hzOut">?</b><span>Est. Hz</span></div>
    <div class="perf"><b id="particleOut">0</b><span>Particles</span></div>
    <div class="perf"><b id="tileOut">64</b><span>DOM Gems</span></div>
  </div>

  <div class="debug-group">
    <span>Progress</span>
    <input class="debug-slider" id="debugSlider" type="range" min="0" max="100" value="0">
    <div class="debug-value"><span>Board completion</span><b id="debugValue">0%</b></div>
    <div class="debug-grid" style="margin-top:8px">
      <button class="debug-btn" data-progress="25">Milestone 1</button>
      <button class="debug-btn" data-progress="50">Milestone 2</button>
      <button class="debug-btn" data-progress="75">Milestone 3</button>
      <button class="debug-btn" data-progress="95">Near finish</button>
      <button class="debug-btn" data-progress="100">Complete</button>
      <button class="debug-btn" data-progress="0">Reset bar</button>
    </div>
  </div>

  <div class="debug-group">
    <span>Board feedback</span>
    <div class="debug-grid">
      <button class="debug-btn" id="testCombo2">Cascade ×2</button>
      <button class="debug-btn" id="testCombo4">Cascade ×4</button>
      <button class="debug-btn" id="testRow">Row special</button>
      <button class="debug-btn" id="testCol">Column special</button>
      <button class="debug-btn" id="testBomb">Bomb special</button>
      <button class="debug-btn" id="testBurst">Particle burst</button>
      <button class="debug-btn" id="testImpact">Heavy impact</button>
      <button class="debug-btn" id="testStress">Stress burst</button>
    </div>
  </div>

  <div class="debug-group">
    <span>Utility</span>
    <div class="debug-grid">
      <button class="debug-btn" id="testScore">+1,500 score</button>
      <button class="debug-btn" id="useLive">Use live score</button>
      <button class="debug-btn" id="shuffleBtn">Shuffle board</button>
      <button class="debug-btn" id="resetPerf">Reset worst frame</button>
    </div>
  </div>
</aside>

<script>
'use strict';

const SIZE = 8;
const TYPES = 4;
const GAP = 8;
const LEVEL_TARGET = 12000;
const COLORS = ['#FFC567','#FB7DA8','#058CD7','#0D9488'];



const grid = document.getElementById('grid');
const shell = document.getElementById('shell');
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const movesEl = document.getElementById('moves');
const statusTitle = document.getElementById('statusTitle');
const statusSub = document.getElementById('statusSub');
const progressFill = document.getElementById('progressFill');
const progressPercent = document.getElementById('progressPercent');
const mileEls = [
  document.getElementById('mile1'),
  document.getElementById('mile2'),
  document.getElementById('mile3')
];
const textLayer = document.getElementById('textLayer');
const flashEl = document.getElementById('screenFlash');

const canvas = document.getElementById('fxCanvas');
const ctx = canvas.getContext('2d', {alpha:true, desynchronized:true});

let board = Array.from({length:SIZE},()=>Array(SIZE).fill(null));
let tiles = [];
let score = 0;
let moves = 30;
let comboDepth = 0;
let locked = false;
let selected = null;
let lastSwap = null;
let debugProgress = null;
let reachedProgress = new Set();

let geom = {
  cell:0,
  step:0,
  gridLeft:0,
  gridTop:0,
  shellWidth:0,
  shellHeight:0
};

let drag = null;

const particles = [];
const beams = [];
const rings = [];

let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

const perf = {
  last:performance.now(),
  samples:[],
  fps:0,
  frame:0,
  worst:0,
  hz:'?'
};

function uid(){
  return Math.random().toString(36).slice(2) + performance.now().toString(36);
}

function randomType(){
  return Math.floor(Math.random()*TYPES);
}

function pos(row,col){
  return {
    x:col*geom.step,
    y:row*geom.step
  };
}

function tileTransform(row,col,scaleX=1,scaleY=1,rotate=0){
  const p = pos(row,col);
  return `translate3d(${p.x}px,${p.y}px,0) scale(${scaleX},${scaleY}) rotate(${rotate}deg)`;
}

function refreshGeometry(){
  const rect = grid.getBoundingClientRect();
  geom.cell = (rect.width - GAP*(SIZE-1))/SIZE;
  geom.step = geom.cell + GAP;

  const shellRect = shell.getBoundingClientRect();
  geom.gridLeft = rect.left - shellRect.left;
  geom.gridTop = rect.top - shellRect.top;
  geom.shellWidth = shellRect.width;
  geom.shellHeight = shellRect.height;

  grid.style.setProperty('--cell',`${geom.cell}px`);

  for(const tile of tiles){
    tile.el.style.width = `${geom.cell}px`;
    tile.el.style.height = `${geom.cell}px`;
    tile.el.style.transform = tileTransform(tile.row,tile.col);
  }

  resizeCanvas();
}

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  dpr = Math.max(1,Math.min(2,window.devicePixelRatio || 1));
  canvas.width = Math.round(rect.width*dpr);
  canvas.height = Math.round(rect.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function canvasOffset(){
  const c = canvas.getBoundingClientRect();
  const s = shell.getBoundingClientRect();
  return {x:s.left-c.left,y:s.top-c.top};
}

function shellPointForCell(row,col){
  return {
    x:geom.gridLeft + col*geom.step + geom.cell/2,
    y:geom.gridTop + row*geom.step + geom.cell/2
  };
}

function createTile(row,col,type=randomType()){
  const el = document.createElement('button');
  el.className = `tile type-${type}`;
  el.type = 'button';
  el.setAttribute('aria-label','game piece');

  const gem = document.createElement('span');
  gem.className = 'gem';

  const icon = document.createElementNS('http://www.w3.org/2000/svg','svg');
  icon.classList.add('tile-icon');
  icon.setAttribute('viewBox','0 0 100 100');
  icon.setAttribute('aria-hidden','true');

  const iconUse = document.createElementNS('http://www.w3.org/2000/svg','use');
  icon.appendChild(iconUse);

  const fallback = document.createElement('span');
  fallback.className = 'tile-fallback';

  gem.appendChild(icon);
  gem.appendChild(fallback);
  el.appendChild(gem);

  const tile = {
    id:uid(),
    row,
    col,
    type,
    special:null,
    el,
    gem,
    icon,
    iconUse,
    fallback,
    alive:true
  };

  el.dataset.id = tile.id;
  setTileVisual(tile);
  el.style.width = `${geom.cell || 40}px`;
  el.style.height = `${geom.cell || 40}px`;
  el.style.transform = tileTransform(row,col);

  el.addEventListener('pointerdown',e=>onPointerDown(e,tile));
  el.addEventListener('click',()=>onTileClick(tile));

  grid.appendChild(el);
  tiles.push(tile);
  return tile;
}


function setTileAsset(tile){
  const ids=['shape-burst','shape-circle','shape-diamond','shape-x'];
  tile.iconUse.setAttribute('href',`#${ids[tile.type]}`);
  tile.iconUse.setAttributeNS('http://www.w3.org/1999/xlink','href',`#${ids[tile.type]}`);
}

function setTileVisual(tile){
  tile.el.className = `tile type-${tile.type}`;
  if(tile.special) tile.el.classList.add(`special-${tile.special}`);
  if(selected === tile) tile.el.classList.add('selected');
  setTileAsset(tile);
}

function setSpecial(tile,special){
  tile.special = special;
  setTileVisual(tile);
}

function generateInitialBoard(){
  tiles.forEach(t=>t.el.remove());
  tiles = [];
  board = Array.from({length:SIZE},()=>Array(SIZE).fill(null));

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      let type;
      do{
        type = randomType();
      }while(
        (c>=2 && board[r][c-1].type===type && board[r][c-2].type===type) ||
        (r>=2 && board[r-1][c].type===type && board[r-2][c].type===type)
      );

      const tile = createTile(r,c,type);
      board[r][c] = tile;
    }
  }

  if(!findPossibleMove()){
    generateInitialBoard();
  }
}

function clearSelection(){
  if(selected){
    selected.el.classList.remove('selected');
    selected = null;
  }
}

function onTileClick(tile){
  if(locked || drag?.moved) return;

  if(!selected){
    selected = tile;
    tile.el.classList.add('selected');
    microPulse(tile);
    return;
  }

  if(selected === tile){
    clearSelection();
    return;
  }

  const dist = Math.abs(selected.row-tile.row)+Math.abs(selected.col-tile.col);
  if(dist===1){
    const a = selected;
    clearSelection();
    attemptSwap(a,tile);
  }else{
    clearSelection();
    selected = tile;
    tile.el.classList.add('selected');
    microPulse(tile);
  }
}

function onPointerDown(e,tile){
  if(locked) return;
  drag = {
    tile,
    startX:e.clientX,
    startY:e.clientY,
    moved:false,
    dx:0,
    dy:0
  };

  tile.el.setPointerCapture?.(e.pointerId);
  tile.el.addEventListener('pointermove',onPointerMove);
  tile.el.addEventListener('pointerup',onPointerUp,{once:true});
  tile.el.addEventListener('pointercancel',onPointerCancel,{once:true});

  tile.gem.animate(
    [{transform:'scale(1)'},{transform:'scale(.94)'}],
    {duration:90,fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'}
  );
}

function onPointerMove(e){
  if(!drag || locked) return;

  drag.dx = e.clientX-drag.startX;
  drag.dy = e.clientY-drag.startY;

  const dominantX = Math.abs(drag.dx) >= Math.abs(drag.dy);
  const limit = geom.cell*.34;
  const d = dominantX ? drag.dx : drag.dy;
  const clamped = Math.max(-limit,Math.min(limit,d));

  if(Math.abs(d)>4) drag.moved = true;

  const base = pos(drag.tile.row,drag.tile.col);
  const tx = base.x + (dominantX ? clamped : 0);
  const ty = base.y + (dominantX ? 0 : clamped);
  drag.tile.el.style.transform = `translate3d(${tx}px,${ty}px,0) scale(1.02)`;
}

function cleanupPointer(tile){
  tile.el.removeEventListener('pointermove',onPointerMove);
  tile.gem.getAnimations().forEach(a=>a.cancel());
  tile.gem.style.transform = '';
}

function onPointerCancel(){
  if(!drag) return;
  const tile = drag.tile;
  tile.el.style.transform = tileTransform(tile.row,tile.col);
  cleanupPointer(tile);
  drag = null;
}

function onPointerUp(e){
  if(!drag || locked) return;
  const state = drag;
  const tile = state.tile;
  cleanupPointer(tile);

  const dx = e.clientX-state.startX;
  const dy = e.clientY-state.startY;
  const threshold = 16;

  if(Math.max(Math.abs(dx),Math.abs(dy))<threshold){
    tile.el.style.transform = tileTransform(tile.row,tile.col);
    drag = null;
    return;
  }

  let nr=tile.row,nc=tile.col;
  if(Math.abs(dx)>Math.abs(dy)) nc += dx>0 ? 1 : -1;
  else nr += dy>0 ? 1 : -1;

  drag = null;
  clearSelection();

  if(nr>=0 && nr<SIZE && nc>=0 && nc<SIZE){
    attemptSwap(tile,board[nr][nc]);
  }else{
    springBack(tile);
  }
}

async function springBack(tile){
  const p = pos(tile.row,tile.col);
  const current = tile.el.style.transform;
  const a = tile.el.animate(
    [
      {transform:current},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(.985)`},
      {transform:tileTransform(tile.row,tile.col)}
    ],
    {duration:180,easing:'cubic-bezier(.18,.9,.2,1)'}
  );
  await safeFinished(a);
  tile.el.style.transform = tileTransform(tile.row,tile.col);
}

function microPulse(tile){
  tile.gem.animate(
    [
      {transform:'scale(1)'},
      {transform:'scale(.93)'},
      {transform:'scale(1.03)'},
      {transform:'scale(1)'}
    ],
    {duration:220,easing:'cubic-bezier(.2,.8,.2,1)'}
  );
}

function swapBoardRefs(a,b){
  const ar=a.row, ac=a.col, br=b.row, bc=b.col;
  board[ar][ac] = b;
  board[br][bc] = a;
  a.row=br; a.col=bc;
  b.row=ar; b.col=ac;
}

async function animateSwap(a,b,forward=true){
  const aStart = tileTransform(a.row,a.col);
  const bStart = tileTransform(b.row,b.col);
  const aEnd = tileTransform(b.row,b.col);
  const bEnd = tileTransform(a.row,a.col);

  const options = {
    duration:forward ? 155 : 170,
    easing:forward ? 'cubic-bezier(.22,.76,.22,1)' : 'cubic-bezier(.28,.75,.22,1)',
    fill:'forwards'
  };

  const aa = a.el.animate(
    [
      {transform:aStart,offset:0},
      {transform:aEnd.replace('scale(1,1)','scale(1.045,1.045)'),offset:.72},
      {transform:aEnd,offset:1}
    ],
    options
  );

  const bb = b.el.animate(
    [
      {transform:bStart,offset:0},
      {transform:bEnd.replace('scale(1,1)','scale(1.045,1.045)'),offset:.72},
      {transform:bEnd,offset:1}
    ],
    options
  );

  await Promise.all([safeFinished(aa),safeFinished(bb)]);

  a.el.style.transform=aEnd;
  b.el.style.transform=bEnd;
}

async function attemptSwap(a,b){
  if(locked || moves<=0) return;
  locked=true;
  lastSwap={a,b};

  await animateSwap(a,b,true);
  swapBoardRefs(a,b);

  a.el.style.transform=tileTransform(a.row,a.col);
  b.el.style.transform=tileTransform(b.row,b.col);

  const specialSwap = !!(a.special || b.special);
  const groups = findMatchGroups();

  if(!groups.length && !specialSwap){
    await animateSwap(a,b,false);
    swapBoardRefs(a,b);
    a.el.style.transform=tileTransform(a.row,a.col);
    b.el.style.transform=tileTransform(b.row,b.col);
    invalidFeedback(a,b);
    statusTitle.textContent="That won't match";
    statusSub.textContent='Try another swap';
    locked=false;
    return;
  }

  moves--;
  movesEl.textContent=moves;
  comboDepth=0;

  if(specialSwap){
    const set = new Set();
    collectSpecialCells(a,set);
    collectSpecialCells(b,set);
    await resolveRemoval(set,[]);
    await resolveCascades();
  }else{
    await resolveCascades();
  }

  statusTitle.textContent=moves>0?'Make a match':'Round complete';
  statusSub.textContent=moves>0?'Swipe or tap neighbouring tiles':`Final score ${score.toLocaleString()}`;
  locked=false;
}

function invalidFeedback(a,b){
  for(const tile of [a,b]){
    tile.gem.animate(
      [
        {transform:'translateX(0)'},
        {transform:'translateX(-8%) rotate(-2deg)'},
        {transform:'translateX(8%) rotate(2deg)'},
        {transform:'translateX(0)'}
      ],
      {duration:260,easing:'ease-out'}
    );
  }
  vibrate(12);
}

function findMatchGroups(){
  const groups=[];

  for(let r=0;r<SIZE;r++){
    let start=0;
    for(let c=1;c<=SIZE;c++){
      const same = c<SIZE && board[r][c].type===board[r][start].type;
      if(same) continue;
      const len=c-start;
      if(len>=3){
        groups.push({
          orientation:'row',
          cells:Array.from({length:len},(_,i)=>board[r][start+i])
        });
      }
      start=c;
    }
  }

  for(let c=0;c<SIZE;c++){
    let start=0;
    for(let r=1;r<=SIZE;r++){
      const same = r<SIZE && board[r][c].type===board[start][c].type;
      if(same) continue;
      const len=r-start;
      if(len>=3){
        groups.push({
          orientation:'col',
          cells:Array.from({length:len},(_,i)=>board[start+i][c])
        });
      }
      start=r;
    }
  }

  return groups;
}

function chooseAnchor(group){
  if(lastSwap){
    if(group.cells.includes(lastSwap.b)) return lastSwap.b;
    if(group.cells.includes(lastSwap.a)) return lastSwap.a;
  }
  return group.cells[Math.floor(group.cells.length/2)];
}

function planMatchResolution(groups){
  const remove = new Set();
  const specialPlans = new Map();
  const counts = new Map();

  for(const group of groups){
    for(const tile of group.cells){
      remove.add(tile);
      counts.set(tile,(counts.get(tile)||0)+1);
    }

    if(group.cells.length>=4){
      const anchor=chooseAnchor(group);
      const proposed = group.cells.length>=5 ? 'bomb' : group.orientation;
      specialPlans.set(anchor,proposed);
    }
  }

  for(const [tile,count] of counts){
    if(count>=2) specialPlans.set(tile,'bomb');
  }

  for(const tile of specialPlans.keys()){
    remove.delete(tile);
  }

  return {remove,specialPlans};
}

function collectSpecialCells(tile,set,visited=new Set()){
  if(!tile || visited.has(tile)) return;
  visited.add(tile);
  set.add(tile);

  if(tile.special==='row'){
    for(let c=0;c<SIZE;c++){
      const t=board[tile.row][c];
      if(t && !set.has(t)){
        set.add(t);
        if(t.special) collectSpecialCells(t,set,visited);
      }
    }
  }else if(tile.special==='col'){
    for(let r=0;r<SIZE;r++){
      const t=board[r][tile.col];
      if(t && !set.has(t)){
        set.add(t);
        if(t.special) collectSpecialCells(t,set,visited);
      }
    }
  }else if(tile.special==='bomb'){
    for(let r=Math.max(0,tile.row-1);r<=Math.min(SIZE-1,tile.row+1);r++){
      for(let c=Math.max(0,tile.col-1);c<=Math.min(SIZE-1,tile.col+1);c++){
        const t=board[r][c];
        if(t && !set.has(t)){
          set.add(t);
          if(t.special) collectSpecialCells(t,set,visited);
        }
      }
    }
  }
}

async function resolveCascades(){
  while(true){
    const groups=findMatchGroups();
    if(!groups.length) break;

    comboDepth++;
    const {remove,specialPlans}=planMatchResolution(groups);

    for(const tile of [...remove]){
      if(tile.special){
        collectSpecialCells(tile,remove);
      }
    }

    await resolveRemoval(remove,[...specialPlans.entries()]);
  }
}

async function resolveRemoval(remove,specialPlans){
  if(!remove.size && !specialPlans.length) return;

  const count=remove.size;
  const gain=Math.max(300,count*100*Math.max(1,comboDepth));
  const from=score;
  score+=gain;
  animateNumber(scoreEl,from,score,280);
  updateProgressFromScore();

  if(comboDepth>=2){
    comboFeedback(comboDepth);
  }

  for(const [tile,special] of specialPlans){
    setSpecial(tile,special);
    transformSpecial(tile,special);
  }

  const specialTiles=[...remove].filter(t=>t.special);
  if(specialTiles.length){
    await waitFrameTime(45);
    for(const tile of specialTiles) specialEffect(tile);
  }

  neighborReact(remove);

  const popAnimations=[];
  for(const tile of remove){
    const center=shellPointForCell(tile.row,tile.col);
    particleBurst(center.x,center.y,tile.type,8 + Math.min(comboDepth,4)*2);
    if(Math.random()>.72) floatingScore(center.x,center.y,`+${Math.round(gain/Math.max(1,count))}`);

    const anim=tile.gem.animate(
      [
        {transform:'scale(1)',opacity:1,offset:0},
        {transform:'scale(1.18)',opacity:1,offset:.38},
        {transform:'scale(.18)',opacity:0,offset:1}
      ],
      {duration:190,easing:'cubic-bezier(.3,.82,.35,1)',fill:'forwards'}
    );
    popAnimations.push(safeFinished(anim));
  }

  vibrate(comboDepth>=3?20:10);
  await Promise.all(popAnimations);

  await collapseAndRefill(remove);
}

function neighborReact(remove){
  const neighbors=new Set();
  for(const tile of remove){
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const r=tile.row+dr,c=tile.col+dc;
      if(r>=0&&r<SIZE&&c>=0&&c<SIZE){
        const t=board[r][c];
        if(t && !remove.has(t)) neighbors.add(t);
      }
    }
  }

  for(const tile of neighbors){
    tile.gem.animate(
      [
        {transform:'scale(1) rotate(0)'},
        {transform:'scale(.97) rotate(-1.8deg)'},
        {transform:'scale(1.02) rotate(1.2deg)'},
        {transform:'scale(1) rotate(0)'}
      ],
      {duration:190,easing:'ease-out'}
    );
  }
}

async function collapseAndRefill(remove){
  const animations=[];
  const removedByCol=Array.from({length:SIZE},()=>[]);

  for(const tile of remove){
    removedByCol[tile.col].push(tile);
  }

  for(let c=0;c<SIZE;c++){
    const removed=new Set(removedByCol[c]);
    const survivors=[];

    for(let r=SIZE-1;r>=0;r--){
      const tile=board[r][c];
      if(tile && !removed.has(tile)) survivors.push(tile);
    }

    const holes=SIZE-survivors.length;
    const column=Array(SIZE).fill(null);

    let write=SIZE-1;
    for(const tile of survivors){
      const oldRow=tile.row;
      const newRow=write--;
      column[newRow]=tile;

      if(oldRow!==newRow){
        const distance=newRow-oldRow;
        tile.row=newRow;
        tile.col=c;
        animations.push(animateFall(tile,oldRow,newRow,distance,false));
      }
    }

    const recyclable=removedByCol[c];
    for(let r=holes-1;r>=0;r--){
      const tile=recyclable.pop();
      if(!tile) continue;

      tile.type=randomType();
      tile.special=null;
      tile.row=r;
      tile.col=c;
      setTileVisual(tile);

      tile.gem.getAnimations().forEach(a=>a.cancel());
      tile.gem.style.opacity='1';
      tile.gem.style.transform='';

      const startRow=-(holes-r)-1;
      tile.el.style.transform=tileTransform(startRow,c);
      column[r]=tile;
      animations.push(animateSpawnFall(tile,startRow,r,holes-r));
    }

    for(let r=0;r<SIZE;r++) board[r][c]=column[r];
  }

  await Promise.all(animations);
}

async function animateFall(tile,oldRow,newRow,distance){
  const start=tileTransform(oldRow,tile.col);
  const end=tileTransform(newRow,tile.col);
  const p=pos(newRow,tile.col);
  const duration=Math.min(340,155+distance*34);

  const anim=tile.el.animate(
    [
      {transform:start,offset:0},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(1.01,.985)`,offset:.82},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(1.06,.92)`,offset:.91},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(.98,1.035)`,offset:.97},
      {transform:end,offset:1}
    ],
    {duration,easing:'cubic-bezier(.16,.72,.18,1)',fill:'forwards'}
  );

  await safeFinished(anim);
  tile.el.style.transform=end;
}

async function animateSpawnFall(tile,startRow,newRow,distance){
  const start=tileTransform(startRow,tile.col,.86,.86);
  const p=pos(newRow,tile.col);
  const end=tileTransform(newRow,tile.col);
  const duration=Math.min(390,205+distance*36);

  const anim=tile.el.animate(
    [
      {transform:start,opacity:.25,offset:0},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(1.015,.985)`,opacity:1,offset:.82},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(1.07,.91)`,opacity:1,offset:.91},
      {transform:`translate3d(${p.x}px,${p.y}px,0) scale(.98,1.04)`,opacity:1,offset:.97},
      {transform:end,opacity:1,offset:1}
    ],
    {duration,easing:'cubic-bezier(.14,.72,.18,1)',fill:'forwards'}
  );

  await safeFinished(anim);
  tile.el.style.transform=end;
  tile.el.style.opacity='1';
}

function transformSpecial(tile,special){
  tile.gem.animate(
    [
      {transform:'scale(.82) rotate(-6deg)'},
      {transform:'scale(1.18) rotate(5deg)'},
      {transform:'scale(.97) rotate(-2deg)'},
      {transform:'scale(1) rotate(0)'}
    ],
    {duration:340,easing:'cubic-bezier(.16,.84,.22,1)'}
  );

  const p=shellPointForCell(tile.row,tile.col);
  ringBurst(p.x,p.y,COLORS[tile.type],42);
  particleBurst(p.x,p.y,tile.type,14);
}

function specialEffect(tile){
  const p=shellPointForCell(tile.row,tile.col);
  if(tile.special==='row'){
    addBeam(p.x,p.y,0,Math.PI,COLORS[tile.type],220);
    addBeam(p.x,p.y,0,0,COLORS[tile.type],220);
  }else if(tile.special==='col'){
    addBeam(p.x,p.y,0,-Math.PI/2,COLORS[tile.type],220);
    addBeam(p.x,p.y,0,Math.PI/2,COLORS[tile.type],220);
  }else if(tile.special==='bomb'){
    ringBurst(p.x,p.y,COLORS[tile.type],105);
    particleBurst(p.x,p.y,tile.type,24);
  }
}

function comboFeedback(depth){
  const labels=['','','Sweet!','Great!','Amazing!','Juicy!','Wild!'];
  const text=depth<labels.length?labels[depth]:`${depth}× Chain!`;
  const el=document.createElement('div');
  el.className='combo-text';
  el.textContent=text;
  textLayer.appendChild(el);

  const anim=el.animate(
    [
      {opacity:0,transform:'translate(-50%,14px) scale(.65)',offset:0},
      {opacity:1,transform:'translate(-50%,-2px) scale(1.08)',offset:.28},
      {opacity:1,transform:'translate(-50%,-8px) scale(1)',offset:.72},
      {opacity:0,transform:'translate(-50%,-24px) scale(.96)',offset:1}
    ],
    {duration:650,easing:'cubic-bezier(.2,.88,.24,1)'}
  );
  anim.finished.finally(()=>el.remove());

  shell.animate(
    depth>=4
      ? [
          {transform:'scale(1) rotate(0)'},
          {transform:'scale(1.014) rotate(-.25deg)'},
          {transform:'scale(.997) rotate(.18deg)'},
          {transform:'scale(1) rotate(0)'}
        ]
      : [
          {transform:'scale(1)'},
          {transform:'scale(1.01)'},
          {transform:'scale(1)'}
        ],
    {duration:depth>=4?250:190,easing:'ease-out'}
  );

  if(depth>=3) flashScreen(depth>=5?.5:.28);
}

function floatingScore(x,y,text){
  const el=document.createElement('div');
  el.className='score-pop';
  el.textContent=text;
  el.style.left=`${x+24}px`;
  el.style.top=`${y+52}px`;
  textLayer.appendChild(el);

  const anim=el.animate(
    [
      {opacity:0,transform:'translate(-50%,-25%) scale(.7)'},
      {opacity:1,transform:'translate(-50%,-60%) scale(1.14)',offset:.25},
      {opacity:0,transform:'translate(-50%,-160%) scale(.92)'}
    ],
    {duration:650,easing:'ease-out'}
  );
  anim.finished.finally(()=>el.remove());
}

function flashScreen(intensity=.3){
  flashEl.getAnimations().forEach(a=>a.cancel());
  flashEl.animate(
    [
      {opacity:0},
      {opacity:intensity,offset:.28},
      {opacity:0}
    ],
    {duration:240,easing:'ease-out'}
  );
}

function vibrate(ms){
  if(navigator.vibrate) navigator.vibrate(ms);
}

function safeFinished(animation){
  return animation.finished.catch(()=>{});
}

function waitFrameTime(ms){
  return new Promise(resolve=>{
    const start=performance.now();
    function tick(now){
      if(now-start>=ms) resolve();
      else requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function animateNumber(el,from,to,duration){
  const start=performance.now();
  function tick(now){
    const p=Math.min(1,(now-start)/duration);
    const e=1-Math.pow(1-p,3);
    const value=Math.round(from+(to-from)*e);
    el.textContent=value;
    if(debugProgress===null) applyProgress(Math.min(100,value/LEVEL_TARGET*100),p>.72);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function applyProgress(value,celebrate=true){
  const p=Math.max(0,Math.min(100,Number(value)||0));
  progressFill.style.transform=`scaleX(${Math.max(.001,p/100)}) translateZ(0)`;
  progressPercent.textContent=`${Math.round(p)}%`;

  progressFill.classList.remove('t1','t2','t3','done');
  if(p>=100) progressFill.classList.add('t3','done');
  else if(p>=75) progressFill.classList.add('t3');
  else if(p>=50) progressFill.classList.add('t2');
  else if(p>=25) progressFill.classList.add('t1');

  [25,50,75].forEach((point,i)=>{
    const hit=p>=point;
    mileEls[i].classList.toggle('hit',hit);

    if(hit&&!reachedProgress.has(point)){
      reachedProgress.add(point);
      if(celebrate) milestoneCelebrate(i+1);
    }
    if(!hit) reachedProgress.delete(point);
  });

  if(p>=100&&!reachedProgress.has(100)){
    reachedProgress.add(100);
    if(celebrate) completeCelebrate();
  }
  if(p<100) reachedProgress.delete(100);

  const slider=document.getElementById('debugSlider');
  const out=document.getElementById('debugValue');
  if(slider&&document.activeElement!==slider) slider.value=Math.round(p);
  if(out) out.textContent=`${Math.round(p)}%`;
}

function updateProgressFromScore(){
  if(debugProgress===null) applyProgress(Math.min(100,score/LEVEL_TARGET*100),true);
}

function milestoneCelebrate(index){
  const el=mileEls[index-1];
  el.animate(
    [
      {transform:'translate(-50%,-50%) scale(1) rotate(0)'},
      {transform:'translate(-50%,-50%) scale(1.55) rotate(12deg)',offset:.45},
      {transform:'translate(-50%,-50%) scale(1.12) rotate(0)'}
    ],
    {duration:560,easing:'cubic-bezier(.16,.84,.22,1)'}
  );

  const track=document.getElementById('progressTrack').getBoundingClientRect();
  const shellRect=shell.getBoundingClientRect();
  const p={
    x:track.left-shellRect.left+track.width*([.25,.5,.75][index-1]),
    y:track.top-shellRect.top+track.height/2
  };

  ringBurst(p.x,p.y,[COLORS[4],COLORS[6],COLORS[2]][index-1],42+index*10);
  particleBurst(p.x,p.y,[4,6,2][index-1],12+index*4);
  progressToast(['Bonus I!','Bonus II!','Bonus III!'][index-1]);

  if(index>=2) shell.animate([{transform:'scale(1)'},{transform:'scale(1.01)'},{transform:'scale(1)'}],{duration:180});
  if(index===3) flashScreen(.32);
  vibrate(14+index*5);
}

function completeCelebrate(){
  progressToast('Board Complete!');
  flashScreen(.55);
  shell.animate(
    [
      {transform:'scale(1)'},
      {transform:'scale(1.018)',offset:.35},
      {transform:'scale(.996)',offset:.72},
      {transform:'scale(1)'}
    ],
    {duration:300,easing:'ease-out'}
  );

  for(let i=0;i<6;i++){
    requestAnimationFrame(()=>{
      const x=45+Math.random()*(geom.shellWidth-90);
      const y=-18+Math.random()*45;
      particleBurst(x,y,2,16);
      ringBurst(x,y,COLORS[2],48);
    });
  }
  vibrate(30);
}

function progressToast(text){
  const el=document.createElement('div');
  el.className='combo-text';
  el.style.top='2%';
  el.textContent=text;
  textLayer.appendChild(el);

  const a=el.animate(
    [
      {opacity:0,transform:'translate(-50%,10px) scale(.72)'},
      {opacity:1,transform:'translate(-50%,-2px) scale(1.08)',offset:.3},
      {opacity:1,transform:'translate(-50%,-6px) scale(1)',offset:.7},
      {opacity:0,transform:'translate(-50%,-20px) scale(.96)'}
    ],
    {duration:720,easing:'cubic-bezier(.2,.88,.24,1)'}
  );
  a.finished.finally(()=>el.remove());
}

/* ================= CANVAS FX ENGINE ================= */

function particleBurst(shellX,shellY,type,count=12){
  const off=canvasOffset();
  const x=shellX+off.x;
  const y=shellY+off.y;
  const color=COLORS[type%COLORS.length];

  const adaptive = perf.frame>13 ? .65 : perf.frame>10 ? .82 : 1;
  const n=Math.max(4,Math.round(count*adaptive));

  for(let i=0;i<n;i++){
    const angle=Math.PI*2*(i/n)+Math.random()*.45;
    const speed=55+Math.random()*95;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed-18,
      life:0,
      ttl:.42+Math.random()*.24,
      size:2.4+Math.random()*3.2,
      color,
      spin:Math.random()*6-3
    });
  }
}

function ringBurst(shellX,shellY,color,maxRadius=58){
  const off=canvasOffset();
  rings.push({
    x:shellX+off.x,
    y:shellY+off.y,
    life:0,
    ttl:.42,
    color,
    maxRadius
  });
}

function addBeam(shellX,shellY,length,angle,color,duration=210){
  const off=canvasOffset();
  const extent=Math.max(geom.shellWidth,geom.shellHeight)*1.15;
  beams.push({
    x:shellX+off.x,
    y:shellY+off.y,
    angle,
    length:length||extent,
    life:0,
    ttl:duration/1000,
    color
  });
}

function drawFx(dt){
  const rect=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,rect.width,rect.height);

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life+=dt;
    if(p.life>=p.ttl){
      particles.splice(i,1);
      continue;
    }

    const t=p.life/p.ttl;
    p.vy+=240*dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    ctx.globalAlpha=(1-t)*(1-t);
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*(1-.6*t),0,Math.PI*2);
    ctx.fill();
  }

  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.life+=dt;
    if(r.life>=r.ttl){
      rings.splice(i,1);
      continue;
    }

    const t=r.life/r.ttl;
    ctx.globalAlpha=1-t;
    ctx.strokeStyle=r.color;
    ctx.lineWidth=3*(1-t)+.5;
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.maxRadius*(.18+.82*t),0,Math.PI*2);
    ctx.stroke();
  }

  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i];
    b.life+=dt;
    if(b.life>=b.ttl){
      beams.splice(i,1);
      continue;
    }

    const t=b.life/b.ttl;
    const eased=1-Math.pow(1-t,3);
    const len=b.length*eased;
    const x2=b.x+Math.cos(b.angle)*len;
    const y2=b.y+Math.sin(b.angle)*len;

    ctx.globalAlpha=(1-t)*.9;
    ctx.strokeStyle=b.color;
    ctx.lineCap='round';

    ctx.lineWidth=14*(1-t)+2;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(x2,y2);
    ctx.stroke();

    ctx.globalAlpha=(1-t);
    ctx.strokeStyle='#FFFFFF';
    ctx.lineWidth=3.5*(1-t)+1;
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(x2,y2);
    ctx.stroke();
  }

  ctx.globalAlpha=1;
}

function fxLoop(now){
  let dt=(now-perf.last)/1000;
  if(dt>0.05) dt=0.05;

  const ms=dt*1000;
  perf.frame=ms;
  perf.worst=Math.max(perf.worst,ms);
  perf.samples.push(ms);
  if(perf.samples.length>90) perf.samples.shift();

  const avg=perf.samples.reduce((a,b)=>a+b,0)/Math.max(1,perf.samples.length);
  perf.fps=avg>0?1000/avg:0;

  const hzCandidates=[60,90,120,144];
  if(perf.samples.length>30){
    perf.hz=hzCandidates.reduce((best,hz)=>
      Math.abs(1000/hz-avg)<Math.abs(1000/best-avg)?hz:best
    ,60);
  }

  drawFx(dt);
  perf.last=now;
  requestAnimationFrame(fxLoop);
}

function updatePerfUI(){
  document.getElementById('fpsOut').textContent=Math.round(perf.fps);
  document.getElementById('frameOut').textContent=`${perf.frame.toFixed(1)} ms`;
  document.getElementById('worstOut').textContent=`${perf.worst.toFixed(1)} ms`;
  document.getElementById('hzOut').textContent=perf.hz;
  document.getElementById('particleOut').textContent=particles.length;
  document.getElementById('tileOut').textContent=tiles.length;
  requestAnimationFrame(updatePerfUI);
}

/* ================= HINT / RESET / DEBUG ================= */

function findPossibleMove(){
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      for(const [dr,dc] of [[0,1],[1,0]]){
        const nr=r+dr,nc=c+dc;
        if(nr>=SIZE||nc>=SIZE) continue;

        const a=board[r][c],b=board[nr][nc];
        swapBoardRefs(a,b);
        const has=findMatchGroups().length>0;
        swapBoardRefs(a,b);

        if(has) return [a,b];
      }
    }
  }
  return null;
}

function hint(){
  if(locked) return;
  const move=findPossibleMove();
  if(!move){
    shuffleBoard();
    return;
  }

  for(const tile of move){
    tile.gem.animate(
      [
        {transform:'scale(1)'},
        {transform:'scale(1.13)',offset:.35},
        {transform:'scale(.97)',offset:.65},
        {transform:'scale(1)'}
      ],
      {duration:720,easing:'ease-in-out',iterations:2}
    );
  }
  statusTitle.textContent='Hint';
  statusSub.textContent='Try the pulsing pair';
}

function shuffleBoard(){
  if(locked) return;

  let flat=tiles.slice();
  for(let i=flat.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [flat[i],flat[j]]=[flat[j],flat[i]];
  }

  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      const tile=flat[r*SIZE+c];
      board[r][c]=tile;
      const oldRow=tile.row;
      const oldCol=tile.col;
      tile.row=r;
      tile.col=c;
      tile.special=null;
      setTileVisual(tile);

      const a=tile.el.animate(
        [
          {transform:tileTransform(oldRow,oldCol),opacity:.7},
          {transform:tileTransform(r,c),opacity:1}
        ],
        {duration:300+Math.random()*80,easing:'cubic-bezier(.18,.8,.2,1)',fill:'forwards'}
      );
      a.finished.finally(()=>tile.el.style.transform=tileTransform(r,c));
    }
  }

  if(findMatchGroups().length || !findPossibleMove()){
    setTimeout(shuffleBoard,360);
  }
}

function resetGame(){
  locked=false;
  clearSelection();
  score=0;
  moves=30;
  comboDepth=0;
  lastSwap=null;
  debugProgress=null;
  reachedProgress.clear();

  scoreEl.textContent='0';
  movesEl.textContent='30';
  statusTitle.textContent='Make a match';
  statusSub.textContent='Swipe or tap neighbouring tiles';

  generateInitialBoard();
  requestAnimationFrame(()=>{
    refreshGeometry();
    for(const tile of tiles){
      tile.el.style.opacity='1';
      tile.el.style.transform=tileTransform(tile.row,tile.col);
      tile.gem.animate(
        [
          {transform:'scale(.7)',opacity:0},
          {transform:'scale(1.08)',opacity:1,offset:.72},
          {transform:'scale(1)',opacity:1}
        ],
        {duration:280+tile.row*16,easing:'cubic-bezier(.16,.84,.22,1)'}
      );
    }
    applyProgress(0,false);
  });
}

document.getElementById('hintBtn').addEventListener('click',hint);
document.getElementById('resetBtn').addEventListener('click',resetGame);

document.getElementById('debugToggle').addEventListener('click',()=>{

});

  applyProgress(debugProgress,true);
});

document.querySelectorAll('[data-progress]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    debugProgress=Number(btn.dataset.progress);
    applyProgress(debugProgress,true);
  });
});

  tile.special='col';
  setTileVisual(tile);
  specialEffect(tile);
  setTimeout(()=>{tile.special=old;setTileVisual(tile)},700);
});

document.getElementById('testBomb').addEventListener('click',()=>{
  const tile=board[4][4];

  tile.special='bomb';

});

document.getElementById('testBurst').addEventListener('click',()=>{
  const p=shellPointForCell(3,3);
  particleBurst(p.x,p.y,4,24);
  ringBurst(p.x,p.y,COLORS[4],72);
});

document.getElementById('testImpact').addEventListener('click',()=>{
  shell.animate(
    [
      {transform:'scale(1)'},
      {transform:'scale(1.018) rotate(-.25deg)',offset:.35},
      {transform:'scale(.996) rotate(.18deg)',offset:.7},
      {transform:'scale(1) rotate(0)'}
    ],
    {duration:280,easing:'ease-out'}
  );
  flashScreen(.42);
  vibrate(24);
});

document.getElementById('testStress').addEventListener('click',()=>{
  for(let i=0;i<10;i++){
    requestAnimationFrame(()=>{
      const p=shellPointForCell(Math.floor(Math.random()*SIZE),Math.floor(Math.random()*SIZE));
      particleBurst(p.x,p.y,Math.floor(Math.random()*TYPES),22);
      if(i%2===0) ringBurst(p.x,p.y,COLORS[i%COLORS.length],60+Math.random()*45);
    });
  }
  comboFeedback(6);
});

document.getElementById('testScore').addEventListener('click',()=>{
  debugProgress=null;
  const from=score;
  score+=1500;
  animateNumber(scoreEl,from,score,360);
});

document.getElementById('useLive').addEventListener('click',()=>{
  debugProgress=null;
  applyProgress(Math.min(100,score/LEVEL_TARGET*100),false);
});

document.getElementById('shuffleBtn').addEventListener('click',shuffleBoard);
document.getElementById('resetPerf').addEventListener('click',()=>{
  perf.worst=0;
  perf.samples.length=0;
});

window.addEventListener('resize',()=>{
  requestAnimationFrame(refreshGeometry);
},{passive:true});

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    perf.last=performance.now();
    perf.samples.length=0;
  }
});

resetGame();
requestAnimationFrame(fxLoop);
requestAnimationFrame(updatePerfUI);
</script>
